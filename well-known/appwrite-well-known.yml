note: 'Appwrite serves no security.txt, api-catalog or ai-plugin.json on any host, and no A2A agent card
  anywhere. What it does serve is an agent-discovery cluster on appwrite.io — an SEP-1649 MCP Server Card,
  a Domain AI Catalog pointing at it, and an Agent Skills 0.2.0 discovery index — all three advertised
  from https://appwrite.io/llms.txt rather than from a conventional /.well-known probe path. mcp.appwrite.io
  publishes full RFC 8414 authorization-server metadata and an RFC 9728 protected-resource document; the
  authorization server itself lives on a third host (fra.cloud.appwrite.io) and serves its own OIDC discovery
  document and JWKS. Every 404 recorded below returned the site''s HTML SPA shell, not a document.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
