  group: Messaging
  description: 'This event triggers when a message is updated. Returns [Message Object](/docs/references/cloud/models/message)
    ### Known limitations When events fire, only existing subscriptions for that event will receive the update.
    If your client or server side integrations lose network connection temporarily, delivery of the event is not
    guaranteed. For self-hosted instances, when the Appwrite containers are shut down and restarted, events with
    pending webhooks and subscription updates will not be delivered. A change to a resource can cause multiple events
    to fire. For example adding a new row with ID `"lion-king"` to a table with the ID `"movies"` will cause all
    of the below events to fire. ```json { "events": [ "tablesdb.default.tables.movies.rows.lion-king.create", "tablesdb.*.tables.*.rows.*.create",
    "tablesdb.default.tables.*.rows.lion-king.create", "tablesdb.*.tables.*.rows.lion-king.create", "tablesdb.*.tables.movies.rows.lion-king.create",
    "tablesdb.default.tables.movies.rows.*.create", "tablesdb.*.tables.movies.rows.*.create", "tablesdb.default.tables.*.rows.*.create",
    "tablesdb.default.tables.movies.rows.lion-king", "tablesdb.*.tables.*.rows.*", "tablesdb.default.tables.*.rows.lion-king",
    "tablesdb.*.tables.*.rows.lion-king", "tablesdb.*.tables.movies.rows.lion-king", "tablesdb.default.tables.movies.rows.*",
    "tablesdb.*.tables.movies.rows.*", "tablesdb.default.tables.*.rows.*", "tablesdb.default.tables.movies", "tablesdb.*.tables.*",
    "tablesdb.default.tables.*", "tablesdb.*.tables.movies", "tablesdb.default", "tablesdb.*" ] } ```'
