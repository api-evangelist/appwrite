provider: Appwrite
providerId: appwrite
type: Webhooks
note: Appwrite publishes NO AsyncAPI document. What it publishes is a single event vocabulary shared by three delivery
  channels — Webhooks (HTTP POST), Functions (event triggers) and Realtime (WebSocket channels) — so one event name
  subscribes you through whichever channel you pick. The catalogue below is that vocabulary, transcribed from Appwrite's
  own events page. The realtime channel surface is described separately in asyncapi/appwrite-asyncapi.yml, which
  is API Evangelist's AsyncAPI description of Appwrite's WebSocket protocol, not a provider publication.
delivery_channels:
- name: Webhooks
  transport: HTTP POST
  docs: https://appwrite.io/docs/apis/webhooks
- name: Functions
  transport: event-triggered execution
  docs: https://appwrite.io/docs/products/functions
- name: Realtime
  transport: WebSocket
  docs: https://appwrite.io/docs/apis/realtime
subscription:
  wildcards: Use * in place of a resource ID to subscribe to every resource of that type.
  action_filters:
  - create
  - update
  - upsert
  - delete
  example: users.*.create subscribes to every user creation; tablesdb.*.tables.*.rows.*.upsert to every row upsert.
webhook_delivery:
  method: POST
  user_agent: Appwrite-Server
  payload: Mirrors the REST payload of the resource the event names.
  headers:
  - name: X-Appwrite-Webhook-Id
    description: ID of the webhook that triggered the delivery.
  - name: X-Appwrite-Webhook-Events
    description: Names of the events that triggered this delivery.
  - name: X-Appwrite-Webhook-Name
    description: Name of the webhook as configured.
  - name: X-Appwrite-Webhook-User-Id
    description: User ID of the user who triggered the event; empty when an API key triggered it, and absent for
      guest-user events such as account.create.
  - name: X-Appwrite-Webhook-Project-Id
    description: ID of the project that owns the webhook.
  - name: X-Appwrite-Webhook-Signature
    description: HMAC-SHA1 signature of the payload.
  signature:
    header: X-Appwrite-Webhook-Signature
    algorithm: HMAC-SHA1
    encoding: base64
    signed_value: webhook URL concatenated with the raw request body, no separator
    key: the webhook's signature key, shown in the Console and returned once on webhooksCreate
    note: SHA-1, not SHA-256 — worth knowing before wiring a verifier.
  management_api:
    scopes:
    - webhooks.read
    - webhooks.write
    operations:
    - webhooksList
    - webhooksCreate
    - webhooksGet
    - webhooksUpdate
    - webhooksUpdateSecret
    - webhooksDelete
    openapi: openapi/appwrite-webhooks-api-openapi.yml
    secret_note: The signing secret is returned only on create; it is not readable again afterwards.
  options:
  - Certificate verification (SSL/TLS) toggle
  - HTTP authentication credentials on the endpoint
