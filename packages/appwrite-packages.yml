note: >-
  Every package below is first-party: each is published from an appwrite/sdk-for-* repository in the
  Appwrite GitHub organisation and listed on https://appwrite.io/docs/sdks. Appwrite cut a coordinated
  release across the whole SDK fleet on 2026-09-02 alongside the Appwrite 2.0 API, with a second wave on
  2026-09-07 — no first-party SDK is stale against the API it wraps. Two currency traps worth recording:
  search.maven.org reports io.appwrite:sdk-for-android at 8.1.0/2025-05, which is WRONG — the authoritative
  repo1.maven.org maven-metadata.xml says 27.2.0/2026-09-07; and proxy.golang.org answers
  github.com/appwrite/sdk-for-go with v1.0.0 because the live module is the /v7 major path. The Swift
  and Apple SDKs distribute only through Swift Package Manager, which has no versioned metadata endpoint,
  so their versions are read from the GitHub release tag instead.
