remediation_note: 'Appwrite documents two client-side practices alongside the table: surface user-friendly messages
  keyed on `type` rather than echoing `message`, and treat 429 as a signal to back off and cache rather than retry
  immediately — see rate-limits/appwrite-rate-limits.yml for the headers that carry the reset time.'
