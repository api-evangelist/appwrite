provider: Appwrite
providerId: appwrite
format: custom
format_note: 'Appwrite does NOT serve RFC 9457 application/problem+json. Its error envelope is a plain JSON object
  with three fields — message, type, code — served as application/json, where `code` repeats the HTTP status and
  `type` is a stable machine-readable slug. That slug is the useful part: it is what lets a client distinguish the
  many different 400s from each other, and it is the field an agent should branch on rather than the status code.'
envelope:
  content_type: application/json
  fields:
  - name: message
    type: string
    description: Human-readable explanation of the failure.
  - name: type
    type: string
    description: Stable machine-readable error type slug, e.g. argument_invalid.
  - name: code
    type: integer
    description: Repeats the HTTP status code.
  example:
    message: 'Invalid id: Parameter must be a valid number'
    type: argument_invalid
    code: 400
http_status_codes:
- status: 200
  reason: OK
  description: Success!
- status: 201
  reason: Created
  description: The requested resource has been created successfully.
- status: 202
  reason: Accepted
  description: The requested change has been accepted for processing but has not been completed.
- status: 204
  reason: No Content
  description: The server has successfully fulfilled the request and that there is no additional content to send
    in the response payload body. This status will usually return on successful delete operations.
- status: 301
  reason: Moved Permanently
  description: The URL of the requested resource has been changed permanently. The new URL is given in the response.
- status: 304
  reason: Not Modified
  description: There was no new data to return.
- status: 400
  reason: Bad Request
  description: The request was invalid or cannot be otherwise served. An accompanying error message will explain
    further. Requests with wrong or invalid input will yield this response.
- status: 401
  reason: Unauthorized
  description: Missing or incorrect authentication credentials can happen when the API key or user permission is
    not sufficient.
- status: 403
  reason: Forbidden
  description: The request is understood, but it has been refused, or access is not allowed. An accompanying error
    message will explain why. Make sure to register your app in your project's dashboard platform list.
- status: 404
  reason: Not Found
  description: The URI requested is invalid or the resource requested, such as a user, does not exist.
- status: 409
  reason: Conflict
  description: This response is sent when a request conflicts with the current state of the server. This status
    code will usually appear when you're trying to create an already existing resource.
- status: 413
  reason: Payload Too Large
  description: This indicates that the request entity is larger than limits defined by server. This status code
    will usually appear happen when uploading a file or function that is too large
- status: 416
  reason: Invalid Range
  description: Invalid value in the range or content-range headers. Usually returned while uploading or downloading
    files using the range header but the provided range value is not valid.
- status: 429
  reason: Too Many Requests
  description: Returned in when a request cannot be served due to the application's rate limit having been exhausted
    for the resource. See [Rate Limits](/docs/advanced/security/rate-limits).
- status: 500
  reason: Internal Server Error
  description: Something is broken. Contact our [team](/support), or raise a [GitHub issue](https://github.com/appwrite/appwrite/issues/new).
- status: 501
  reason: Not Implemented
  description: The feature is not implemented. Usually returned when the project owner has disabled an auth method
    or an entire service.
- status: 503
  reason: Service Unavailable
  description: The Appwrite servers are up but overloaded with requests. Try again later.
- status: 504
  reason: Gateway timeout
  description: The Appwrite servers are up, but the request couldn't be serviced due to some failure within the
    stack. Try again later.
