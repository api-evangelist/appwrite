specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Appwrite
providerId: appwrite
generated: '2026-09-12'
method: searched
source: >-
  https://appwrite.io/pricing (read 2026-09-12), corroborated by
  https://appwrite.io/docs/advanced/billing/free, /billing/pro, /billing/enterprise,
  /billing/uptime-sla and /billing/compute.
created: '2026-05-04'
modified: '2026-09-12'
tags:
  - Applications
  - Backends
  - Mobile
  - Open Source
description: >-
  Appwrite Cloud plans as published on the pricing page. Plans apply at the ORGANIZATION level;
  resources are shared across projects on Free and allocated per project on paid plans. Every quota
  resets per billing period. This file replaces a 2026-05-04 scaffold that carried invented request
  quotas and TBD prices — none of those numbers were Appwrite's.
plan_count: 4
currency: USD
billing_period: month
note: >-
  Appwrite's meters are resource-shaped (bandwidth, storage, executions, MAU, database reads and
  writes, realtime connections, embedding tokens), not request-shaped — there is no "API calls per
  month" quota anywhere in Appwrite's pricing. The uptime-SLA page names a fourth tier, Scale, that
  sits between Pro and Enterprise with a 99.9% commitment; the pricing page did not price it at the
  time of reading, so it is recorded with a null price rather than a guess.
plans:
  - id: appwrite-free
    name: Free
    type: freemium
    price: '0.00'
    currency: USD
    billing_period: month
    description: >-
      Free plan for hobby projects. One organization and two projects per account; projects pause
      after a week of inactivity and are deleted 90 days later. Resources are shared across projects.
    entries:
      - name: bandwidth
        label: Bandwidth
        type: quota
        limit: 5
        unit: GB
        timeFrame: month
      - name: storage
        label: Storage
        type: quota
        limit: 2
        unit: GB
      - name: executions
        label: Function executions
        type: quota
        limit: 750000
        timeFrame: month
      - name: mau
        label: Monthly active users
        type: quota
        limit: 75000
        timeFrame: month
      - name: database_reads
        label: Database reads
        type: quota
        limit: 250000
        timeFrame: month
      - name: database_writes
        label: Database writes
        type: quota
        limit: 250000
        timeFrame: month
      - name: embedding_tokens
        label: Embedding tokens (per model)
        type: quota
        limit: 1000000
        timeFrame: month
      - name: realtime_connections
        label: Concurrent realtime connections
        type: quota
        limit: 2
      - name: messages
        label: Messages
        type: quota
        limit: 1000
        timeFrame: month
    limits:
      databases_per_project: 1
      buckets_per_project: 3
      functions_per_project: 2
      platforms_per_project: 3
      webhooks_per_project: 2
      teams_per_project: 100
      projects: 2
      organizations: 1
    elements:
      - name: Community support only
      - name: No overage purchasing — API access is denied at the limit
      - name: No uptime SLA
  - id: appwrite-pro
    name: Pro
    type: paid
    price: '25.00'
    currency: USD
    billing_period: month
    description: >-
      Production plan with dedicated resources per project and automatic scaling up to a budget cap.
      Includes $10 of compute credits toward database usage.
    entries:
      - name: bandwidth
        label: Bandwidth
        type: quota
        limit: 2
        unit: TB
        timeFrame: month
      - name: storage
        label: Storage
        type: quota
        limit: 150
        unit: GB
      - name: executions
        label: Function executions
        type: quota
        limit: 3500000
        timeFrame: month
      - name: mau
        label: Monthly active users
        type: quota
        limit: 200000
        timeFrame: month
      - name: database_reads
        label: Database reads
        type: quota
        limit: 1750000
        timeFrame: month
      - name: database_writes
        label: Database writes
        type: quota
        limit: 750000
        timeFrame: month
      - name: embedding_tokens
        label: Embedding tokens (per model)
        type: quota
        limit: 10000000
        timeFrame: month
      - name: realtime_connections
        label: Concurrent realtime connections
        type: quota
        limit: 500
      - name: messages
        label: Messages
        type: quota
        limit: -1
        note: Unlimited
    overage:
      - name: bandwidth
        price: '15.00'
        per: 100 GB per month
      - name: storage
        price: '2.80'
        per: 100 GB
      - name: database_reads
        price: '0.060'
        per: 100K reads
      - name: database_writes
        price: '0.10'
        per: 100K writes
      - name: realtime_connections
        price: '5.00'
        per: 1,000 connections
      - name: realtime_messages
        price: '2.50'
        per: 1M messages
      - name: executions
        price: '2.00'
        per: 1M executions
      - name: compute
        price: '0.06'
        per: GB-hour
    limits:
      databases_per_project: -1
      buckets_per_project: -1
      functions_per_project: -1
      backup_retention_days: 7
    elements:
      - name: Email support
      - name: Daily backups, 7-day retention
      - name: Dedicated resources per project
      - name: Budget cap to bound automatic scaling
      - name: 99.5% uptime SLA
  - id: appwrite-scale
    name: Scale
    type: paid
    price: null
    currency: USD
    billing_period: month
    description: >-
      Tier named in Appwrite's Uptime SLA and Free-plan downgrade documentation, carrying a 99.9%
      monthly uptime commitment. Price not published on the pricing page as read on 2026-09-12.
    entries: []
    elements:
      - name: 99.9% uptime SLA
    note: Recorded because Appwrite's own SLA and billing pages price commitments against it; the
      price is genuinely absent rather than unknown to us.
  - id: appwrite-enterprise
    name: Enterprise
    type: enterprise
    price: custom
    currency: USD
    billing_period: negotiated
    description: >-
      Custom-negotiated plan. All Pro features plus compliance attestations, extended retention and
      named support. Contact sales at https://appwrite.io/contact-us/enterprise.
    entries: []
    elements:
      - name: All Pro features
      - name: 99.95% uptime SLA
      - name: 24/7 Slack support and a success manager
      - name: SOC 2, HIPAA and BAA
      - name: 90-day log retention
      - name: Custom backup policies
      - name: Custom hosting and training
add_ons:
  - name: BAA (HIPAA Business Associate Agreement)
    availability: self-serve from the Console since 2026-06-10
    price: not published
    note: Named in the Uptime SLA as a non-usage-based add-on included in service-credit calculations.
  - name: SOC 2
    availability: Enterprise
    price: not published
overage_policy: >-
  On Pro, additional resources are purchased automatically as limits are exceeded, until the
  organization's budget cap is reached. On Free there is no overage: reaching a limit disables the
  affected capability (uploads, executions, realtime, new accounts) until the next billing period,
  and exceeding bandwidth denies API access outright.
sla: lifecycle/appwrite-lifecycle.yml
rate_limits: rate-limits/appwrite-rate-limits.yml
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
