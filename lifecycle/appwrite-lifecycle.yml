deprecation:
  policy_published: true
  policy_url: https://appwrite.io/docs/apis/release-policy
  phases:
    - name: Support
      scope: Continued bug fixes and security updates.
    - name: Extended security support
      scope: Security updates only.
  headers:
    sunset: false
    deprecation: false
    note: >-
      Appwrite publishes a written deprecation and support policy but does NOT emit RFC 8594
      Sunset or Deprecation response headers, and no operation in the 1,022-operation spec carries
      `deprecated: true`. Deprecations are announced in the changelog and in the docs page for the
      affected feature, which a human reads and an agent does not.
  notice: >-
    Appwrite states it gives early notice and introduces breaking changes slowly, and continues to
    support the last five major SDK versions specifically to give developers time to adjust.
  announced_deprecations:
    - item: Dev keys
      status: creation paused
      announced: '2026-07-22'
      detail: >-
        Creation of new dev keys is paused and dev keys will be removed. Dev keys were the documented
        way for a client app to bypass rate limits in development (X-Appwrite-Dev-Key header).
      docs: https://appwrite.io/docs/advanced/security/dev-keys
    - item: Credential minting by API keys and JWTs
      status: removed
      announced: '2026-08-17'
      detail: API keys and JWTs can no longer mint further credentials.
      docs: https://appwrite.io/changelog/entry/2026-08-17
    - item: Legacy Databases API
      status: superseded
      detail: >-
        The `databases` service (70 operations) is superseded by TablesDB, DocumentsDB and VectorsDB
        in Appwrite 2.0 and is described as "the legacy Databases API" in the MCP server's own flag
        list. It is not marked deprecated in the spec and is still shipped.
