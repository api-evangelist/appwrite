architecture_note: 'This is NOT a one-tool-per-operation MCP server, and a crosswalk that pretended otherwise would
  misdescribe it. Appwrite exposes FOUR meta-tools and keeps the 1,022-operation catalog internal, searched at runtime
  by appwrite_search_tools and invoked by name through appwrite_call_tool. So the REST surface is reachable in full
  through one dispatch tool rather than enumerated as 1,022 tool definitions. The consequence for an agent is real:
  it cannot see the operation list up front, it has to search for it.'
crosswalk:
- tool: appwrite_get_context
  category: discovery
  rest:
  - accountGet
  - organizationListProjects
  - organizationsList
  binding: composite
  confidence: medium
  note: Documented as "returns a summary of your workspace, including your account, organization, and projects"
    — those are the three operations that produce exactly that summary (organizationsList enumerates the organizations,
    organizationListProjects the projects inside one). Composite, so no single operationId owns it.
- tool: appwrite_search_tools
  category: discovery
  rest: []
  binding: none
  confidence: high
  note: Server-side catalog search over the internal tool registry. No public REST operation exposes it.
- tool: appwrite_call_tool
  category: dispatch
  rest:
  - '*'
  binding: dispatch
  confidence: high
  note: 'Dispatches to any tool in the internal catalog by name. Its effective reach is the whole REST surface —
    1,022 operations — but the binding is indirect: the tool name is an argument, not the tool identity, so an agent
    inherits parameters from whichever operation it names rather than from this tool.'
- tool: appwrite_search_docs
  category: documentation
  rest: []
  binding: none
  confidence: high
  note: Semantic search over the Appwrite documentation corpus. Backed by an embeddings index the API does not expose;
    the closest public surfaces are /llms.txt and the .md twin of every docs page, neither of which is a REST operation.
mcp_only:
