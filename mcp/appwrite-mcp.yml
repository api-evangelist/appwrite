  checked: '2026-09-12'
  note: >-
    Appwrite ships BOTH agent surfaces and they are not interchangeable. The hosted endpoint at
    https://mcp.appwrite.io/ is streamable-HTTP and an MCP client can POST to it today; it authenticates
    with OAuth 2.0 (browser sign-in, no API key to mint) or with an Appwrite project API key as a bearer
    token. The stdio package `uvx mcp-server-appwrite` is for SELF-HOSTED Appwrite instances only — the
    hosted server authenticates against Appwrite Cloud — and requires a human to install uv and mint an
    API key before an agent sees anything.
