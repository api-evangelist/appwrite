tools_source: https://appwrite.io/docs/tooling/ai/mcp-servers
tools_note: >-
  Appwrite runs a COMPACT-WORKFLOW MCP server: it exposes four meta-tools and keeps the full Appwrite tool
  catalog internal, searched at runtime, so that a 1,022-operation API does not consume the model's context
  window. This is a deliberate design choice and it means a tools/list against this server would NOT
  enumerate the API — it would return the four tools below. Names and descriptions are quoted from the
  provider's documentation; input schemas were not captured because anonymous introspection is gated.
tools:
  - name: appwrite_get_context
    description: Returns a summary of your workspace, including your account, organization, and projects.
    category: discovery
  - name: appwrite_search_tools
    description: Searches the full Appwrite tool catalog at runtime.
    category: discovery
  - name: appwrite_call_tool
    description: Calls a specific Appwrite tool by name.
    category: dispatch
  - name: appwrite_search_docs
    description: Semantically searches the Appwrite documentation.
    category: documentation
local_server:
  package: mcp-server-appwrite
  registry: pypi
  install: uvx mcp-server-appwrite
  transport: stdio
  auth: api-key
  env:
    - APPWRITE_PROJECT_ID
    - APPWRITE_API_KEY
    - APPWRITE_ENDPOINT
  docs: https://appwrite.io/docs/advanced/self-hosting/mcp
  service_flags:
    - flag: --tablesdb
      enables: TablesDB API
    - flag: --users
      enables: Users API
    - flag: --teams
      enables: Teams API
    - flag: --storage
      enables: Storage API
    - flag: --functions
      enables: Functions API
    - flag: --messaging
      enables: Messaging API
    - flag: --locale
      enables: Locale API
    - flag: --avatars
      enables: Avatars API
    - flag: --databases
      enables: Legacy Databases API
    - flag: --all
      enables: All Appwrite APIs
  note: Database tools are enabled by default; every other service is opt-in behind a flag, explicitly to
    keep the tool definitions inside the model's context window.
