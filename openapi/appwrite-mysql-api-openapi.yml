          - 192.168.1.0/24
        backupEnabled:
          type: boolean
          description: Whether automatic backups are enabled.
          example: true
        pitr:
          type: boolean
          description: Whether point-in-time recovery is enabled.
          example: true
        pitrRetentionDays:
          type: integer
          description: Number of days to retain PITR data.
          format: int32
          example: 14
        storageAutoscaling:
          type: boolean
          description: Whether automatic storage expansion is enabled.
          example: true
        storageAutoscalingThresholdPercent:
          type: integer
          description: Storage usage percentage that triggers automatic expansion.
          format: int32
          example: 85
        storageAutoscalingMaxGb:
          type: integer
          description: Maximum storage size in GB for autoscaling. Defaults to 3 times the specification's storage. 0 means no limit.
          format: int32
          example: 30
        maintenanceWindowDay:
          type: string
