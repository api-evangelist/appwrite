          example: active
        lastAccessedAt:
          type:
          - string
          - 'null'
          description: Last activity timestamp in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        idleUntil:
          type:
          - string
          - 'null'
          description: Display-only timestamp when the database is expected to be considered idle (ISO 8601 format). Derived from last activity; lifecycle transitions are driven by lifecycleState.
          example: '2020-10-15T06:38:00.000+00:00'
        lifecycleState:
          type: string
          description: 'Idle-lifecycle state of the database. Possible values: active, warm, cold, hibernated.'
          example: active
        idleTimeoutMinutes:
          type: integer
          description: Minutes of inactivity before container scales to zero.
          format: int32
          example: 15
        cpu:
          type: integer
          description: CPU allocated in millicores.
          format: int32
          example: 2000
        memory:
          type: integer
          description: Memory allocated in MB.
          format: int32
          example: 4096
        storage:
          type: integer
          description: Storage allocated in GB.
          format: int32
          example: 100
        storageStatus:
          type: string
          description: 'Storage resize status. Possible values: idle (no resize in flight), resizing (the volume is growing towards storageTargetGb).'
          example: resizing
        storageTargetGb:
          type: integer
          description: Size in GB the volume is growing towards while storageStatus is resizing. 0 when no resize is in flight.
          format: int32
          example: 120
        storageResizeStartedAt:
          type:
          - string
          - 'null'
          description: Time the in-flight storage resize started, in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        storageClass:
