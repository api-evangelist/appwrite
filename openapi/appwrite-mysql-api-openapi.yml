components:
  schemas:
    dedicatedDatabaseSpecificationList:
      description: SpecificationList
      type: object
      properties:
        specifications:
          type: array
          description: List of dedicated database specifications.
          items:
            $ref: '#/components/schemas/dedicatedDatabaseSpecification'
          example: []
        total:
          type: integer
          description: Total number of specifications.
          format: int32
          example: 9
      required:
      - specifications
      - total
      example:
        specifications: []
        total: 9
    dedicatedDatabaseExecution:
      description: Execution
      type: object
      properties:
        rows:
          type: array
          description: Result rows as a list of column-name => value maps. Empty for non-returning statements.
          items:
            type: object
          example:
          - id: 1
            name: example
        rowCount:
          type: integer
          description: Number of rows returned (for SELECT) or affected (for INSERT/UPDATE/DELETE).
          format: int32
          example: 1
        columns:
          type: array
          description: Column metadata in result-set order.
          items:
            $ref: '#/components/schemas/dedicatedDatabaseExecutionColumn'
          example: []
        durationMs:
          type: integer
          description: Server-side execution time in milliseconds.
          format: int32
          example: 12
        truncated:
          type: boolean
          description: True when the configured row or byte cap was hit and the result was truncated.
          example: false
        bytes:
          type: integer
          description: Serialised payload size in bytes.
          format: int32
          example: 1024
      required:
      - rows
      - rowCount
      - columns
      - durationMs
      - truncated
      - bytes
      example:
        rows:
        - id: 1
          name: example
        rowCount: 1
        columns: []
        durationMs: 12
        truncated: false
        bytes: 1024
    dedicatedDatabaseBranch:
      description: Branch
      type: object
      properties:
        branchId:
          type: string
          description: Branch identifier.
          example: a1b2c3d4
        branchName:
          type: string
          description: Branch name.
          example: branch-a1b2c3d4
        namespace:
          type: string
          description: Kubernetes namespace where the branch is deployed.
          example: db-myproject-mydb-branch-a1b2c3d4
        expiresAt:
          type: integer
          description: Unix timestamp when the branch expires.
          format: int32
          example: 1711411200
        host:
          type: string
          description: Branch hostname for direct connections.
          example: db-myproject-mydb-a1b2c3d4.fra.appwrite.center
        port:
          type: integer
          description: Branch port. Null until the backing reports one.
          format: int32
          example: 5432
        database:
          type: string
          description: Advertised catalog the client connects to. MySQL/MariaDB use default; Postgres uses the routing label.
          example: db-myproject-mydb-a1b2c3d4
        username:
          type: string
          description: Database username. Shared with the parent database.
          example: appwrite
        password:
          type: string
          description: Database password. Shared with the parent database.
          example: '********'
        ssl:
          type: boolean
          description: Whether SSL is required.
          example: false
        engine:
          type: string
          description: 'Database engine. Possible values: postgresql, mysql, mongodb.'
          example: postgresql
        connectionString:
          type: string
          description: Full connection string for the branch.
          example: postgresql://appwrite:****@db-myproject-mydb-a1b2c3d4.fra.appwrite.center:5432/db-myproject-mydb-a1b2c3d4?sslmode=require
      required:
      - branchId
      - branchName
      - namespace
      - expiresAt
      - host
      - port
      - database
      - username
      - password
      - ssl
      - engine
      - connectionString
      example:
        branchId: a1b2c3d4
        branchName: branch-a1b2c3d4
        namespace: db-myproject-mydb-branch-a1b2c3d4
        expiresAt: 1711411200
        host: db-myproject-mydb-a1b2c3d4.fra.appwrite.center
        port: 5432
        database: db-myproject-mydb-a1b2c3d4
        username: appwrite
        password: '********'
        ssl: false
        engine: postgresql
        connectionString: postgresql://appwrite:****@db-myproject-mydb-a1b2c3d4.fra.appwrite.center:5432/db-myproject-mydb-a1b2c3d4?sslmode=require
    backupPolicy:
      description: backup
      type: object
      properties:
        $id:
          type: string
          description: Backup policy ID.
          example: 5e5ea5c16897e
        name:
          type: string
          description: Backup policy name.
          example: Hourly backups
        $createdAt:
          type: string
          description: Policy creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Policy update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        services:
          type: array
          description: The services that are backed up by this policy.
          items:
            type: string
          example:
          - '[''databases'', ''storage'']'
        resources:
          type: array
          description: The resources that are backed up by this policy.
          items:
            type: string
          example:
          - '[''databases'', ''collections'', ''attributes'', ''indexes'']'
        resourceId:
          type:
          - string
          - 'null'
          description: The resource ID to backup. Set only if this policy should backup a single resource.
          example: DB1
        resourceType:
          type:
          - string
          - 'null'
          description: The resource type to backup. Set only if this policy should backup a single resource.
          example: database
        retention:
          type: integer
          description: How many days to keep the backup before it will be automatically deleted.
          format: int32
          example: 7
        schedule:
          type: string
          description: Policy backup schedule in CRON format.
          example: 0 * * * *
        type:
          type: string
          description: 'Backup type. Possible values: full (complete database snapshot), incremental (changes since last backup).'
          example: full
        enabled:
          type: boolean
          description: Is this policy enabled.
          example: true
      required:
      - $id
      - name
      - $createdAt
      - $updatedAt
      - services
      - resources
      - retention
      - schedule
      - type
      - enabled
      example:
        $id: 5e5ea5c16897e
        name: Hourly backups
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        services: '[''databases'', ''storage'']'
        resources: '[''databases'', ''collections'', ''attributes'', ''indexes'']'
        resourceId: DB1
        resourceType: database
        retention: 7
        schedule: 0 * * * *
        type: full
        enabled: true
    dedicatedDatabaseBranchList:
      description: BranchList
      type: object
      properties:
        total:
          type: integer
          description: Total number of branches.
          format: int32
          example: 2
        branches:
          type: array
          description: List of branches.
          items:
            $ref: '#/components/schemas/dedicatedDatabaseBranch'
          example: []
      required:
      - total
      - branches
      example:
        total: 2
        branches: []
    dedicatedDatabaseSpecification:
      description: Specification
      type: object
      properties:
        slug:
          type: string
          description: Specification slug. Use this value when creating a dedicated database.
          example: s-2vcpu-2gb
        name:
          type: string
          description: Human readable specification name.
          example: Standard
        price:
          type: number
          description: Monthly price of the specification in USD.
          format: double
          example: 20
        storageOverageRate:
          type: number
          description: Price per GB of storage above the included amount, per month, in USD.
          format: double
          example: 0.125
        bandwidthOverageRate:
          type: number
          description: Price per GB of bandwidth above the included amount, per month, in USD.
          format: double
          example: 0.08
        replicaRate:
          type: number
          description: High availability replica price as a fraction of the specification price.
          format: double
          example: 1
        pitrRate:
          type: number
          description: Point-in-time recovery price as a fraction of the specification price.
          format: double
          example: 0.2
        cpu:
          type: integer
          description: Allocated CPU in millicores.
          format: int32
          example: 2000
        memory:
          type: integer
          description: Allocated memory in MB.
          format: int32
          example: 2048
        maxConnections:
          type: integer
          description: Maximum number of concurrent connections.
          format: int32
          example: 200
        includedStorage:
          type: integer
          description: Included storage in GB before overage charges apply.
          format: int32
          example: 25
        includedBandwidth:
          type: integer
          description: Included bandwidth in GB before overage charges apply.
          format: int32
          example: 200
        enabled:
          type: boolean
          description: Whether the specification is available on the current plan.
          example: true
      required:
      - slug
      - name
      - price
      - storageOverageRate
      - bandwidthOverageRate
      - replicaRate
      - pitrRate
      - cpu
      - memory
      - maxConnections
      - includedStorage
      - includedBandwidth
      - enabled
      example:
        slug: s-2vcpu-2gb
        name: Standard
        price: 20
        storageOverageRate: 0.125
        bandwidthOverageRate: 0.08
        replicaRate: 1
        pitrRate: 0.2
        cpu: 2000
        memory: 2048
        maxConnections: 200
        includedStorage: 25
        includedBandwidth: 200
        enabled: true
    dedicatedDatabasePITRWindows:
      description: PITRWindows
      type: object
      properties:
        earliest:
          type: string
          description: Earliest available recovery point.
          example: '2020-10-15T06:38:00.000+00:00'
        latest:
          type: string
          description: Latest available recovery point.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - earliest
      - latest
      example:
        earliest: '2020-10-15T06:38:00.000+00:00'
        latest: '2020-10-15T06:38:00.000+00:00'
    dedicatedDatabaseBackup:
      description: Backup
      type: object
      properties:
        $id:
          type: string
          description: Backup ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Backup creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        databaseId:
          type: string
          description: Database ID this backup belongs to.
          example: 5e5ea5c16897e
        projectId:
          type: string
          description: Project ID.
          example: 5e5ea5c16897e
        policyId:
          type: string
          description: Backup policy ID when the backup was created by a schedule.
          example: 5e5ea5c16897e
        trigger:
          type: string
          description: 'Backup trigger. Possible values: manual, schedule.'
          example: schedule
        type:
          type: string
          description: 'Backup type. Possible values: full (complete database snapshot), incremental (changes since last backup), wal (write-ahead log continuous archival).'
          example: full
        requestedType:
          type: string
          description: Backup type that was requested. Differs from `type` when the backend could not run the requested type and took a different one instead, in which case `fallbackReason` explains why. Empty for backups taken before the requested type was recorded.
          example: incremental
        fallbackReason:
          type: string
          description: Why the backend ran a different backup type than the one requested. Empty when the backup ran as requested.
          example: 'PostgreSQL incremental backups are not offered because they cannot be restored: archived WAL is physical and cannot replay onto a logically-restored base. A full backup was taken instead; use a point-in-time restore (targetTime) to recover to a moment between fulls.'
        status:
          type: string
          description: 'Backup status. Possible values: pending (queued for processing), running (currently in progress), completed (successfully finished), failed (encountered an error), verified (integrity check passed).'
          example: completed
        sizeBytes:
          type: integer
          description: Backup size in bytes.
          format: int32
          example: 1073741824
        startedAt:
          type:
          - string
          - 'null'
          description: Backup start time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        completedAt:
          type:
          - string
          - 'null'
          description: Backup completion time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        verifiedAt:
          type:
          - string
          - 'null'
          description: Backup verification time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        expiresAt:
          type:
          - string
          - 'null'
          description: Backup expiration time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        logPosition:
          type:
          - string
          - 'null'
          description: 'Transaction-log position the backup anchors at, in the engine''s own notation: PostgreSQL `{walSegment}|{lsn}`, MySQL and MariaDB `{binlogFile}|{offset}`, MongoDB `{seconds}|{increment}`. Empty when the backup recorded no position, which is the case for backup types that carry none.'
          example: 000000010000000000000003|0/3000148
        error:
          type: string
          description: Error message if backup failed.
          example: ''
      required:
      - $id
      - $createdAt
      - databaseId
      - projectId
      - policyId
      - trigger
      - type
      - requestedType
      - fallbackReason
      - status
      - sizeBytes
      - error
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        databaseId: 5e5ea5c16897e
        projectId: 5e5ea5c16897e
        policyId: 5e5ea5c16897e
        trigger: schedule
        type: full
        requestedType: incremental
        fallbackReason: 'PostgreSQL incremental backups are not offered because they cannot be restored: archived WAL is physical and cannot replay onto a logically-restored base. A full backup was taken instead; use a point-in-time restore (targetTime) to recover to a moment between fulls.'
        status: completed
        sizeBytes: 1073741824
        startedAt: '2020-10-15T06:38:00.000+00:00'
        completedAt: '2020-10-15T06:38:00.000+00:00'
        verifiedAt: '2020-10-15T06:38:00.000+00:00'
        expiresAt: '2020-10-15T06:38:00.000+00:00'
        logPosition: 000000010000000000000003|0/3000148
        error: ''
    dedicatedDatabaseBackupStorage:
      description: BackupStorageConfig
      type: object
      properties:
        provider:
          type: string
          description: 'Storage provider. Possible values: s3 (Amazon S3 or S3-compatible), gcs (Google Cloud Storage), azure (Azure Blob Storage).'
          example: s3
        bucket:
          type: string
          description: Storage bucket or container name.
          example: my-backup-bucket
        region:
          type: string
          description: Storage region.
          example: us-east-1
        prefix:
          type: string
          description: Object key prefix for backups.
          example: backups/
        endpoint:
          type: string
          description: Custom endpoint for S3-compatible storage.
          example: https://minio.example.com
      required:
      - provider
      - bucket
      - region
      - prefix
      - endpoint
      example:
        provider: s3
        bucket: my-backup-bucket
        region: us-east-1
        prefix: backups/
        endpoint: https://minio.example.com
    dedicatedDatabaseOperation:
      description: Operation
      type: object
      properties:
        $id:
          type: string
          description: Operation ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Operation creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        databaseId:
          type: string
          description: Database ID the operation ran against.
          example: 5e5ea5c16897e
        type:
          type: string
          description: Operation type, such as provision, update, credentials-update, restore, pausing, resuming, failover, backup-create or cross-region-enable.
          example: update
        status:
          type: string
          description: 'Operation status. Possible values: queued (accepted and waiting to resume), running (in progress), completed (finished successfully), failed (ended in an error).'
          example: completed
        attempts:
          type: integer
          description: Number of times this operation has been attempted.
          format: int32
          example: 1
        requestedAt:
          type:
          - string
          - 'null'
          description: Time the operation was requested, in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        startedAt:
          type:
          - string
          - 'null'
          description: Time the operation started, in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        completedAt:
          type:
          - string
          - 'null'
          description: Time the operation reached a terminal state, in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        errorCode:
          type: string
          description: Machine-readable failure code. `Interrupted` marks an attempt that ended before its outcome could be confirmed.
          example: Interrupted
        errorMessage:
          type: string
          description: Failure message if the operation failed.
          example: ''
      required:
      - $id
      - $createdAt
      - databaseId
      - type
      - status
      - attempts
      - errorCode
      - errorMessage
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        databaseId: 5e5ea5c16897e
        type: update
        status: completed
        attempts: 1
        requestedAt: '2020-10-15T06:38:00.000+00:00'
        startedAt: '2020-10-15T06:38:00.000+00:00'
        completedAt: '2020-10-15T06:38:00.000+00:00'
        errorCode: Interrupted
        errorMessage: ''
    dedicatedDatabaseExecutionColumn:
      description: ExecutionColumn
      type: object
      properties:
        name:
          type: string
          description: Column name as returned by the database.
          example: id
        type:
          type: string
          description: Engine-specific column type (e.g. int4, text, timestamptz).
          example: int4
      required:
      - name
      - type
      example:
        name: id
        type: int4
    backupPolicyList:
      description: Backup policy list
      type: object
      properties:
        total:
          type: integer
          description: Total number of policies that matched your query.
          format: int32
          example: 5
        policies:
          type: array
          description: List of policies.
          items:
            $ref: '#/components/schemas/backupPolicy'
          example: []
      required:
      - total
      - policies
      example:
        total: 5
        policies: ''
    dedicatedDatabasePooler:
      description: PoolerConfig
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether connection pooling is enabled.
          example: true
        mode:
          type: string
          description: 'Connection pool mode. Possible values: transaction (releases connections back to pool after each transaction), session (holds connections for the entire client session).'
          example: transaction
        maxConnections:
          type: integer
          description: Client-connection ceiling the pooler accepts. Enforced on MySQL and MariaDB; on PostgreSQL the pooler has no client cap, so this reports the database's advertised networkMaxConnections and cannot be set here.
          format: int32
          example: 200
        defaultPoolSize:
          type: integer
          description: Default pool size per user.
          format: int32
          example: 25
        port:
          type: integer
          description: Pooler listening port.
          format: int32
          example: 6432
        readWriteSplitting:
          type: boolean
          description: Whether SELECTs are routed to HA replicas while writes and locked reads stay on the primary. Active only when HA is enabled.
          example: true
        poolerCpuRequest:
          type: string
          description: Effective CPU request applied to the pooler sidecar container (Kubernetes quantity). Returns the proportional default (5% of DB CPU, floor 100m) unless overridden.
          example: 100m
        poolerCpuLimit:
          type: string
          description: Effective CPU limit applied to the pooler sidecar container (Kubernetes quantity). Returns the proportional default (10% of DB CPU, floor 200m) unless overridden.
          example: 200m
        poolerMemoryRequest:
          type: string
          description: Effective memory request applied to the pooler sidecar container (Kubernetes quantity). Returns the proportional default (7.5% of DB memory, floor 64Mi) unless overridden.
          example: 64Mi
        poolerMemoryLimit:
          type: string
          description: Effective memory limit applied to the pooler sidecar container (Kubernetes quantity). Returns the proportional default (15% of DB memory, floor 128Mi) unless overridden.
          example: 128Mi
      required:
      - enabled
      - mode
      - maxConnections
      - defaultPoolSize
      - port
      - readWriteSplitting
      - poolerCpuRequest
      - poolerCpuLimit
      - poolerMemoryRequest
      - poolerMemoryLimit
      example:
        enabled: true
        mode: transaction
        maxConnections: 200
        defaultPoolSize: 25
        port: 6432
        readWriteSplitting: true
        poolerCpuRequest: 100m
        poolerCpuLimit: 200m
        poolerMemoryRequest: 64Mi
        poolerMemoryLimit: 128Mi
    dedicatedDatabaseRestoration:
      description: Restoration
      type: object
      properties:
        $id:
          type: string
          description: Restoration ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Restoration creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        databaseId:
          type: string
          description: Database ID being restored into.
          example: 5e5ea5c16897e
        sourceDatabaseId:
          type: string
          description: Source database ID when restoring a backup into another database.
