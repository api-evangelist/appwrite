          format: int32
          example: 100
        nodePool:
          type: string
          description: Kubernetes node pool where the database is scheduled.
          example: db-pool-4vcpu-8gb
        replicas:
          type: integer
          description: Number of high availability replicas. High availability is enabled when greater than 0.
          format: int32
          example: 2
        syncMode:
          type: string
          description: 'Replication sync mode: async, sync, or quorum.'
          example: async
        networkMaxConnections:
          type: integer
          description: Maximum concurrent client connections. This is the limit a client pool may reach; the engine's own max_connections reported by the status endpoint is a smaller backend limit the pooler multiplexes onto and does not constrain a client pool.
          format: int32
          example: 500
        networkIdleTimeoutSeconds:
          type: integer
          description: Connection idle timeout in seconds.
          format: int32
          example: 900
        networkIPAllowlist:
          type: array
          description: IP addresses/CIDR ranges allowed to connect.
