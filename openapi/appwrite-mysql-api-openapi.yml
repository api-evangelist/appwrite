        projectId:
          type: string
          description: Project ID.
          example: 5e5ea5c16897e
        backupId:
          type: string
          description: Backup ID used for restoration (null for PITR).
          example: 5e5ea5c16897e
        type:
          type: string
          description: 'Restoration type. Possible values: backup (restore from a specific backup snapshot), pitr (point-in-time recovery to a specific timestamp).'
          example: backup
        status:
          type: string
          description: 'Restoration status. Possible values: pending (queued for processing), running (currently in progress), completed (successfully finished), failed (encountered an error).'
          example: completed
        targetTime:
          type: string
          description: Target time for PITR restoration in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        startedAt:
          type: string
          description: Restoration start time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        completedAt:
          type: string
          description: Restoration completion time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        error:
          type: string
          description: Error message if restoration failed.
          example: ''
