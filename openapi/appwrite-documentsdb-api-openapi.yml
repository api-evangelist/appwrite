    databaseStatusReplica:
      description: Replica
      type: object
      properties:
        index:
          type: integer
          description: 'Member index within the database. Read `role` for which member accepts writes: a failover moves the primary without renumbering the indexes.'
          format: int32
          example: 0
        role:
          type: string
          description: 'Member role. Possible values: primary (accepts reads and writes), replica (read-only follower), unknown (placement not established; reported while a transition is moving or restarting the topology, so no member can be named the write target).'
          example: primary
        healthy:
          type: boolean
          description: Whether the replica is healthy.
          example: true
        replicating:
          type:
          - boolean
          - 'null'
          description: 'Whether the engine reports this member''s replication stream as up. Null when no reading was taken: a primary has no stream to report, and a member that is not healthy, or whose probe did not answer, has none yet. `healthy` is a reachability probe of the member itself and says nothing about replication, so a healthy member may still not be replicating.'
          example: true
        lagSeconds:
          type:
          - number
          - 'null'
          description: 'Replication lag in seconds (null for primary). Also null against `replicating: true`, for a member that is streaming but whose engine printed no numeric lag.'
          format: double
          example: 0.2
      required:
      - index
      - role
      - healthy
      example:
        index: 0
        role: primary
        healthy: true
        replicating: true
        lagSeconds: 0.2
    databaseList:
      description: Databases List
      type: object
      properties:
        total:
          type: integer
          description: Total number of databases that matched your query.
          format: int32
          example: 5
        databases:
          type: array
          description: List of databases.
          items:
            $ref: '#/components/schemas/database'
          example: []
      required:
      - total
      - databases
      example:
        total: 5
        databases: ''
    dedicatedDatabaseReplicas:
      description: Replicas
      type: object
      properties:
        replicas:
          type: integer
          description: Number of configured replicas. Zero means high availability is disabled.
          format: int32
          example: 2
        syncMode:
          type: string
          description: 'Requested replication sync mode. Possible values: async (asynchronous, fastest), sync (synchronous, strong consistency), quorum (quorum-based, majority of replicas must confirm). This is what was asked for; compare it with effectiveSyncMode for what the primary is enforcing.'
          example: async
        effectiveSyncMode:
          type:
          - string
          - 'null'
          description: Replication sync mode the primary is actually enforcing. Null when high availability is disabled or the state could not be read. A value below the requested syncMode means writes are being acknowledged with weaker durability than configured.
          example: async
        syncDegraded:
          type: boolean
          description: Whether the enforced replication is weaker than the requested syncMode.
          example: false
        syncAcknowledgements:
          type: integer
          description: Number of standby acknowledgements the primary waits for before a write is committed. Zero means writes are acknowledged locally.
          format: int32
          example: 1
        syncStandbyCount:
          type: integer
          description: Number of standbys registered with the primary for synchronous replication.
          format: int32
          example: 2
        syncStateConfirmed:
          type:
          - boolean
          - 'null'
          description: 'Whether the other sync fields are an engine reading rather than a recorded estimate. True when the primary answered what it is enforcing, including when that answer contradicted the record, in which case the contradicted values are replaced by the ones the engine reports. False when the reading could not be taken: the probe did not answer, there was no engine to ask, or the values describe a configuration change just applied rather than anything measured. Absent when no engine was asked at all, so an unprobed database is distinguishable from an unconfirmed one. False never means a standby was found lagging, because it is the absence of a reading rather than a negative one, so draw no conclusion about replication health from it or from a response that omits it.'
          example: true
        members:
          type: array
          description: Per-pod statuses for the primary and every replica.
          items:
            $ref: '#/components/schemas/dedicatedDatabaseMember'
          example: []
      required:
      - replicas
      - syncMode
      - syncDegraded
      - syncAcknowledgements
      - syncStandbyCount
      - members
      example:
        replicas: 2
        syncMode: async
        effectiveSyncMode: async
        syncDegraded: false
        syncAcknowledgements: 1
        syncStandbyCount: 2
        syncStateConfirmed: true
        members: []
