      type: object
      properties:
        current:
          type: integer
          description: Current number of active connections.
          format: int32
          example: 12
        max:
          type: integer
          description: The engine's own max_connections. On a pooled database this is the backend limit the pooler multiplexes onto, not the ceiling a client pool may reach — that is networkMaxConnections on the database resource.
          format: int32
          example: 100
      required:
      - current
      - max
      example:
        current: 12
        max: 100
    dedicatedDatabase:
