        $updatedAt:
          type: string
          description: Attribute update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        format:
          type: string
          description: String format.
          example: email
        default:
          type:
          - string
          - 'null'
          description: Default value for attribute when not provided. Cannot be set when attribute is required.
          example: default@example.com
      required:
      - key
      - type
      - status
      - error
      - required
      - $createdAt
      - $updatedAt
      - format
      example:
        key: userEmail
        type: string
        status: available
        error: string
        required: true
        array: false
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        format: email
        default: default@example.com
    attributePoint:
      description: AttributePoint
      type: object
      properties:
        key:
          type: string
          description: Attribute Key.
          example: fullName
        type:
          type: string
          description: Attribute type.
          example: string
        status:
          description: 'Attribute status. Possible values: `available`, `processing`, `deleting`, `stuck`, or `failed`'
          example: available
          title: AttributeStatus
          type: string
          oneOf:
          - type: string
            enum:
            - available
            title: available
          - type: string
            enum:
            - processing
            title: processing
          - type: string
            enum:
            - deleting
            title: deleting
          - type: string
            enum:
            - stuck
            title: stuck
          - type: string
            enum:
            - failed
            title: failed
        error:
          type: string
          description: Error message. Displays error generated on failure of creating or deleting an attribute.
          example: string
        required:
          type: boolean
          description: Is attribute required?
          example: true
        array:
          type:
          - boolean
          - 'null'
          description: Is attribute an array?
          example: false
        $createdAt:
          type: string
          description: Attribute creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Attribute update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        default:
          type:
          - array
          - 'null'
          description: Default value for attribute when not provided. Cannot be set when attribute is required.
          example:
          - 0
          - 0
          items:
            type: number
            format: double
      required:
      - key
      - type
      - status
      - error
      - required
      - $createdAt
      - $updatedAt
      example:
        key: fullName
        type: string
        status: available
        error: string
        required: true
        array: false
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        default:
