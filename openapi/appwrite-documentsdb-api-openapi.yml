          type: boolean
          description: Is attribute required?
          example: true
        array:
          type:
          - boolean
          - 'null'
          description: Is attribute an array?
          example: false
        $createdAt:
          type: string
          description: Attribute creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
