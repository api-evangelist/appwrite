    user:
      description: User
      type: object
      properties:
        $id:
          type: string
          description: User ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: User creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: User update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: User name.
          example: John Doe
        password:
          type:
          - string
          - 'null'
          description: Hashed user password.
          example: $argon2id$v=19$m=2048,t=4,p=3$aUZjLnliVWRINmFNTWMudg$5S+x+7uA31xFnrHFT47yFwcJeaP0w92L/4LdgrVRXxE
        hash:
          type:
          - string
          - 'null'
          description: Password hashing algorithm.
          example: argon2
        hashOptions:
          type:
          - object
          - 'null'
          description: Password hashing algorithm configuration.
          example: {}
          allOf:
          - oneOf:
            - $ref: '#/components/schemas/algoArgon2'
            - $ref: '#/components/schemas/algoScrypt'
            - $ref: '#/components/schemas/algoScryptModified'
            - $ref: '#/components/schemas/algoBcrypt'
            - $ref: '#/components/schemas/algoPhpass'
            - $ref: '#/components/schemas/algoSha'
            - $ref: '#/components/schemas/algoMd5'
            discriminator:
              propertyName: type
              mapping:
                argon2: '#/components/schemas/algoArgon2'
                scrypt: '#/components/schemas/algoScrypt'
                scryptMod: '#/components/schemas/algoScryptModified'
                bcrypt: '#/components/schemas/algoBcrypt'
                phpass: '#/components/schemas/algoPhpass'
                sha: '#/components/schemas/algoSha'
                md5: '#/components/schemas/algoMd5'
        registration:
          type: string
          description: User registration date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        status:
          type: boolean
          description: User status. Pass `true` for enabled and `false` for disabled.
          example: true
        labels:
          type: array
          description: Labels for the user.
          items:
            type: string
          example:
          - vip
        passwordUpdate:
          type: string
          description: Password update time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        email:
          type: string
          description: User email address.
          example: john@appwrite.io
        phone:
          type: string
          description: User phone number in E.164 format.
          example: '+4930901820'
        emailVerification:
          type: boolean
          description: Email verification status.
          example: true
        emailCanonical:
          type:
          - string
          - 'null'
          description: Canonical form of the user email address.
          example: john@appwrite.io
        emailIsFree:
          type:
          - boolean
          - 'null'
          description: Whether the user email is from a free email provider.
          example: true
        emailIsDisposable:
          type:
          - boolean
          - 'null'
          description: Whether the user email is from a disposable email provider.
          example: false
        emailIsCorporate:
          type:
          - boolean
          - 'null'
          description: Whether the user email is from a corporate domain.
          example: true
        emailIsCanonical:
          type:
          - boolean
          - 'null'
          description: Whether the user email is in its canonical form.
          example: true
        phoneVerification:
          type: boolean
          description: Phone verification status.
          example: true
        mfa:
          type: boolean
          description: Multi factor authentication status.
          example: true
        prefs:
          type: object
          description: User preferences as a key-value object
          example:
            theme: pink
            timezone: UTC
          allOf:
          - $ref: '#/components/schemas/preferences'
        targets:
          type: array
          description: A user-owned message receiver. A single user may have multiple e.g. emails, phones, and a browser. Each target is registered with a single provider.
          items:
            $ref: '#/components/schemas/target'
          example: []
        accessedAt:
          type: string
          description: Most recent access date in ISO 8601 format. This attribute is only updated again after 24 hours.
          example: '2020-10-15T06:38:00.000+00:00'
        impersonator:
          type:
          - boolean
          - 'null'
          description: Whether the user can impersonate other users.
          example: false
        impersonatorUserId:
          type:
          - string
          - 'null'
          description: ID of the original actor performing the impersonation. Present only when the current request is impersonating another user. Internal audit logs attribute the action to this user, while the impersonated target is recorded only in internal audit payload data.
          example: 5e5ea5c16897e
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - registration
      - status
      - labels
      - passwordUpdate
      - email
      - phone
      - emailVerification
      - phoneVerification
      - mfa
      - prefs
      - targets
      - accessedAt
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: John Doe
        password: $argon2id$v=19$m=2048,t=4,p=3$aUZjLnliVWRINmFNTWMudg$5S+x+7uA31xFnrHFT47yFwcJeaP0w92L/4LdgrVRXxE
        hash: argon2
        hashOptions: {}
        registration: '2020-10-15T06:38:00.000+00:00'
        status: true
        labels:
        - vip
        passwordUpdate: '2020-10-15T06:38:00.000+00:00'
        email: john@appwrite.io
        phone: '+4930901820'
        emailVerification: true
        emailCanonical: john@appwrite.io
        emailIsFree: true
        emailIsDisposable: false
        emailIsCorporate: true
        emailIsCanonical: true
        phoneVerification: true
        mfa: true
        prefs:
          theme: pink
          timezone: UTC
        targets: []
        accessedAt: '2020-10-15T06:38:00.000+00:00'
        impersonator: false
        impersonatorUserId: 5e5ea5c16897e
