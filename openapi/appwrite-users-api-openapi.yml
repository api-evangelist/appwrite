components:
  schemas:
    algoScrypt:
      description: AlgoScrypt
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: scrypt
        costCpu:
          type: integer
          description: CPU complexity of computed hash.
          format: int32
          example: 8
        costMemory:
          type: integer
          description: Memory complexity of computed hash.
          format: int32
          example: 14
        costParallel:
          type: integer
          description: Parallelization of computed hash.
          format: int32
          example: 1
        length:
          type: integer
          description: Length used to compute hash.
          format: int32
          example: 64
      required:
      - type
      - costCpu
      - costMemory
      - costParallel
      - length
      example:
        type: scrypt
        costCpu: 8
        costMemory: 14
        costParallel: 1
        length: 64
    metric:
      description: Metric
      type: object
      properties:
        value:
          type: integer
          description: The value of this metric at the timestamp.
          format: int32
          example: 1
        date:
          type: string
          description: The date at which this metric was aggregated in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - value
      - date
      example:
        value: 1
        date: '2020-10-15T06:38:00.000+00:00'
    logList:
      description: Logs List
      type: object
      properties:
        total:
          type: integer
          description: Total number of logs that matched your query.
          format: int32
          example: 5
        logs:
          type: array
          description: List of logs.
          items:
            $ref: '#/components/schemas/log'
          example: []
      required:
      - total
      - logs
      example:
        total: 5
        logs: ''
    algoBcrypt:
      description: AlgoBcrypt
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: bcrypt
      required:
      - type
      example:
        type: bcrypt
    sessionList:
      description: Sessions List
      type: object
      properties:
