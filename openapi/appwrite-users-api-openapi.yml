          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
      required:
      - jwt
      example:
        jwt: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    algoSha:
      description: AlgoSHA
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: sha
      required:
      - type
      example:
        type: sha
    membership:
      description: Membership
      type: object
      properties:
        $id:
          type: string
          description: Membership ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Membership creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Membership update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        userId:
          type: string
          description: User ID.
          example: 5e5ea5c16897e
        userName:
          type: string
          description: User name. Hide this attribute by toggling membership privacy in the Console.
          example: John Doe
        userEmail:
          type: string
          description: User email address. Hide this attribute by toggling membership privacy in the Console.
          example: john@appwrite.io
        userPhone:
          type: string
          description: User phone number. Hide this attribute by toggling membership privacy in the Console.
          example: +1 555 555 5555
        teamId:
          type: string
          description: Team ID.
          example: 5e5ea5c16897e
        teamName:
          type: string
          description: Team name.
          example: VIP
        invited:
          type: string
          description: Date, the user has been invited to join the team in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        joined:
          type: string
          description: Date, the user has accepted the invitation to join the team in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        confirm:
          type: boolean
          description: User confirmation status, true if the user has joined the team or false otherwise.
          example: false
        mfa:
          type: boolean
          description: Multi factor authentication status, true if the user has MFA enabled or false otherwise. Hide this attribute by toggling membership privacy in the Console.
          example: false
        userAccessedAt:
          type: string
          description: Most recent access date in ISO 8601 format. Show this attribute by toggling membership privacy in the Console.
          example: '2020-10-15T06:38:00.000+00:00'
        roles:
          type: array
          description: User list of roles
          items:
            type: string
          example:
          - owner
      required:
      - $id
      - $createdAt
      - $updatedAt
      - userId
      - userName
      - userEmail
      - userPhone
      - teamId
      - teamName
      - invited
      - joined
      - confirm
      - mfa
      - userAccessedAt
      - roles
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        userId: 5e5ea5c16897e
        userName: John Doe
        userEmail: john@appwrite.io
        userPhone: +1 555 555 5555
        teamId: 5e5ea5c16897e
        teamName: VIP
        invited: '2020-10-15T06:38:00.000+00:00'
        joined: '2020-10-15T06:38:00.000+00:00'
        confirm: false
        mfa: false
        userAccessedAt: '2020-10-15T06:38:00.000+00:00'
        roles:
        - owner
    target:
      description: Target
      type: object
      properties:
        $id:
          type: string
          description: Target ID.
          example: '259125845563242502'
        $createdAt:
          type: string
          description: Target creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Target update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Target Name.
          example: Apple iPhone 12
        userId:
          type: string
          description: User ID.
          example: '259125845563242502'
        providerId:
          type:
          - string
          - 'null'
          description: Provider ID.
          example: '259125845563242502'
        providerType:
          type: string
          description: 'The target provider type. Can be one of the following: `email`, `sms` or `push`.'
          example: email
        identifier:
          type: string
          description: The target identifier.
          example: token
        expired:
          type: boolean
          description: Is the target expired.
          example: false
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - userId
      - providerType
      - identifier
      - expired
      example:
        $id: '259125845563242502'
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: Apple iPhone 12
        userId: '259125845563242502'
        providerId: '259125845563242502'
        providerType: email
        identifier: token
        expired: false
    algoScryptModified:
      description: AlgoScryptModified
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: scryptMod
        salt:
          type: string
          description: Salt used to compute hash.
          example: UxLMreBr6tYyjQ==
        saltSeparator:
          type: string
          description: Separator used to compute hash.
          example: Bw==
        signerKey:
          type: string
          description: Key used to compute hash.
          example: XyEKE9RcTDeLEsL/RjwPDBv/RqDl8fb3gpYEOQaPihbxf1ZAtSOHCjuAAa7Q3oHpCYhXSN9tizHgVOwn6krflQ==
      required:
      - type
      - salt
      - saltSeparator
      - signerKey
      example:
        type: scryptMod
        salt: UxLMreBr6tYyjQ==
        saltSeparator: Bw==
        signerKey: XyEKE9RcTDeLEsL/RjwPDBv/RqDl8fb3gpYEOQaPihbxf1ZAtSOHCjuAAa7Q3oHpCYhXSN9tizHgVOwn6krflQ==
    usageUsers:
      description: UsageUsers
      type: object
      properties:
        range:
          type: string
          description: Time range of the usage stats.
          example: 30d
        usersTotal:
          type: integer
          description: Total aggregated number of statistics of users.
          format: int32
          example: 0
        sessionsTotal:
          type: integer
          description: Total aggregated number of active sessions.
          format: int32
          example: 0
        users:
          type: array
          description: Aggregated number of users per period.
          items:
            $ref: '#/components/schemas/metric'
          example: []
        sessions:
          type: array
          description: Aggregated number of active sessions  per period.
          items:
            $ref: '#/components/schemas/metric'
          example: []
      required:
      - range
      - usersTotal
      - sessionsTotal
      - users
      - sessions
      example:
        range: 30d
        usersTotal: 0
        sessionsTotal: 0
        users: []
        sessions: []
