            ImpersonateUserId: []
          client:
            Project: []
            ImpersonateUserId: []
          server:
            Project: []
            Session: []
            ImpersonateUserId: []
      security:
      - Project: []
        Session: []
        Key: []
        JWT: []
      - Project: []
        Session: []
        Key: []
        JWT: []
        ImpersonateUserId: []
      parameters:
      - name: width
        description: Output image width in pixels. Pass an integer between 0 and 2000. Defaults to 256.
        required: false
        schema:
          type: integer
          format: int32
          example: 0
          default: 256
        in: query
      - name: height
        description: Output image height in pixels. Pass an integer between 0 and 2000. Defaults to 256.
        required: false
        schema:
          type: integer
          format: int32
          example: 0
          default: 256
        in: query
      - name: quality
