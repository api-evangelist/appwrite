openapi: 3.2.0
info:
  version: 2.0.0
  title: Appwrite Avatars API
  description: Appwrite backend as a service cuts up to 70% of the time and costs required for building a modern application. We abstract and simplify common development tasks behind a REST APIs, to help you develop your app in a fast and secure way. For full API documentation and tutorials go to https://appwrite.io/docs
  termsOfService: https://appwrite.io/policy/terms
  contact:
    name: Appwrite Team
    url: https://appwrite.io/support
    email: team@appwrite.io
  license:
    name: BSD-3-Clause
    url: https://raw.githubusercontent.com/appwrite/appwrite/master/LICENSE
servers:
- url: https://cloud.appwrite.io/v1
  description: Appwrite Cloud endpoint.
- url: https://{region}.cloud.appwrite.io/v1
  description: Appwrite Cloud regional endpoint. Replace `{region}` with your project region.
  variables:
    region:
      default: fra
      description: Appwrite Cloud region.
tags:
- name: Avatars
  description: The Avatars service aims to help you complete everyday tasks related to your app image, icons, and avatars.
paths:
  /avatars/browsers/{code}:
    get:
      summary: Get browser icon
      operationId: avatarsGetBrowser
      tags:
      - Avatars
      description: 'You can use this endpoint to show different browser icons to your users. The code argument receives the browser code as it appears in your user GET /account/sessions endpoint. Use width, height and quality arguments to change the output settings.


        When one dimension is specified and the other is 0, the image is scaled with preserved aspect ratio. If both dimensions are 0, the API provides an image at source quality. If dimensions are not specified, the default size of image returned is 100x100px.'
      responses:
        '200':
          description: Image
          content:
            image/png:
              schema:
                type: string
                format: binary
      deprecated: false
      x-appwrite:
        group: null
        demo: avatars/get-browser.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: avatars.read
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
            ImpersonateUserId: []
          client:
            Project: []
            ImpersonateUserId: []
          server:
            Project: []
            Session: []
            ImpersonateUserId: []
      security:
      - Project: []
        Session: []
        Key: []
        JWT: []
      - Project: []
        Session: []
        Key: []
        JWT: []
        ImpersonateUserId: []
      parameters:
      - name: code
        description: Browser Code.
        required: true
        schema:
          type: string
          example: aa
          title: Browser
          oneOf:
          - type: string
            enum:
            - aa
            title: Avant Browser
          - type: string
            enum:
            - an
            title: Android WebView Beta
          - type: string
            enum:
            - ch
            title: Google Chrome
          - type: string
            enum:
            - ci
            title: Google Chrome (iOS)
          - type: string
            enum:
            - cm
            title: Google Chrome (Mobile)
          - type: string
            enum:
            - cr
            title: Chromium
          - type: string
            enum:
            - ff
            title: Mozilla Firefox
          - type: string
            enum:
            - sf
            title: Safari
          - type: string
            enum:
            - mf
            title: Mobile Safari
          - type: string
            enum:
            - ps
            title: Microsoft Edge
          - type: string
            enum:
            - oi
            title: Microsoft Edge (iOS)
          - type: string
            enum:
            - om
            title: Opera Mini
          - type: string
            enum:
            - op
            title: Opera
          - type: string
            enum:
            - 'on'
            title: Opera (Next)
        in: path
      - name: width
        description: Image width. Pass an integer between 0 to 2000. Defaults to 100.
        required: false
        schema:
          type: integer
          format: int32
          example: 0
          default: 100
        in: query
      - name: height
        description: Image height. Pass an integer between 0 to 2000. Defaults to 100.
        required: false
        schema:
          type: integer
          format: int32
          example: 0
          default: 100
        in: query
      - name: quality
        description: Image quality. Pass an integer between 0 to 100. Defaults to keep existing image quality.
        required: false
        schema:
          type: integer
          format: int32
          example: -1
          default: -1
        in: query
  /avatars/credit-cards/{code}:
    get:
      summary: Get credit card icon
      operationId: avatarsGetCreditCard
      tags:
      - Avatars
      description: 'The credit card endpoint will return you the icon of the credit card provider you need. Use width, height and quality arguments to change the output settings.


        When one dimension is specified and the other is 0, the image is scaled with preserved aspect ratio. If both dimensions are 0, the API provides an image at source quality. If dimensions are not specified, the default size of image returned is 100x100px.'
      responses:
        '200':
          description: Image
          content:
            image/png:
              schema:
                type: string
                format: binary
      deprecated: false
      x-appwrite:
        group: null
        demo: avatars/get-credit-card.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: avatars.read
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
            ImpersonateUserId: []
          client:
            Project: []
            ImpersonateUserId: []
          server:
            Project: []
            Session: []
            ImpersonateUserId: []
      security:
      - Project: []
        Session: []
        Key: []
        JWT: []
      - Project: []
        Session: []
        Key: []
        JWT: []
        ImpersonateUserId: []
      parameters:
      - name: code
        description: 'Credit Card Code. Possible values: amex, argencard, cabal, cencosud, diners, discover, elo, hipercard, jcb, mastercard, naranja, targeta-shopping, unionpay, visa, mir, maestro, rupay.'
        required: true
        schema:
          type: string
          example: amex
          title: CreditCard
          oneOf:
          - type: string
            enum:
            - amex
            title: American Express
          - type: string
            enum:
            - argencard
            title: Argencard
          - type: string
            enum:
            - cabal
            title: Cabal
          - type: string
            enum:
            - cencosud
            title: Cencosud
          - type: string
            enum:
            - diners
            title: Diners Club
          - type: string
            enum:
            - discover
            title: Discover
          - type: string
            enum:
            - elo
            title: Elo
          - type: string
            enum:
            - hipercard
            title: Hipercard
          - type: string
            enum:
            - jcb
            title: JCB
          - type: string
            enum:
            - mastercard
            title: Mastercard
          - type: string
            enum:
            - naranja
            title: Naranja
          - type: string
            enum:
            - targeta-shopping
            title: Tarjeta Shopping
          - type: string
            enum:
            - unionpay
            title: Union Pay
          - type: string
            enum:
            - visa
            title: Visa
          - type: string
            enum:
            - mir
            title: MIR
          - type: string
            enum:
            - maestro
            title: Maestro
          - type: string
            enum:
            - rupay
            title: Rupay
        in: path
      - name: width
        description: Image width. Pass an integer between 0 to 2000. Defaults to 100.
        required: false
        schema:
          type: integer
          format: int32
          example: 0
          default: 100
        in: query
      - name: height
        description: Image height. Pass an integer between 0 to 2000. Defaults to 100.
        required: false
        schema:
          type: integer
          format: int32
          example: 0
          default: 100
        in: query
      - name: quality
        description: Image quality. Pass an integer between 0 to 100. Defaults to keep existing image quality.
        required: false
        schema:
          type: integer
          format: int32
          example: -1
          default: -1
        in: query
  /avatars/favicon:
    get:
      summary: Get favicon
      operationId: avatarsGetFavicon
      tags:
      - Avatars
      description: 'Use this endpoint to fetch the favorite icon (AKA favicon) of any remote website URL.


        This endpoint does not follow HTTP redirects.'
      responses:
        '200':
          description: Image
          content:
            image/*:
              schema:
                type: string
                format: binary
      deprecated: false
      x-appwrite:
        group: null
        demo: avatars/get-favicon.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: avatars.read
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
            ImpersonateUserId: []
          client:
            Project: []
            ImpersonateUserId: []
          server:
            Project: []
            Session: []
            ImpersonateUserId: []
      security:
      - Project: []
        Session: []
        Key: []
        JWT: []
      - Project: []
        Session: []
        Key: []
        JWT: []
        ImpersonateUserId: []
      parameters:
      - name: url
        description: Website URL which you want to fetch the favicon from.
        required: true
        schema:
          type: string
          format: url
          example: https://example.com
        in: query
  /avatars/flags/{code}:
    get:
      summary: Get country flag
      operationId: avatarsGetFlag
      tags:
      - Avatars
      description: 'You can use this endpoint to show different country flags icons to your users. The code argument receives the 2 letter country code. Use width, height and quality arguments to change the output settings. Country codes follow the ISO 3166-1 standard.


        When one dimension is specified and the other is 0, the image is scaled with preserved aspect ratio. If both dimensions are 0, the API provides an image at source quality. If dimensions are not specified, the default size of image returned is 100x100px.'
