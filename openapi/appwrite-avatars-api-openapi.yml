        in: query
      - name: latitude
        description: Geolocation latitude. Pass a number between -90 to 90. Defaults to 0.
        required: false
        schema:
          type: number
          format: float
          example: 37.7749
          default: 0
        in: query
      - name: longitude
        description: Geolocation longitude. Pass a number between -180 to 180. Defaults to 0.
        required: false
        schema:
          type: number
          format: float
          example: -122.4194
          default: 0
        in: query
      - name: accuracy
        description: Geolocation accuracy in meters. Pass a number between 0 to 100000. Defaults to 0.
        required: false
        schema:
          type: number
          format: float
          example: 100
          default: 0
        in: query
      - name: touch
        description: Enable touch support. Pass 0 for no touch, or 1 for touch enabled. Defaults to 0.
        required: false
        schema:
          type: boolean
          example: true
          default: false
        in: query
      - name: permissions
        description: Browser permissions to grant. Pass an array of permission names like ["geolocation", "camera", "microphone"]. Defaults to empty.
        required: false
        schema:
          type: array
          items:
            title: BrowserPermission
            type: string
            oneOf:
            - type: string
              enum:
              - geolocation
              title: geolocation
            - type: string
              enum:
              - camera
              title: camera
            - type: string
              enum:
              - microphone
              title: microphone
            - type: string
              enum:
              - notifications
              title: notifications
            - type: string
              enum:
              - midi
              title: midi
            - type: string
              enum:
              - push
              title: push
            - type: string
              enum:
              - clipboard-read
              title: clipboard-read
            - type: string
              enum:
              - clipboard-write
              title: clipboard-write
            - type: string
              enum:
              - payment-handler
              title: payment-handler
            - type: string
              enum:
              - usb
              title: usb
            - type: string
              enum:
              - bluetooth
              title: bluetooth
            - type: string
              enum:
              - accelerometer
              title: accelerometer
            - type: string
              enum:
              - gyroscope
              title: gyroscope
            - type: string
              enum:
              - magnetometer
              title: magnetometer
            - type: string
              enum:
              - ambient-light-sensor
              title: ambient-light-sensor
            - type: string
              enum:
              - background-sync
              title: background-sync
            - type: string
              enum:
              - persistent-storage
              title: persistent-storage
            - type: string
              enum:
              - screen-wake-lock
              title: screen-wake-lock
            - type: string
              enum:
              - web-share
              title: web-share
            - type: string
              enum:
              - xr-spatial-tracking
              title: xr-spatial-tracking
          example:
          - geolocation
          - notifications
          default: []
        in: query
      - name: sleep
        description: Wait time in seconds before taking the screenshot. Pass an integer between 0 to 10. Defaults to 0.
        required: false
        schema:
          type: integer
          format: int32
          example: 3
          default: 0
        in: query
      - name: width
        description: Output image width. Pass 0 to use original width, or an integer between 1 to 2000. Defaults to 0 (original width).
        required: false
        schema:
          type: integer
          format: int32
          example: 800
          default: 0
        in: query
      - name: height
        description: Output image height. Pass 0 to use original height, or an integer between 1 to 2000. Defaults to 0 (original height).
        required: false
        schema:
          type: integer
          format: int32
          example: 600
          default: 0
        in: query
      - name: quality
        description: Screenshot quality. Pass an integer between 0 to 100. Defaults to keep existing image quality.
        required: false
        schema:
          type: integer
          format: int32
          example: 85
          default: -1
        in: query
      - name: output
        description: Output format type (jpeg, jpg, png, gif and webp).
        required: false
        schema:
          type: string
          example: jpeg
          title: ImageFormat
          oneOf:
          - type: string
            enum:
            - jpg
            title: jpg
          - type: string
            enum:
            - jpeg
            title: jpeg
          - type: string
            enum:
            - png
            title: png
          - type: string
            enum:
            - webp
            title: webp
          - type: string
            enum:
            - heic
            title: heic
          - type: string
            enum:
            - avif
            title: avif
          - type: string
            enum:
            - gif
            title: gif
        in: query
components:
  securitySchemes:
    Project:
      type: apiKey
      name: X-Appwrite-Project
      description: Your project ID
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
        demo: <YOUR_PROJECT_ID>
    ProjectPath:
      type: apiKey
      name: project
      description: Your project ID
      in: query
      x-appwrite:
        location: path
        param: project_id
        platforms:
        - client
        - server
        - console
        demo: <YOUR_PROJECT_ID>
    JWT:
      type: apiKey
      name: X-Appwrite-JWT
      description: Your secret JSON Web Token
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
        demo: <YOUR_JWT>
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The OAuth access token to authenticate with
      x-appwrite:
        platforms:
        - client
        - server
        - console
    Locale:
      type: apiKey
      name: X-Appwrite-Locale
      description: ''
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
        demo: en
    Session:
      type: apiKey
      name: X-Appwrite-Session
      description: The user session to authenticate with
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    DevKey:
      type: apiKey
      name: X-Appwrite-Dev-Key
      description: Your secret dev API key
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    Cookie:
      type: apiKey
      name: Cookie
      description: The user cookie to authenticate with. Used by SDKs that forward an incoming Cookie header in server-side runtimes.
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    ImpersonateUserId:
      type: apiKey
      name: X-Appwrite-Impersonate-User-Id
      description: Impersonate a user by ID
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    ImpersonateUserEmail:
      type: apiKey
      name: X-Appwrite-Impersonate-User-Email
      description: Impersonate a user by email
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    ImpersonateUserPhone:
      type: apiKey
      name: X-Appwrite-Impersonate-User-Phone
      description: Impersonate a user by phone
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    Key:
      type: apiKey
      name: X-Appwrite-Key
      description: Your secret API key
      in: header
      x-appwrite:
        platforms:
        - server
        - console
        - manager
        demo: <YOUR_API_KEY>
    Organization:
      type: apiKey
      name: X-Appwrite-Organization
      description: Your organization ID
      in: header
      x-appwrite:
        platforms:
        - server
        - console
        demo: <YOUR_ORGANIZATION_ID>
    ForwardedUserAgent:
      type: apiKey
      name: X-Forwarded-User-Agent
      description: The user agent string of the client that made the request
      in: header
      x-appwrite:
        platforms:
        - server
    Mode:
      type: apiKey
      name: X-Appwrite-Mode
      description: ''
      in: header
      x-appwrite:
        platforms:
        - console
        demo: ''
    Platform:
      type: apiKey
      name: X-Appwrite-Platform
      description: The platform type (Appwrite or Imagine)
      in: header
      x-appwrite:
        platforms:
        - console
externalDocs:
  description: Full API docs, specs and tutorials
  url: https://appwrite.io/docs
