openapi: 3.2.0
info:
  version: 2.0.0
  title: Appwrite Sites API
  description: Appwrite backend as a service cuts up to 70% of the time and costs required for building a modern application. We abstract and simplify common development tasks behind a REST APIs, to help you develop your app in a fast and secure way. For full API documentation and tutorials go to https://appwrite.io/docs
  termsOfService: https://appwrite.io/policy/terms
  contact:
    name: Appwrite Team
    url: https://appwrite.io/support
    email: team@appwrite.io
  license:
    name: BSD-3-Clause
    url: https://raw.githubusercontent.com/appwrite/appwrite/master/LICENSE
servers:
- url: https://cloud.appwrite.io/v1
  description: Appwrite Cloud endpoint.
- url: https://{region}.cloud.appwrite.io/v1
  description: Appwrite Cloud regional endpoint. Replace `{region}` with your project region.
  variables:
    region:
      default: fra
      description: Appwrite Cloud region.
tags:
- name: Sites
  description: The Sites Service allows you view, create and manage your web applications.
paths:
  /sites:
    get:
      summary: List sites
      operationId: sitesList
      tags:
      - Sites
      description: Get a list of all the project's sites. You can use the query params to filter your results.
      responses:
        '200':
          description: Sites List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/siteList'
      deprecated: false
      x-appwrite:
        group: sites
        demo: sites/list.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: sites.read
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
      parameters:
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: name, enabled, framework, deploymentId, buildCommand, installCommand, outputDirectory, installationId'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: search
        description: 'Search term to filter your list results. Max length: 256 chars.'
        required: false
        schema:
          type: string
          example: <SEARCH>
          default: ''
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
    post:
      summary: Create site
      operationId: sitesCreate
      tags:
      - Sites
      description: Create a new site.
      responses:
        '201':
          description: Site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/site'
      deprecated: false
      x-appwrite:
        group: sites
        demo: sites/create.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: sites.write
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                siteId:
                  description: Site ID. Choose a custom ID or generate a random ID with `ID.unique()`. Valid chars are a-z, A-Z, 0-9, period, hyphen, and underscore. Can't start with a special char. Max length is 36 chars.
                  type: string
                  example: <SITE_ID>
                  x-appwrite:
                    idGenerator: ID.unique
                name:
                  description: 'Site name. Max length: 128 chars.'
                  type: string
                  example: <NAME>
                framework:
                  description: Sites framework.
                  type: string
                  example: analog
                  title: Framework
                  oneOf:
                  - type: string
                    enum:
                    - analog
                    title: analog
                  - type: string
                    enum:
                    - angular
                    title: angular
                  - type: string
                    enum:
                    - nextjs
                    title: nextjs
                  - type: string
                    enum:
                    - react
                    title: react
                  - type: string
                    enum:
                    - nuxt
                    title: nuxt
                  - type: string
                    enum:
                    - vue
                    title: vue
                  - type: string
                    enum:
                    - sveltekit
                    title: sveltekit
                  - type: string
                    enum:
                    - astro
                    title: astro
                  - type: string
                    enum:
                    - tanstack-start
                    title: tanstack-start
                  - type: string
                    enum:
                    - remix
                    title: remix
                  - type: string
                    enum:
                    - lynx
                    title: lynx
                  - type: string
                    enum:
                    - flutter
                    title: flutter
                  - type: string
                    enum:
                    - react-native
                    title: react-native
                  - type: string
                    enum:
                    - vite
                    title: vite
                  - type: string
                    enum:
                    - other
                    title: other
                enabled:
                  description: Is site enabled? When set to 'disabled', users cannot access the site but Server SDKs with and API key can still access the site. No data is lost when this is toggled.
                  type: boolean
                  default: true
                  example: false
                logging:
                  description: When disabled, request logs will exclude logs and errors, and site responses will be slightly faster.
                  type: boolean
                  default: true
                  example: false
                timeout:
                  description: Maximum request time in seconds.
                  type: integer
                  default: 30
                  example: 1
                  format: int32
                installCommand:
                  description: Install Command.
                  type: string
                  default: ''
                  example: <INSTALL_COMMAND>
                buildCommand:
                  description: Build Command.
                  type: string
                  default: ''
                  example: <BUILD_COMMAND>
                startCommand:
                  description: Custom start command. Leave empty to use default.
                  type: string
                  default: ''
                  example: <START_COMMAND>
                outputDirectory:
                  description: Output Directory for site.
                  type: string
                  default: ''
                  example: <OUTPUT_DIRECTORY>
