    appInstallation:
      description: AppInstallation
      type: object
      properties:
        $id:
          type: string
          description: Installation ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Installation creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Installation update time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        appId:
          type: string
          description: ID of the installed application.
          example: 5e5ea5c16897e
        teamId:
          type: string
          description: ID of the team the application is installed on.
          example: 5e5ea5c16897e
        scopes:
          type: array
          description: Scopes granted to the application. Snapshot of the application's installation scopes taken when the installation was created or last updated.
          items:
            type: string
          example:
          - organization:organization.read
        authorizationDetails:
          type: array
          description: Authorization details granted to the application. Rich authorization request (RFC 9396) style entries; the Appwrite Console stores authorized project IDs here.
          items:
            type: object
          example:
          - type: project
            identifiers:
            - '*'
        createdById:
          type: string
          description: ID of the user who created the installation.
          example: 5e5ea5c16897e
        createdByName:
          type: string
          description: Name of the user who created the installation.
          example: Walter White
        lastAccessedAt:
          type:
          - string
          - 'null'
          description: Time an access token was last issued for the installation in ISO 8601 format. Null if never used.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - $id
      - $createdAt
      - $updatedAt
      - appId
      - teamId
      - scopes
      - authorizationDetails
      - createdById
      - createdByName
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        appId: 5e5ea5c16897e
        teamId: 5e5ea5c16897e
        scopes:
        - organization:organization.read
        authorizationDetails:
        - type: project
          identifiers:
          - '*'
        createdById: 5e5ea5c16897e
        createdByName: Walter White
        lastAccessedAt: '2020-10-15T06:38:00.000+00:00'
    block:
      description: Block
      type: object
      properties:
        $createdAt:
          type: string
          description: Block creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        resourceType:
          type: string
          description: Resource type that is blocked
          example: project
        resourceId:
          type: string
          description: Resource identifier that is blocked
          example: 5e5ea5c16897e
        mode:
          type: string
          description: Block mode. full blocks reads and writes; readOnly blocks writes only.
          example: readOnly
        reason:
          type:
          - string
          - 'null'
          description: Reason for the block. Can be null if no reason was provided.
          example: Payment overdue
        expiredAt:
          type:
          - string
          - 'null'
          description: Block expiration date in ISO 8601 format. Can be null if the block does not expire.
          example: '2020-10-15T06:38:00.000+00:00'
        projectName:
          type: string
          description: Name of the project this block applies to.
          example: My Project
        region:
          type: string
          description: Region of the project this block applies to.
          example: fra
        organizationName:
          type: string
          description: Name of the organization that owns the project.
          example: Acme Inc.
        organizationId:
          type: string
          description: ID of the organization that owns the project.
          example: 5e5ea5c16897e
        billingPlan:
          type: string
          description: Billing plan of the organization that owns the project.
          example: pro
      required:
      - $createdAt
      - resourceType
      - resourceId
      - mode
      - projectName
      - region
      - organizationName
      - organizationId
      - billingPlan
      example:
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        resourceType: project
        resourceId: 5e5ea5c16897e
        mode: readOnly
        reason: Payment overdue
        expiredAt: '2020-10-15T06:38:00.000+00:00'
        projectName: My Project
        region: fra
        organizationName: Acme Inc.
        organizationId: 5e5ea5c16897e
        billingPlan: pro
