components:
  schemas:
    project:
      description: Project
      type: object
      properties:
        $id:
          type: string
          description: Project ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Project creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Project update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Project name.
          example: New Project
        teamId:
          type: string
          description: Project team ID.
          example: '1592981250'
        region:
          type: string
          description: Project region
          example: fra
        devKeys:
          type: array
          description: 'Deprecated since 1.9.5: List of dev keys.'
          items:
            $ref: '#/components/schemas/devKey'
          example: []
        smtpEnabled:
          type: boolean
          description: Status for custom SMTP
          example: false
        smtpSenderName:
          type: string
          description: SMTP sender name
          example: John Appwrite
        smtpSenderEmail:
          type: string
          description: SMTP sender email
          example: john@appwrite.io
        smtpReplyToName:
          type: string
          description: SMTP reply to name
          example: Support Team
        smtpReplyToEmail:
          type: string
          description: SMTP reply to email
          example: support@appwrite.io
        smtpHost:
          type: string
          description: SMTP server host name
          example: mail.appwrite.io
        smtpPort:
          type: integer
          description: SMTP server port
          format: int32
          example: 25
        smtpUsername:
          type: string
          description: SMTP server username
          example: emailuser
        smtpPassword:
          type: string
          description: SMTP server password. This property is write-only and always returned empty.
          format: password
          example: smtp-password
        smtpSecure:
          type: string
          description: SMTP server secure protocol
          example: tls
        pingCount:
          type: integer
          description: Number of times the ping was received for this project.
          format: int32
          example: 1
        pingedAt:
          type: string
          description: Last ping datetime in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        labels:
          type: array
          description: Labels for the project.
          items:
            type: string
          example:
          - vip
        status:
          type: string
          description: Project status
          example: active
        onboarding:
          type: object
          additionalProperties: true
          description: Stage progress (completed or skipped) with timestamps and actor types, keyed by stage id.
          example: {}
        authMethods:
          type: array
          description: List of auth methods.
          items:
            $ref: '#/components/schemas/projectAuthMethod'
          example: []
        services:
          type: array
          description: List of services.
          items:
            $ref: '#/components/schemas/projectService'
          example: []
        protocols:
          type: array
          description: List of protocols.
          items:
            $ref: '#/components/schemas/projectProtocol'
          example: []
        blocks:
          type: array
          description: Project blocks information
          items:
            $ref: '#/components/schemas/block'
          example: []
        consoleAccessedAt:
          type: string
          description: Last time the project was accessed via console. Used with plan's projectInactivityDays to determine if project is paused.
          example: '2020-10-15T06:38:00.000+00:00'
        wafEnabled:
          type:
          - boolean
          - 'null'
          description: Whether WAF enforcement is enabled for the project.
          example: true
        billingLimits:
          type:
          - object
          - 'null'
          description: Billing limits reached
          allOf:
          - $ref: '#/components/schemas/billingLimits'
        oAuth2ServerEnabled:
          type:
          - boolean
          - 'null'
          description: OAuth2 server status
          example: false
        oAuth2ServerAuthorizationUrl:
          type:
          - string
          - 'null'
          description: OAuth2 server authorization URL
          example: https://cloud.appwrite.io/oauth2/.well-known/openid-configuration
        oAuth2ServerScopes:
          type:
          - array
          - 'null'
          description: OAuth2 server allowed scopes
          items:
            type: string
          example:
          - read
          - write
        oAuth2ServerDefaultScopes:
          type:
          - array
          - 'null'
          description: OAuth2 server scopes used when an authorization request omits the scope parameter
          items:
            type: string
          example:
          - read
        oAuth2ServerInstallationScopes:
          type:
          - array
          - 'null'
          description: Scopes an application may request when installed on a team
          items:
            type: string
          example:
          - project:all
        oAuth2ServerAuthorizationDetailsTypes:
          type:
          - array
          - 'null'
          description: OAuth2 server accepted RFC 9396 authorization_details types
          items:
            type: string
          example:
          - calendar
        oAuth2ServerAccessTokenDuration:
          type:
          - integer
          - 'null'
          description: OAuth2 server access token duration in seconds for confidential clients
          format: int32
          example: 3600
        oAuth2ServerRefreshTokenDuration:
          type:
          - integer
          - 'null'
          description: OAuth2 server refresh token duration in seconds for confidential clients
          format: int32
          example: 86400
        oAuth2ServerPublicAccessTokenDuration:
          type:
          - integer
          - 'null'
          description: OAuth2 server access token duration in seconds for public clients (SPAs, mobile, native)
          format: int32
          example: 3600
        oAuth2ServerPublicRefreshTokenDuration:
          type:
          - integer
          - 'null'
          description: OAuth2 server refresh token duration in seconds for public clients (SPAs, mobile, native)
          format: int32
          example: 2592000
        oAuth2ServerInstallationAccessTokenDuration:
          type:
          - integer
          - 'null'
          description: OAuth2 server access token duration in seconds for app installation access tokens
          format: int32
          example: 3600
        oAuth2ServerConfidentialPkce:
          type:
          - boolean
          - 'null'
          description: When enabled, PKCE is required for confidential clients (server-side flows using client_secret). PKCE is always required for public clients regardless of this setting.
          example: false
        oAuth2ServerVerificationUrl:
          type:
          - string
          - 'null'
          description: URL to your application page where users enter the device flow user code. Empty when the Device Authorization Grant is not configured.
          example: https://cloud.appwrite.io/device
        oAuth2ServerUserCodeLength:
          type:
          - integer
          - 'null'
          description: Number of characters in the device flow user code, excluding the formatting separator.
          format: int32
          example: 8
        oAuth2ServerUserCodeFormat:
          type:
          - string
          - 'null'
          description: 'Character set for device flow user codes: `numeric`, `alphabetic`, or `alphanumeric`.'
          example: alphanumeric
        oAuth2ServerDeviceCodeDuration:
          type:
          - integer
          - 'null'
          description: Lifetime in seconds of device flow device codes and user codes.
          format: int32
          example: 600
        oAuth2ServerDiscoveryUrl:
          type:
          - string
          - 'null'
          description: OAuth2 server discovery URL
          example: https://auth.example.com/.well-known/openid-configuration
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - teamId
      - region
      - devKeys
      - smtpEnabled
      - smtpSenderName
      - smtpSenderEmail
      - smtpReplyToName
      - smtpReplyToEmail
      - smtpHost
      - smtpPort
      - smtpUsername
      - smtpPassword
      - smtpSecure
      - pingCount
      - pingedAt
      - labels
      - status
      - onboarding
      - authMethods
      - services
      - protocols
      - blocks
      - consoleAccessedAt
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: New Project
        teamId: '1592981250'
        region: fra
        devKeys: {}
        smtpEnabled: false
        smtpSenderName: John Appwrite
        smtpSenderEmail: john@appwrite.io
        smtpReplyToName: Support Team
        smtpReplyToEmail: support@appwrite.io
        smtpHost: mail.appwrite.io
        smtpPort: 25
        smtpUsername: emailuser
        smtpPassword: smtp-password
        smtpSecure: tls
        pingCount: 1
        pingedAt: '2020-10-15T06:38:00.000+00:00'
        labels:
        - vip
        status: active
        onboarding: {}
        authMethods: {}
        services: {}
        protocols: {}
        blocks: ''
        consoleAccessedAt: '2020-10-15T06:38:00.000+00:00'
        wafEnabled: true
        billingLimits: ''
        oAuth2ServerEnabled: false
        oAuth2ServerAuthorizationUrl: https://cloud.appwrite.io/oauth2/.well-known/openid-configuration
        oAuth2ServerScopes:
        - read
        - write
        oAuth2ServerDefaultScopes:
        - read
        oAuth2ServerInstallationScopes:
        - project:all
        oAuth2ServerAuthorizationDetailsTypes:
        - calendar
        oAuth2ServerAccessTokenDuration: 3600
        oAuth2ServerRefreshTokenDuration: 86400
        oAuth2ServerPublicAccessTokenDuration: 3600
        oAuth2ServerPublicRefreshTokenDuration: 2592000
        oAuth2ServerInstallationAccessTokenDuration: 3600
        oAuth2ServerConfidentialPkce: false
        oAuth2ServerVerificationUrl: https://cloud.appwrite.io/device
        oAuth2ServerUserCodeLength: 8
        oAuth2ServerUserCodeFormat: alphanumeric
        oAuth2ServerDeviceCodeDuration: 600
        oAuth2ServerDiscoveryUrl: https://auth.example.com/.well-known/openid-configuration
    devKey:
      description: DevKey
      type: object
      properties:
        $id:
          type: string
          description: Key ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Key creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Key update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Key name.
          example: Dev API Key
        expire:
          type: string
          description: Key expiration date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        secret:
          type: string
          description: Secret key.
          example: 919c2d18fb5d4...a2ae413da83346ad2
        accessedAt:
          type: string
          description: Most recent access date in ISO 8601 format. This attribute is only updated again after 24 hours.
          example: '2020-10-15T06:38:00.000+00:00'
        sdks:
          type: array
          description: List of SDK user agents that used this key.
          items:
            type: string
          example:
          - appwrite:flutter
