    key:
      description: Key
      type: object
      properties:
        $id:
          type: string
          description: Key ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Key creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Key update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Key name.
          example: My API Key
        expire:
          type: string
          description: Key expiration date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        scopes:
          type: array
          description: Allowed permission scopes.
          items:
            type: string
          example:
          - users.read
        secret:
          type: string
          description: Secret key.
          example: 919c2d18fb5d4...a2ae413da83346ad2
        accessedAt:
          type: string
          description: Most recent access date in ISO 8601 format. This attribute is only updated again after 24 hours.
          example: '2020-10-15T06:38:00.000+00:00'
        sdks:
          type: array
          description: List of SDK user agents that used this key.
          items:
            type: string
          example:
          - appwrite:flutter
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - expire
      - scopes
      - secret
      - accessedAt
      - sdks
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: My API Key
        expire: '2020-10-15T06:38:00.000+00:00'
        scopes: users.read
        secret: 919c2d18fb5d4...a2ae413da83346ad2
        accessedAt: '2020-10-15T06:38:00.000+00:00'
        sdks: appwrite:flutter
