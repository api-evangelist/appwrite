components:
  schemas:
    documentList:
      description: Documents List
      type: object
      properties:
        total:
          type: integer
          description: Total number of documents that matched your query.
          format: int32
          example: 5
        documents:
          type: array
          description: List of documents.
          items:
            $ref: '#/components/schemas/document'
          example: []
      required:
      - total
      - documents
      example:
        total: 5
        documents: ''
    attributeLongtext:
      description: AttributeLongtext
      type: object
      properties:
        key:
          type: string
          description: Attribute Key.
          example: fullName
        type:
          type: string
          description: Attribute type.
          example: string
        status:
          description: 'Attribute status. Possible values: `available`, `processing`, `deleting`, `stuck`, or `failed`'
          example: available
          title: AttributeStatus
          type: string
          oneOf:
          - type: string
            enum:
            - available
            title: available
          - type: string
            enum:
            - processing
            title: processing
          - type: string
            enum:
            - deleting
            title: deleting
          - type: string
            enum:
            - stuck
            title: stuck
          - type: string
            enum:
            - failed
            title: failed
        error:
          type: string
          description: Error message. Displays error generated on failure of creating or deleting an attribute.
          example: string
        required:
          type: boolean
          description: Is attribute required?
          example: true
        array:
          type:
          - boolean
          - 'null'
          description: Is attribute an array?
          example: false
        $createdAt:
          type: string
          description: Attribute creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Attribute update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        default:
          type:
          - string
          - 'null'
          description: Default value for attribute when not provided. Cannot be set when attribute is required.
          example: default
        encrypt:
          type:
          - boolean
          - 'null'
          description: Defines whether this attribute is encrypted or not.
          example: false
      required:
      - key
      - type
      - status
      - error
      - required
      - $createdAt
      - $updatedAt
      example:
        key: fullName
        type: string
        status: available
        error: string
        required: true
        array: false
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        default: default
        encrypt: false
    indexList:
      description: Indexes List
      type: object
      properties:
        total:
          type: integer
          description: Total number of indexes that matched your query.
          format: int32
          example: 5
        indexes:
          type: array
          description: List of indexes.
          items:
            $ref: '#/components/schemas/index'
          example: []
      required:
      - total
      - indexes
      example:
        total: 5
        indexes: ''
    backupPolicy:
      description: backup
      type: object
      properties:
        $id:
          type: string
          description: Backup policy ID.
          example: 5e5ea5c16897e
        name:
          type: string
          description: Backup policy name.
          example: Hourly backups
        $createdAt:
          type: string
          description: Policy creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Policy update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        services:
          type: array
          description: The services that are backed up by this policy.
          items:
            type: string
          example:
          - '[''databases'', ''storage'']'
        resources:
          type: array
          description: The resources that are backed up by this policy.
          items:
            type: string
          example:
          - '[''databases'', ''collections'', ''attributes'', ''indexes'']'
        resourceId:
          type:
          - string
          - 'null'
          description: The resource ID to backup. Set only if this policy should backup a single resource.
          example: DB1
        resourceType:
          type:
          - string
          - 'null'
          description: The resource type to backup. Set only if this policy should backup a single resource.
          example: database
        retention:
          type: integer
          description: How many days to keep the backup before it will be automatically deleted.
          format: int32
          example: 7
        schedule:
          type: string
          description: Policy backup schedule in CRON format.
          example: 0 * * * *
        type:
          type: string
          description: 'Backup type. Possible values: full (complete database snapshot), incremental (changes since last backup).'
          example: full
        enabled:
          type: boolean
          description: Is this policy enabled.
          example: true
      required:
      - $id
      - name
      - $createdAt
      - $updatedAt
      - services
      - resources
      - retention
      - schedule
      - type
      - enabled
      example:
        $id: 5e5ea5c16897e
        name: Hourly backups
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        services: '[''databases'', ''storage'']'
        resources: '[''databases'', ''collections'', ''attributes'', ''indexes'']'
        resourceId: DB1
        resourceType: database
        retention: 7
        schedule: 0 * * * *
        type: full
        enabled: true
    transaction:
      description: Transaction
      type: object
      properties:
        $id:
          type: string
          description: Transaction ID.
          example: '259125845563242502'
        $createdAt:
