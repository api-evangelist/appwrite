        description: Transaction ID.
        required: true
        schema:
          type: string
          example: <TRANSACTION_ID>
        in: path
    patch:
      summary: Update transaction
      operationId: databasesUpdateTransaction
      tags:
      - Databases
      description: Update a transaction, to either commit or roll back its operations.
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction'
      deprecated: true
      x-appwrite:
        group: transactions
        demo: databases/update-transaction.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: documents.write
        platforms:
        - console
        - server
        - client
        packaging: false
        public: true
        deprecated:
          since: 1.8.0
          replaceWith: tablesDB.updateTransaction
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
          client:
            Project: []
      security:
      - Project: []
        Key: []
        Session: []
        JWT: []
      parameters:
      - name: transactionId
        description: Transaction ID.
        required: true
        schema:
          type: string
          example: <TRANSACTION_ID>
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commit:
                  description: Commit transaction?
                  type: boolean
                  default: false
                  example: false
                rollback:
                  description: Rollback transaction?
                  type: boolean
                  default: false
                  example: false
    delete:
      summary: Delete transaction
      operationId: databasesDeleteTransaction
      tags:
      - Databases
      description: Delete a transaction by its unique ID.
      responses:
        '204':
          description: No content
      deprecated: true
      x-appwrite:
        group: transactions
        demo: databases/delete-transaction.md
        rate-limit: 0
