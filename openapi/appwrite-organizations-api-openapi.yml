    billingPlanDedicatedDatabaseLimits:
      description: dedicatedDatabaseLimits
      type: object
      properties:
        minCpu:
          type:
          - integer
          - 'null'
          description: Minimum CPU allocation in millicores.
          format: int32
          example: 125
        maxCpu:
          type:
          - integer
          - 'null'
          description: Maximum CPU allocation in millicores.
          format: int32
          example: 32000
        minMemoryMb:
          type:
          - integer
          - 'null'
          description: Minimum memory allocation in megabytes.
          format: int32
          example: 128
        maxMemoryMb:
          type:
          - integer
          - 'null'
          description: Maximum memory allocation in megabytes.
          format: int32
          example: 262144
        minStorageGb:
          type:
          - integer
          - 'null'
          description: Minimum storage allocation in gigabytes.
          format: int32
          example: 1
        maxStorageGb:
          type:
          - integer
          - 'null'
          description: Maximum storage allocation in gigabytes.
          format: int32
          example: 16384
        maxReplicas:
          type:
          - integer
          - 'null'
          description: Maximum number of high-availability replicas per dedicated database.
          format: int32
          example: 5
        maxConnections:
          type:
          - integer
          - 'null'
          description: Maximum number of client connections.
          format: int32
          example: 10000
        maxIpAllowlistSize:
          type:
          - integer
          - 'null'
          description: Maximum number of entries allowed in the IP allowlist.
          format: int32
          example: 100
        maxExtensions:
          type:
          - integer
          - 'null'
          description: Maximum number of database extensions that can be enabled.
          format: int32
          example: 50
        maxBackupRetentionDays:
          type:
          - integer
          - 'null'
          description: Maximum number of days a backup can be retained.
          format: int32
          example: 365
        maxPitrRetentionDays:
          type:
          - integer
          - 'null'
          description: Maximum number of days of point-in-time recovery data that can be retained.
          format: int32
          example: 35
        maxSqlApiMaxRows:
          type:
          - integer
          - 'null'
          description: Maximum number of rows a single SQL API query can return.
          format: int32
          example: 1000000
        maxSqlApiMaxBytes:
          type:
          - integer
          - 'null'
          description: Maximum response size in bytes for a single SQL API query.
          format: int32
          example: 104857600
        maxSqlApiTimeoutSeconds:
          type:
          - integer
          - 'null'
          description: Maximum execution time in seconds for a single SQL API query.
          format: int32
          example: 300
        maxSqlApiAllowedStatements:
          type:
          - integer
          - 'null'
          description: Maximum number of SQL statement types that can be permitted through the SQL API.
          format: int32
          example: 10
        allowedSqlStatements:
          type:
          - array
          - 'null'
          description: SQL statement types permitted through the SQL API.
          items:
            type: string
          example:
          - select
          - insert
          - update
          - delete
          - explain
        allowedStorageClasses:
          type:
          - array
          - 'null'
          description: Storage classes available for dedicated databases.
          items:
            type: string
          example:
          - ssd
        allowedSyncModes:
          type:
          - array
          - 'null'
          description: Replica synchronization modes available for dedicated databases.
          items:
            type: string
          example:
          - async
          - sync
          - quorum
      example:
        minCpu: 125
        maxCpu: 32000
        minMemoryMb: 128
        maxMemoryMb: 262144
        minStorageGb: 1
        maxStorageGb: 16384
        maxReplicas: 5
        maxConnections: 10000
        maxIpAllowlistSize: 100
        maxExtensions: 50
        maxBackupRetentionDays: 365
        maxPitrRetentionDays: 35
        maxSqlApiMaxRows: 1000000
