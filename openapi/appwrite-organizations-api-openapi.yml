          - integer
          - 'null'
          description: Budget limit percentage
          format: int32
          example: 100
      example:
        bandwidth: 5
        storage: 150
        users: 200000
        executions: 750000
        GBHours: 100
        imageTransformations: 100
        authPhone: 10
        budgetLimit: 100
    program:
      description: Program
      type: object
      properties:
        $id:
          type: string
          description: Program ID
          example: ''
        title:
          type: string
          description: Program title
          example: ''
        description:
          type: string
          description: Program description
          example: ''
        tag:
          type: string
          description: Program tag for highlighting on console
        icon:
          type: string
          description: Program icon for highlighting on console
        url:
          type: string
          description: URL for more information on this program
          example: ''
        active:
          type: boolean
          description: Whether this program is active
          example: false
        external:
          type: boolean
          description: Whether this program is external
          example: false
        billingPlanId:
          type: string
          description: Billing plan ID that this is program is associated with.
          example: ''
      required:
      - $id
      - title
      - description
      - tag
      - icon
      - url
      - active
      - external
      - billingPlanId
      example:
        $id: ''
        title: ''
        description: ''
        tag: null
        icon: null
        url: ''
        active: false
        external: false
        billingPlanId: ''
    billingPlanLimits:
      description: PlanLimits
      type: object
      properties:
        credits:
          type:
          - integer
          - 'null'
          description: Credits limit per billing cycle
          format: int32
          example: 100
        dailyCredits:
          type:
          - integer
          - 'null'
          description: Daily credits limit (if applicable)
          format: int32
          example: 5
      example:
        credits: 100
        dailyCredits: 5
    planChangeResourceCompliance:
      description: PlanChangeResourceCompliance
      type: object
      properties:
        type:
          type: string
          description: Resource type
          example: databases
        currentUsage:
          type: integer
          description: Current usage count
          format: int32
          example: 3
        limit:
          type: integer
          description: Allowed limit in target plan
          format: int32
          example: 1
        status:
          type: string
          description: Compliance status. Either `over_limit` or `within_limit`.
          example: over_limit
        excess:
          type: integer
          description: Number of resources exceeding the limit
          format: int32
          example: 2
        resolutionHint:
          type: string
          description: Suggestion for resolving the compliance issue. Empty when the resource is within limits.
          example: Delete or migrate 2 databases.
      required:
      - type
      - currentUsage
      - limit
      - status
      - excess
      - resolutionHint
      example:
        type: databases
        currentUsage: 3
        limit: 1
        status: over_limit
        excess: 2
        resolutionHint: Delete or migrate 2 databases.
    planChangeProjectCompliance:
      description: PlanChangeProjectCompliance
      type: object
      properties:
        $id:
          type: string
          description: Project ID
          example: proj_a
        name:
          type: string
          description: Project name
          example: Marketing Site
        isCompliant:
          type: boolean
          description: Whether the project complies with target plan limits
          example: false
        resources:
          type: array
          description: Resource compliance details
          items:
            $ref: '#/components/schemas/planChangeResourceCompliance'
          example: []
        error:
          type:
          - string
          - 'null'
          description: Failure reason when compliance could not be evaluated. Present only when the project DB or Regions API was unreachable; in that case `isCompliant` is false (fail closed) and `resources` is empty.
          example: 'Failed to get project compliance from Regions API. Status: 500'
      required:
      - $id
      - name
      - isCompliant
      - resources
      example:
        $id: proj_a
        name: Marketing Site
        isCompliant: false
        resources: []
        error: 'Failed to get project compliance from Regions API. Status: 500'
    addon:
      description: Addon
      type: object
      properties:
        $id:
          type: string
          description: Addon ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Addon creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Addon update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $permissions:
          type: array
          description: Addon permissions. [Learn more about permissions](https://appwrite.io/docs/permissions).
          items:
            type: string
          example:
          - read("any")
        key:
          type: string
          description: Addon key
          example: baa
        resourceType:
          type: string
          description: Resource type (organization or project)
          example: organization
        resourceId:
          type: string
          description: Resource ID
          example: 5e5ea5c16897e
        status:
          type: string
          description: 'Payment status. Possible values: pending (awaiting payment confirmation e.g. 3DS), active (payment confirmed and addon is running).'
          example: active
        currentValue:
          type: integer
          description: 'Current value for this billing cycle. For toggle addons: 1 (on) or 0 (off). For numeric addons: the active quantity.'
          format: int32
          example: 1
        nextValue:
          type:
          - integer
          - 'null'
          description: Value to apply at the start of the next billing cycle. Null means no change is scheduled. For toggle addons, 0 means the addon will be removed at the next cycle.
          format: int32
      required:
      - $id
      - $createdAt
      - $updatedAt
      - $permissions
      - key
      - resourceType
      - resourceId
      - status
      - currentValue
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        $permissions:
        - read("any")
        key: baa
        resourceType: organization
        resourceId: 5e5ea5c16897e
        status: active
        currentValue: 1
        nextValue: null
    billingAddress:
      description: Address
      type: object
      properties:
        $id:
          type: string
          description: Region ID
          example: eu-fr
        userId:
          type: string
          description: User ID
          example: 5e5ea5c16897e
        streetAddress:
          type: string
          description: Street address
          example: 13th Avenue
        addressLine2:
          type: string
          description: Address line 2
          example: ''
        country:
          type: string
          description: Address country
          example: USA
        city:
          type: string
          description: city
          example: ''
        state:
          type: string
          description: state
          example: ''
        postalCode:
          type: string
          description: postal code
          example: ''
      required:
      - $id
      - userId
      - streetAddress
      - addressLine2
      - country
      - city
      - state
      - postalCode
      example:
        $id: eu-fr
        userId: 5e5ea5c16897e
        streetAddress: 13th Avenue
        addressLine2: ''
        country: USA
        city: ''
        state: ''
        postalCode: ''
    credit:
      description: Credit
      type: object
      properties:
        $id:
          type: string
          description: Credit ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Credit creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Credit update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $permissions:
          type: array
          description: Credit permissions. [Learn more about permissions](/docs/permissions).
          items:
            type: string
          example:
          - read("any")
        couponId:
          type: string
          description: coupon ID
          example: NEWBONUS
        userId:
          type: string
          description: ID of the User.
          example: 5e5ea5c16897e
        teamId:
          type: string
          description: ID of the Team.
          example: 5e5ea5c16897e
        credits:
          type: number
          description: Provided credit amount
          format: double
          example: 50
        total:
          type: number
          description: Provided credit amount
          format: double
          example: 50
        expiration:
          type: string
          description: Credit expiration time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        status:
          type: string
          description: Status of the credit. Can be one of `disabled`, `active` or `expired`.
          example: disabled
      required:
      - $id
      - $createdAt
      - $updatedAt
      - $permissions
      - couponId
      - userId
      - teamId
      - credits
      - total
      - expiration
      - status
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        $permissions:
        - read("any")
        couponId: NEWBONUS
        userId: 5e5ea5c16897e
        teamId: 5e5ea5c16897e
        credits: 50
        total: 50
        expiration: '2020-10-15T06:38:00.000+00:00'
        status: disabled
