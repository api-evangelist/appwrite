openapi: 3.2.0
info:
  version: 2.0.0
  title: Appwrite Project API
  description: Appwrite backend as a service cuts up to 70% of the time and costs required for building a modern application. We abstract and simplify common development tasks behind a REST APIs, to help you develop your app in a fast and secure way. For full API documentation and tutorials go to https://appwrite.io/docs
  termsOfService: https://appwrite.io/policy/terms
  contact:
    name: Appwrite Team
    url: https://appwrite.io/support
    email: team@appwrite.io
  license:
    name: BSD-3-Clause
    url: https://raw.githubusercontent.com/appwrite/appwrite/master/LICENSE
servers:
- url: https://cloud.appwrite.io/v1
  description: Appwrite Cloud endpoint.
- url: https://{region}.cloud.appwrite.io/v1
  description: Appwrite Cloud regional endpoint. Replace `{region}` with your project region.
  variables:
    region:
      default: fra
      description: Appwrite Cloud region.
tags:
- name: Project
  description: The Project service allows you to manage all the projects in your Appwrite server.
paths:
  /project:
    get:
      summary: Get project
      operationId: projectGet
      tags:
      - Project
      description: Get a project.
      responses:
        '200':
          description: Project
          content:
            ? ''
            : schema:
                $ref: '#/components/schemas/project'
      deprecated: false
      x-appwrite:
        group: null
        demo: project/get.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: project.read
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
    delete:
      summary: Delete project
      operationId: projectDelete
      tags:
      - Project
      description: Delete a project.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: null
        demo: project/delete.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: project.write
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
  /project/auth-methods/{methodId}:
    patch:
      summary: Update project auth method status
      operationId: projectUpdateAuthMethod
      tags:
      - Project
      description: Update properties of a specific auth method. Use this endpoint to enable or disable a method in your project.
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project'
      deprecated: false
      x-appwrite:
        group: null
        demo: project/update-auth-method.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: project.write
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
      parameters:
      - name: methodId
        description: 'Auth Method ID. Possible values: email-password,magic-url,email-otp,anonymous,invites,jwt,phone'
        required: true
        schema:
          type: string
          example: email-password
          title: ProjectAuthMethodId
          oneOf:
          - type: string
            enum:
            - email-password
            title: email-password
          - type: string
            enum:
            - magic-url
            title: magic-url
          - type: string
            enum:
            - email-otp
            title: email-otp
          - type: string
            enum:
            - anonymous
            title: anonymous
          - type: string
            enum:
            - invites
            title: invites
          - type: string
            enum:
            - jwt
            title: jwt
          - type: string
            enum:
            - phone
            title: phone
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  description: Auth method status.
                  type: boolean
                  example: false
              required:
              - enabled
  /project/keys:
    get:
      summary: List project keys
      operationId: projectListKeys
      tags:
      - Project
      description: Get a list of all API keys from the current project.
      responses:
        '200':
          description: API Keys List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/keyList'
      deprecated: false
      x-appwrite:
        group: keys
        demo: project/list-keys.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: keys.read
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
      parameters:
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: expire, accessedAt, name, scopes'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
    post:
      summary: Create project key
      operationId: projectCreateKey
      tags:
      - Project
      description: 'Create a new API key. It''s recommended to have multiple API keys with strict scopes for separate functions within your project.


        You can also create an ephemeral API key if you need a short-lived key instead.'
      responses:
        '201':
          description: Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/key'
      deprecated: false
      x-appwrite:
        group: keys
        demo: project/create-key.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: keys.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyId:
                  description: Key ID. Choose a custom ID or generate a random ID with `ID.unique()`. Valid chars are a-z, A-Z, 0-9, period, hyphen, and underscore. Can't start with a special char. Max length is 36 chars.
                  type: string
                  example: <KEY_ID>
                  x-appwrite:
                    idGenerator: ID.unique
                name:
                  description: 'Key name. Max length: 128 chars.'
                  type: string
                  example: <NAME>
                scopes:
                  description: Key scopes list. Maximum of 200 scopes are allowed.
                  type: array
