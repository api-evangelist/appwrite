    emailTemplate:
      description: EmailTemplate
      type: object
      properties:
        templateId:
          type: string
          description: Template type
          example: verification
        locale:
          type: string
          description: Template locale
          example: en_us
        message:
          type: string
          description: Template message
          example: Click on the link to verify your account.
        senderName:
          type: string
          description: Name of the sender
          example: My User
        senderEmail:
          type: string
          description: Email of the sender
          example: mail@appwrite.io
        replyToEmail:
          type: string
          description: Reply to email address
          example: emails@appwrite.io
        replyToName:
          type: string
          description: Reply to name
          example: Support Team
        subject:
          type: string
          description: Email subject
          example: Please verify your email address
      required:
      - templateId
      - locale
      - message
      - senderName
      - senderEmail
      - replyToEmail
      - replyToName
      - subject
      example:
        templateId: verification
        locale: en_us
        message: Click on the link to verify your account.
        senderName: My User
        senderEmail: mail@appwrite.io
        replyToEmail: emails@appwrite.io
        replyToName: Support Team
        subject: Please verify your email address
