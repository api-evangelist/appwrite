          example: '2020-10-15T06:38:00.000+00:00'
        resourceType:
          type: string
          description: Resource type that is blocked
          example: project
        resourceId:
          type: string
          description: Resource identifier that is blocked
          example: 5e5ea5c16897e
        mode:
          type: string
          description: Block mode. full blocks reads and writes; readOnly blocks writes only.
          example: readOnly
        reason:
          type:
          - string
          - 'null'
          description: Reason for the block. Can be null if no reason was provided.
          example: Payment overdue
        expiredAt:
          type:
          - string
          - 'null'
          description: Block expiration date in ISO 8601 format. Can be null if the block does not expire.
          example: '2020-10-15T06:38:00.000+00:00'
        projectName:
          type: string
          description: Name of the project this block applies to.
          example: My Project
        region:
          type: string
          description: Region of the project this block applies to.
          example: fra
        organizationName:
          type: string
          description: Name of the organization that owns the project.
          example: Acme Inc.
        organizationId:
          type: string
          description: ID of the organization that owns the project.
          example: 5e5ea5c16897e
        billingPlan:
          type: string
          description: Billing plan of the organization that owns the project.
          example: pro
      required:
      - $createdAt
      - resourceType
      - resourceId
      - mode
      - projectName
      - region
      - organizationName
      - organizationId
      - billingPlan
      example:
        $createdAt: '2020-10-15T06:38:00.000+00:00'
