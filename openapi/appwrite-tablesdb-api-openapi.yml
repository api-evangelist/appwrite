    databaseMigration:
      description: Database Migration
      type: object
      properties:
        $id:
          type: string
          description: Database migration ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Migration creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Migration update time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        projectId:
          type: string
          description: Project ID that owns the migrating database.
          example: 5e5ea5c16897e
        databaseId:
          type: string
          description: Logical database ID being migrated.
          example: 5e5ea5c16897e
        specification:
          type: string
          description: Dedicated compute specification provisioned for the migration target.
          example: s-2vcpu-4gb
        phase:
          type: string
          description: 'Migration phase. Possible values: pending, provisioned, capturing, backfilling, catching_up, verifying, ready_to_cutover, cutover, soaking, done, failed, rolled_back.'
          example: pending
        attempt:
          type: integer
          description: Number of times a migration step has failed and been recorded.
          format: int32
          example: 0
        lastError:
          type: string
          description: Reason the most recent migration step failed, empty while none has.
          example: ''
        lagDocuments:
          type: integer
          description: Number of documents still pending replication to the target.
          format: int32
          example: 0
        changelogWatermark:
          type: integer
          description: Highest source changelog sequence applied to the target so far.
          format: int32
          example: 0
        verifiedAt:
          type: string
          description: Time the migrated data was verified against the source in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        cutoverAt:
          type: string
          description: Time routing was flipped to the target in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        soakUntil:
          type: string
          description: Time the post-cutover soak window ends in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        autoCutover:
          type: boolean
          description: Whether the migration cuts over automatically once ready. Set when the migration is created and never changed afterwards, so it always reports what was asked for.
          example: true
        cutoverRequested:
          type: boolean
          description: Whether a cutover has been requested and not yet attempted. Set by the cutover endpoint and cleared when the attempt is made, so a cutover that fails a check parks the migration again rather than retrying on its own.
          example: false
        paused:
          type: boolean
          description: Whether the migration is paused.
          example: false
      required:
      - $id
      - $createdAt
      - $updatedAt
      - projectId
      - databaseId
      - specification
      - phase
      - attempt
      - lastError
      - lagDocuments
      - changelogWatermark
      - verifiedAt
      - cutoverAt
      - soakUntil
      - autoCutover
      - cutoverRequested
      - paused
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        projectId: 5e5ea5c16897e
        databaseId: 5e5ea5c16897e
        specification: s-2vcpu-4gb
        phase: pending
        attempt: 0
        lastError: ''
        lagDocuments: 0
        changelogWatermark: 0
        verifiedAt: '2020-10-15T06:38:00.000+00:00'
        cutoverAt: '2020-10-15T06:38:00.000+00:00'
        soakUntil: '2020-10-15T06:38:00.000+00:00'
        autoCutover: true
        cutoverRequested: false
        paused: false
