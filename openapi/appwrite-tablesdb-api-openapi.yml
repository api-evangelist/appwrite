    dedicatedDatabaseReplicas:
      description: Replicas
      type: object
      properties:
        replicas:
          type: integer
          description: Number of configured replicas. Zero means high availability is disabled.
          format: int32
          example: 2
        syncMode:
          type: string
          description: 'Requested replication sync mode. Possible values: async (asynchronous, fastest), sync (synchronous, strong consistency), quorum (quorum-based, majority of replicas must confirm). This is what was asked for; compare it with effectiveSyncMode for what the primary is enforcing.'
          example: async
        effectiveSyncMode:
          type:
          - string
          - 'null'
          description: Replication sync mode the primary is actually enforcing. Null when high availability is disabled or the state could not be read. A value below the requested syncMode means writes are being acknowledged with weaker durability than configured.
          example: async
        syncDegraded:
          type: boolean
          description: Whether the enforced replication is weaker than the requested syncMode.
          example: false
        syncAcknowledgements:
          type: integer
          description: Number of standby acknowledgements the primary waits for before a write is committed. Zero means writes are acknowledged locally.
          format: int32
          example: 1
        syncStandbyCount:
          type: integer
          description: Number of standbys registered with the primary for synchronous replication.
          format: int32
          example: 2
        syncStateConfirmed:
          type:
          - boolean
          - 'null'
          description: 'Whether the other sync fields are an engine reading rather than a recorded estimate. True when the primary answered what it is enforcing, including when that answer contradicted the record, in which case the contradicted values are replaced by the ones the engine reports. False when the reading could not be taken: the probe did not answer, there was no engine to ask, or the values describe a configuration change just applied rather than anything measured. Absent when no engine was asked at all, so an unprobed database is distinguishable from an unconfirmed one. False never means a standby was found lagging, because it is the absence of a reading rather than a negative one, so draw no conclusion about replication health from it or from a response that omits it.'
          example: true
        members:
          type: array
          description: Per-pod statuses for the primary and every replica.
          items:
            $ref: '#/components/schemas/dedicatedDatabaseMember'
          example: []
      required:
      - replicas
      - syncMode
      - syncDegraded
      - syncAcknowledgements
      - syncStandbyCount
      - members
      example:
        replicas: 2
        syncMode: async
        effectiveSyncMode: async
        syncDegraded: false
        syncAcknowledgements: 1
        syncStandbyCount: 2
        syncStateConfirmed: true
        members: []
