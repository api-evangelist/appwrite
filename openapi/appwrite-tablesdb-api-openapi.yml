    databaseStatus:
      description: Status
      type: object
      properties:
        health:
          type: string
          description: 'Overall health status: healthy, degraded, unhealthy, or unknown when nothing could be measured.'
          example: healthy
        ready:
          type: boolean
          description: Whether the database is ready to accept connections.
          example: true
        engine:
          type: string
          description: 'Database engine: postgresql, mysql, or mongodb.'
          example: postgresql
        version:
          type: string
          description: Database engine version.
          example: '17'
        uptime:
          type: integer
          description: Database uptime in seconds.
          format: int32
          example: 86400
        connections:
          type: object
          description: Connection statistics.
          example:
            current: 12
            max: 100
          allOf:
          - $ref: '#/components/schemas/databaseStatusConnections'
        syncMode:
          type: string
          description: 'Requested replication sync mode. Possible values: async, sync, quorum. Compare with effectiveSyncMode for what the primary is enforcing.'
          example: async
        effectiveSyncMode:
          type:
          - string
          - 'null'
          description: Replication sync mode the primary is actually enforcing. Null when high availability is disabled or the state could not be read.
          example: async
        syncDegraded:
          type: boolean
          description: Whether the enforced replication is weaker than the requested syncMode.
          example: false
        syncAcknowledgements:
          type: integer
          description: Number of standby acknowledgements the primary waits for before a write is committed.
          format: int32
          example: 1
        syncStandbyCount:
          type: integer
          description: Number of standbys registered with the primary for synchronous replication.
          format: int32
          example: 2
        syncStateConfirmed:
          type:
          - boolean
          - 'null'
          description: 'Whether the other sync fields are an engine reading rather than a recorded estimate. True when the primary answered what it is enforcing, including when that answer contradicted the record, in which case the contradicted values are replaced by the ones the engine reports. False when the reading could not be taken: the probe did not answer, there was no engine to ask, or the values describe a configuration change just applied rather than anything measured. Absent when no engine was asked at all, so an unprobed database is distinguishable from an unconfirmed one. False never means a standby was found lagging, because it is the absence of a reading rather than a negative one, so draw no conclusion about replication health from it or from a response that omits it.'
          example: true
        replicas:
          type: array
          description: List of database replicas and their status. Every configured member appears, including one the backend has not brought up, which is reported as not healthy.
          items:
            $ref: '#/components/schemas/databaseStatusReplica'
          example:
          - index: 0
            role: primary
            healthy: true
            replicating: null
            lagSeconds: null
          - index: 1
            role: replica
            healthy: true
            replicating: true
            lagSeconds: 0.2
        volumes:
          type: array
          description: Storage volume information.
          items:
            $ref: '#/components/schemas/databaseStatusVolume'
          example:
          - data:
              path: /var/lib/postgresql/data
              usedPercent: 45%
              available: 55GB
              mounted: true
      required:
      - health
      - ready
      - engine
      - version
      - uptime
      - connections
      - syncMode
      - syncDegraded
      - syncAcknowledgements
      - syncStandbyCount
      - replicas
      - volumes
      example:
        health: healthy
        ready: true
        engine: postgresql
        version: '17'
        uptime: 86400
        connections:
          current: 12
          max: 100
        syncMode: async
        effectiveSyncMode: async
        syncDegraded: false
        syncAcknowledgements: 1
        syncStandbyCount: 2
        syncStateConfirmed: true
        replicas:
        - index: 0
          role: primary
          healthy: true
          replicating: null
          lagSeconds: null
        - index: 1
          role: replica
          healthy: true
          replicating: true
          lagSeconds: 0.2
        volumes:
          data:
            path: /var/lib/postgresql/data
            usedPercent: 45%
            available: 55GB
            mounted: true
