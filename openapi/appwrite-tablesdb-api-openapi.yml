    dedicatedDatabaseMember:
      description: Member
      type: object
      properties:
        $id:
          type: string
          description: Member identifier.
          example: '1'
        role:
          type: string
          description: 'Member role. Possible values: primary (accepts reads and writes), replica (read-only follower), unknown (placement not established; reported while a transition is moving or restarting the topology and this member has not been probed, so no member can be named the write target).'
          example: replica
        status:
          type: string
          description: 'Member pod status. Possible values: pending (configured but absent from the backend topology, so nothing is bringing it up), provisioning (pod missing or Pending), starting (Running but not Ready), active (Running and Ready), failed (Failed phase or CrashLoopBackOff container), or the lowercased pod phase reported by the cluster.'
          example: active
        replicating:
          type:
          - boolean
          - 'null'
          description: 'Whether the engine reports this member''s replication stream as up. Null when no reading was taken: a primary has no stream to report, and a member that is not active, or whose probe did not answer, has none yet. False is a reading and null is the absence of one, so the two are not interchangeable. Read it beside lagSeconds before expecting a failover that names no target to find a promotable standby: a member streaming at a known lag is one, and a member reporting null is not evidence either way.'
          example: true
        lagSeconds:
          type:
          - number
          - 'null'
          description: 'Replication lag in seconds. Null when the lag is not known: a primary has none to report, and a member the backend has not probed has none yet. Also null against `replicating: true`, for a member that is streaming but whose engine printed no numeric lag.'
          format: double
          example: 0.5
      required:
      - $id
      - role
      - status
      example:
        $id: '1'
        role: replica
        status: active
        replicating: true
        lagSeconds: 0.5
