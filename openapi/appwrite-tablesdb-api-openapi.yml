          description: Database display name.
          example: My Production Database
        api:
          type: string
          description: 'Product API that owns this database: tablesdb, documentsdb, vectorsdb, mysql, postgresql, or mongodb.'
          example: postgresql
        engine:
          type: string
          description: 'Database engine: postgresql, mysql, or mongodb. Null until the backing reports one.'
          example: postgresql
        version:
          type: string
          description: Database engine version.
          example: '16'
        specification:
