          example: true
        array:
          type:
          - boolean
          - 'null'
          description: Is column an array?
          example: false
        $createdAt:
          type: string
          description: Column creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Column update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        min:
          type:
          - integer
          - 'null'
          description: Minimum value to enforce for new documents.
          format: int64
          example: 1
        max:
          type:
          - integer
          - 'null'
          description: Maximum value to enforce for new documents.
          format: int64
          example: 10
        default:
          type:
          - integer
          - 'null'
          description: Default value for column when not provided. Cannot be set when column is required.
          format: int64
          example: 10
      required:
      - key
      - type
      - status
      - error
      - required
      - $createdAt
      - $updatedAt
      example:
        key: count
        type: bigint
        status: available
        error: string
        required: true
        array: false
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        min: 1
        max: 10
        default: 10
    dedicatedDatabaseOperationList:
      description: OperationList
      type: object
      properties:
        total:
          type: integer
          description: Total number of operations.
          format: int32
          example: 5
        operations:
          type: array
          description: List of operations.
          items:
            $ref: '#/components/schemas/dedicatedDatabaseOperation'
          example: []
      required:
      - total
      - operations
      example:
        total: 5
        operations: ''
