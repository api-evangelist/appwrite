          description: The build command used to build the deployment.
          example: npm install
        entrypoint:
          type: string
          description: The entrypoint file used to execute the deployment.
          example: index.js
        providerRootDirectory:
          type: string
          description: Path to function in VCS (Version Control System) repository
          example: node/starter
      required:
      - name
      - commands
      - entrypoint
      - providerRootDirectory
      example:
        name: node-19.0
        commands: npm install
        entrypoint: index.js
        providerRootDirectory: node/starter
    headers:
      description: Headers
      type: object
      properties:
        name:
          type: string
          description: Header name.
          example: Content-Type
        value:
          type: string
          description: Header value.
          example: application/json
      required:
      - name
      - value
      example:
        name: Content-Type
        value: application/json
    functionList:
      description: Functions List
      type: object
      properties:
        total:
          type: integer
          description: Total number of functions that matched your query.
          format: int32
          example: 5
        functions:
          type: array
          description: List of functions.
          items:
            $ref: '#/components/schemas/function'
          example: []
      required:
      - total
      - functions
      example:
        total: 5
        functions: ''
