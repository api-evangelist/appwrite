openapi: 3.2.0
info:
  version: 2.0.0
  title: Appwrite Functions API
  description: Appwrite backend as a service cuts up to 70% of the time and costs required for building a modern application. We abstract and simplify common development tasks behind a REST APIs, to help you develop your app in a fast and secure way. For full API documentation and tutorials go to https://appwrite.io/docs
  termsOfService: https://appwrite.io/policy/terms
  contact:
    name: Appwrite Team
    url: https://appwrite.io/support
    email: team@appwrite.io
  license:
    name: BSD-3-Clause
    url: https://raw.githubusercontent.com/appwrite/appwrite/master/LICENSE
servers:
- url: https://cloud.appwrite.io/v1
  description: Appwrite Cloud endpoint.
- url: https://{region}.cloud.appwrite.io/v1
  description: Appwrite Cloud regional endpoint. Replace `{region}` with your project region.
  variables:
    region:
      default: fra
      description: Appwrite Cloud region.
tags:
- name: Functions
  description: The Functions Service allows you view, create and manage your Cloud Functions.
paths:
  /functions:
    get:
      summary: List functions
      operationId: functionsList
      tags:
      - Functions
      description: Get a list of all the project's functions. You can use the query params to filter your results.
      responses:
        '200':
          description: Functions List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/functionList'
      deprecated: false
      x-appwrite:
        group: functions
        demo: functions/list.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: functions.read
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
      parameters:
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: name, enabled, runtime, deploymentId, schedule, scheduleNext, schedulePrevious, timeout, entrypoint, commands, installationId'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: search
        description: 'Search term to filter your list results. Max length: 256 chars.'
        required: false
        schema:
          type: string
          example: <SEARCH>
          default: ''
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
    post:
      summary: Create function
      operationId: functionsCreate
      tags:
      - Functions
      description: Create a new function. You can pass a list of permissions to allow different project users or team with access to execute the function using the client API.
      responses:
        '201':
          description: Function
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/function'
      deprecated: false
      x-appwrite:
        group: functions
        demo: functions/create.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: functions.write
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                functionId:
                  description: Function ID. Choose a custom ID or generate a random ID with `ID.unique()`. Valid chars are a-z, A-Z, 0-9, period, hyphen, and underscore. Can't start with a special char. Max length is 36 chars.
                  type: string
                  example: <FUNCTION_ID>
                  x-appwrite:
                    idGenerator: ID.unique
                name:
                  description: 'Function name. Max length: 128 chars.'
                  type: string
                  example: <NAME>
                runtime:
                  description: Execution runtime.
                  type: string
                  example: node-14.5
                  title: Runtime
