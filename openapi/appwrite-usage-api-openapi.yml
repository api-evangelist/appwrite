          type:
          - string
          - 'null'
          description: Bucket start timestamp in ISO 8601. Omitted for flat dimension aggregates.
          example: '2026-04-09T12:00:00.000+00:00'
        value:
          type: number
          description: Aggregated value for the point.
          format: double
          example: 5000
        path:
          type:
          - string
          - 'null'
          description: Value when broken down by `path`.
          example: /v1/storage/files
        method:
          type:
          - string
          - 'null'
          description: Value when broken down by `method`.
          example: POST
        status:
          type:
          - string
          - 'null'
          description: Value when broken down by `status`.
          example: '201'
        service:
          type:
          - string
          - 'null'
          description: Value when broken down by `service`.
          example: storage
        country:
          type:
          - string
          - 'null'
          description: Value when broken down by `country`.
          example: us
        region:
          type:
          - string
          - 'null'
          description: Value when broken down by `region`.
          example: default
        hostname:
          type:
          - string
          - 'null'
          description: Value when broken down by `hostname`.
          example: app.example.com
        ip:
          type:
          - string
          - 'null'
          description: Value when broken down by `ip`.
          example: 192.0.2.44
        osName:
          type:
          - string
          - 'null'
          description: Value when broken down by `osName`.
          example: iOS
        clientType:
          type:
          - string
          - 'null'
          description: Value when broken down by `clientType`.
          example: browser
        clientName:
          type:
          - string
          - 'null'
          description: Value when broken down by `clientName`.
          example: Chrome
        sdk:
          type:
          - string
          - 'null'
          description: Value when broken down by `sdk`.
          example: web
        sdkVersion:
          type:
          - string
          - 'null'
          description: Value when broken down by `sdkVersion`.
          example: 14.0.0
        deviceName:
          type:
          - string
          - 'null'
          description: Value when broken down by `deviceName`.
          example: smartphone
        resourceId:
          type:
          - string
          - 'null'
          description: Value when broken down by `resourceId`.
          example: abc123
        resourceType:
          type:
          - string
          - 'null'
          description: Value when broken down by `resourceType`.
          example: bucket
        ordinal:
          type:
          - string
          - 'null'
          description: Value when broken down by `ordinal`.
          example: '0'
        continentCode:
          type:
          - string
          - 'null'
          description: Continent code when broken down by `continentCode`.
          example: NA
        city:
          type:
          - string
          - 'null'
          description: City name when broken down by `city`.
          example: Mountain View
        subdivisions:
          type:
          - string
          - 'null'
          description: Region/state chain when broken down by `subdivisions`.
          example: California
        isp:
          type:
          - string
          - 'null'
          description: Internet service provider when broken down by `isp`.
          example: Google
        autonomousSystemNumber:
          type:
          - string
          - 'null'
          description: Autonomous System Number (ASN) when broken down by `autonomousSystemNumber`.
          example: '15169'
        autonomousSystemOrganization:
          type:
          - string
          - 'null'
          description: Organization owning the ASN when broken down by `autonomousSystemOrganization`.
          example: GOOGLE
        connectionType:
          type:
          - string
          - 'null'
          description: Connection type when broken down by `connectionType`.
          example: cable
        connectionUsageType:
          type:
          - string
          - 'null'
          description: Connection usage type when broken down by `connectionUsageType`.
          example: residential
        connectionOrganization:
          type:
          - string
          - 'null'
          description: Registered organization of the IP when broken down by `connectionOrganization`.
          example: Google LLC
        teamId:
          type:
          - string
          - 'null'
          description: Owning team ID when broken down by `teamId`.
          example: team_abc
      required:
      - value
      example:
        time: '2026-04-09T12:00:00.000+00:00'
        value: 5000
        path: /v1/storage/files
        method: POST
        status: '201'
        service: storage
        country: us
        region: default
        hostname: app.example.com
        ip: 192.0.2.44
        osName: iOS
        clientType: browser
        clientName: Chrome
        sdk: web
        sdkVersion: 14.0.0
        deviceName: smartphone
        resourceId: abc123
        resourceType: bucket
        ordinal: '0'
        continentCode: NA
        city: Mountain View
        subdivisions: California
        isp: Google
        autonomousSystemNumber: '15169'
        autonomousSystemOrganization: GOOGLE
        connectionType: cable
        connectionUsageType: residential
        connectionOrganization: Google LLC
        teamId: team_abc
    usageMetric:
      description: usageMetric
      type: object
      properties:
        metric:
          type: string
          description: Metric key this series describes.
          example: files.storage
        points:
          type: array
          description: Data points in the requested order.
          items:
            $ref: '#/components/schemas/usageDataPoint'
          example: []
      required:
      - metric
      - points
      example:
        metric: files.storage
        points: ''
    usageGaugeList:
      description: usageGaugeList
      type: object
      properties:
        interval:
          type: string
          description: Requested interval, or an empty string for a flat aggregate.
          example: 1h
        metrics:
          type: array
          description: One series per requested gauge metric.
          items:
            $ref: '#/components/schemas/usageMetric'
          example: []
      required:
      - interval
      - metrics
      example:
        interval: 1h
        metrics: ''
    usageEventList:
      description: usageEventList
      type: object
      properties:
        interval:
          type: string
          description: Requested interval, or an empty string for a flat aggregate.
          example: 1h
        metrics:
          type: array
          description: One series per requested event metric.
          items:
            $ref: '#/components/schemas/usageMetric'
          example: []
      required:
      - interval
      - metrics
      example:
        interval: 1h
        metrics: ''
