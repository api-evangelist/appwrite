          type: string
          example: <APP_ID>
        in: path
  /apps/{appId}/keys/{keyId}:
    get:
      summary: Get App Key
      operationId: appsGetKey
      tags:
      - Apps
      description: Get an app key by its unique ID.
      responses:
        '200':
          description: AppKey
          content:
            application/json:
