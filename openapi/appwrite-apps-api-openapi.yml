        token_type: Bearer
        expires_in: 3600
        refresh_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        scope: openid email profile
        authorization_details: '[{"type":"calendar","identifier":"primary","actions":["read_events"]}]'
        id_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
    appInstallation:
      description: AppInstallation
      type: object
      properties:
        $id:
          type: string
          description: Installation ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Installation creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Installation update time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        appId:
          type: string
          description: ID of the installed application.
          example: 5e5ea5c16897e
        teamId:
          type: string
          description: ID of the team the application is installed on.
          example: 5e5ea5c16897e
        scopes:
          type: array
          description: Scopes granted to the application. Snapshot of the application's installation scopes taken when the installation was created or last updated.
          items:
            type: string
          example:
          - organization:organization.read
        authorizationDetails:
          type: array
          description: Authorization details granted to the application. Rich authorization request (RFC 9396) style entries; the Appwrite Console stores authorized project IDs here.
          items:
            type: object
          example:
          - type: project
            identifiers:
            - '*'
        createdById:
          type: string
          description: ID of the user who created the installation.
          example: 5e5ea5c16897e
        createdByName:
          type: string
          description: Name of the user who created the installation.
          example: Walter White
        lastAccessedAt:
          type:
          - string
          - 'null'
          description: Time an access token was last issued for the installation in ISO 8601 format. Null if never used.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - $id
      - $createdAt
      - $updatedAt
      - appId
      - teamId
      - scopes
      - authorizationDetails
      - createdById
      - createdByName
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        appId: 5e5ea5c16897e
        teamId: 5e5ea5c16897e
        scopes:
        - organization:organization.read
        authorizationDetails:
        - type: project
          identifiers:
          - '*'
        createdById: 5e5ea5c16897e
        createdByName: Walter White
        lastAccessedAt: '2020-10-15T06:38:00.000+00:00'
    appInstallationList:
      description: App installations list
      type: object
      properties:
        total:
          type: integer
          description: Total number of installations that matched your query.
          format: int32
          example: 5
        installations:
          type: array
          description: List of installations.
          items:
            $ref: '#/components/schemas/appInstallation'
          example: []
      required:
      - total
      - installations
      example:
        total: 5
        installations: ''
    appsList:
      description: Apps list
      type: object
      properties:
        total:
          type: integer
          description: Total number of apps that matched your query.
          format: int32
          example: 5
        apps:
          type: array
          description: List of apps.
          items:
            $ref: '#/components/schemas/app'
          example: []
      required:
      - total
      - apps
      example:
        total: 5
        apps: ''
    appKeyList:
      description: App keys list
      type: object
      properties:
        total:
          type: integer
          description: Total number of keys that matched your query.
          format: int32
          example: 5
        keys:
          type: array
          description: List of keys.
          items:
            $ref: '#/components/schemas/appKey'
          example: []
      required:
      - total
      - keys
      example:
        total: 5
        keys: ''
    appSecretList:
      description: App secrets list
      type: object
      properties:
        total:
          type: integer
          description: Total number of secrets that matched your query.
          format: int32
          example: 5
        secrets:
          type: array
          description: List of secrets.
          items:
            $ref: '#/components/schemas/appSecret'
          example: []
      required:
      - total
      - secrets
      example:
        total: 5
        secrets: ''
