components:
  schemas:
    appKey:
      description: AppKey
      type: object
      properties:
        $id:
          type: string
          description: App key ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: App key creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: App key update time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        appId:
          type: string
          description: Application ID this app key belongs to.
          example: 5e5ea5c16897e
        secret:
          type: string
          description: App key secret.
          example: 5f3c8d2a1b9e4f7a6c8b2d1e9f4a7b3c5d8e1f2a9b4c7d6e3f5a8b1c4d7e2f9a
        hint:
          type: string
          description: Last few characters of the app key secret, used to help identify it.
          example: f5c6c7
        createdById:
          type: string
          description: ID of the user who created the app key.
          example: 5e5ea5c16897e
        createdByName:
          type: string
          description: Name of the user who created the app key.
          example: Walter White
        lastAccessedAt:
          type:
          - string
          - 'null'
          description: Time the app key was last used for authentication in ISO 8601 format. Null if never used.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - $id
      - $createdAt
      - $updatedAt
      - appId
      - secret
      - hint
      - createdById
      - createdByName
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        appId: 5e5ea5c16897e
        secret: 5f3c8d2a1b9e4f7a6c8b2d1e9f4a7b3c5d8e1f2a9b4c7d6e3f5a8b1c4d7e2f9a
        hint: f5c6c7
        createdById: 5e5ea5c16897e
        createdByName: Walter White
        lastAccessedAt: '2020-10-15T06:38:00.000+00:00'
    appSecret:
      description: AppSecret
      type: object
      properties:
        $id:
          type: string
          description: Secret ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Secret creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Secret update time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        appId:
          type: string
          description: Application ID this secret belongs to.
          example: 5e5ea5c16897e
        secret:
          type: string
          description: Always empty. The application client secret is returned only once, in the response of the createSecret method.
          example: ''
        hint:
          type: string
          description: Last few characters of the client secret, used to help identify it.
          example: f5c6c7
        createdById:
          type: string
          description: ID of the user who created the secret.
          example: 5e5ea5c16897e
        createdByName:
          type: string
          description: Name of the user who created the secret.
          example: Walter White
        lastAccessedAt:
          type:
          - string
          - 'null'
          description: Time the secret was last used for authentication in ISO 8601 format. Null if never used.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - $id
      - $createdAt
      - $updatedAt
      - appId
      - secret
      - hint
      - createdById
      - createdByName
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        appId: 5e5ea5c16897e
        secret: ''
        hint: f5c6c7
        createdById: 5e5ea5c16897e
        createdByName: Walter White
        lastAccessedAt: '2020-10-15T06:38:00.000+00:00'
    app:
      description: App
      type: object
      properties:
        $id:
          type: string
          description: App ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: App creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: App update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Application name.
          example: My Application
        description:
          type: string
          description: Application description shown to users during OAuth2 consent.
          example: Connect your workspace to My Application.
        clientUri:
          type: string
          description: Application homepage URL shown to users during OAuth2 consent.
          example: https://example.com
        logoUri:
          type: string
          description: Application logo URL shown to users during OAuth2 consent.
          example: https://example.com/logo.png
        privacyPolicyUrl:
          type: string
          description: Application privacy policy URL shown to users during OAuth2 consent.
          example: https://example.com/privacy
        termsUrl:
          type: string
          description: Application terms of service URL shown to users during OAuth2 consent.
          example: https://example.com/terms
        contacts:
          type: array
          description: Application support or security contact emails.
          items:
            type: string
          example:
          - support@example.com
        tagline:
          type: string
          description: Application tagline shown to users during OAuth2 consent.
          example: Automate your workspace.
        tags:
          type: array
          description: Application tags shown to users during OAuth2 consent.
          items:
            type: string
          example:
          - productivity
          - automation
        labels:
          type: array
          description: Application labels. Read-only for clients; only a server SDK using a project API key can update them.
          items:
            type: string
          example:
          - featured
        images:
          type: array
          description: Application image URLs shown to users during OAuth2 consent.
          items:
            type: string
          example:
          - https://example.com/screenshot.png
        supportUrl:
          type: string
          description: Application support URL shown to users during OAuth2 consent.
          example: https://example.com/support
        dataDeletionUrl:
          type: string
          description: Application data deletion URL shown to users during OAuth2 consent.
          example: https://example.com/data-deletion
        redirectUris:
          type: array
          description: List of authorized redirect URIs. These URIs can be used to redirect users after they authenticate.
          items:
            type: string
          example:
          - https://example.com/callback
        postLogoutRedirectUris:
          type: array
          description: List of authorized post-logout redirect URIs for OpenID Connect RP-Initiated Logout. The logout endpoint only redirects users to URIs in this list after ending their session.
          items:
            type: string
          example:
          - https://example.com/logged-out
        enabled:
          type: boolean
          description: Whether the app is enabled or not.
          example: true
        type:
          type: string
          description: OAuth2 client type. `public` for SPAs, mobile, and native apps that cannot keep a client secret (PKCE required); `confidential` for server-side clients that authenticate with a client secret.
          example: confidential
        deviceFlow:
          type: boolean
          description: Whether this client may use the OAuth2 Device Authorization Grant (RFC 8628).
          example: false
        teamId:
          type: string
          description: ID of team that owns the application, if owned by team. Otherwise, user ID will be used.
          example: 5e5ea5c16897e
        userId:
          type: string
          description: ID of user who owns the application, if owned by user. Otherwise, team ID will be used.
          example: 5e5ea5c16897e
        installationScopes:
          type: array
          description: Scopes the application requests when installed on a team. Organization-level and project-level scopes only.
          items:
            type: string
          example:
          - organization:organization.read
        installationRedirectUrl:
          type: string
          description: URL users are redirected to after creating or updating an installation of this application. Empty for no redirect.
          example: https://example.com/setup
        secrets:
          type: array
          description: List of application secrets.
          items:
            $ref: '#/components/schemas/appSecret'
          example: []
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - description
      - clientUri
      - logoUri
      - privacyPolicyUrl
      - termsUrl
      - contacts
      - tagline
      - tags
      - labels
      - images
      - supportUrl
      - dataDeletionUrl
      - redirectUris
      - postLogoutRedirectUris
      - enabled
      - type
      - deviceFlow
      - teamId
      - userId
      - installationScopes
      - installationRedirectUrl
      - secrets
