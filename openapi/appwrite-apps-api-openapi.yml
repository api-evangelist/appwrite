          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        Key: []
        JWT: []
      parameters:
      - name: appId
        description: Application unique ID.
        required: true
        schema:
          type: string
          example: <APP_ID>
        in: path
      - name: keyId
