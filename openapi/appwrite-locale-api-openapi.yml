        rate-key: url:{url},ip:{ip}
        scope: locale.read
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        Key: []
        JWT: []
  /locale/continents:
    get:
      summary: List continents
      operationId: localeListContinents
      tags:
