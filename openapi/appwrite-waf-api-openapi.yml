  /waf/rules/rate-limit:
    post:
      summary: Create a rate-limit WAF rule
      operationId: wafCreateRateLimitRule
      tags:
      - waf
      description: 'Create a rate limit WAF rule. Use `key` to choose the counter: `ip` limits per client IP, while `userId` limits per authenticated user (requests without an authenticated user skip `userId` rules). Conditions can match request attributes including `ip` (plain IPs or CIDR blocks like `10.0.0.0/8`), `method`, `path`, `host`, `country`, `continent`, `headers.`, `query.`, `queryKeys`, `userAgent`, `os`, `osVersion`, `browser`, and `browserVersion`. Conditions on `city` and `state` require the premium Geo DB addon.'
      responses:
        '201':
          description: WafRuleRateLimit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wafRuleRateLimit'
      deprecated: false
      x-appwrite:
        group: rules
        demo: waf/create-rate-limit-rule.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: wafRules.write
        platforms:
        - console
        - server
        packaging: false
        public: true
