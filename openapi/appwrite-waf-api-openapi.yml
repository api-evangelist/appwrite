openapi: 3.2.0
info:
  version: 2.0.0
  title: Appwrite Waf API
  description: Appwrite backend as a service cuts up to 70% of the time and costs required for building a modern application. We abstract and simplify common development tasks behind a REST APIs, to help you develop your app in a fast and secure way. For full API documentation and tutorials go to https://appwrite.io/docs
  termsOfService: https://appwrite.io/policy/terms
  contact:
    name: Appwrite Team
    url: https://appwrite.io/support
    email: team@appwrite.io
  license:
    name: BSD-3-Clause
    url: https://raw.githubusercontent.com/appwrite/appwrite/master/LICENSE
servers:
- url: https://cloud.appwrite.io/v1
  description: Appwrite Cloud endpoint.
- url: https://{region}.cloud.appwrite.io/v1
  description: Appwrite Cloud regional endpoint. Replace `{region}` with your project region.
  variables:
    region:
      default: fra
      description: Appwrite Cloud region.
tags:
- name: waf
  description: ''
paths:
  /waf/rules:
    get:
      summary: List WAF rules
      operationId: wafListRules
      tags:
      - waf
      description: List WAF rules for the current project.
      responses:
        '200':
          description: WAF rule list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wafRuleList'
      deprecated: false
      x-appwrite:
        group: rules
        demo: waf/list-rules.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: wafRules.read
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
      parameters:
      - name: queries
        description: Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long.
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: search
        description: 'Search term to filter your list results. Max length: 256 chars.'
        required: false
        schema:
          type: string
          example: <SEARCH>
          default: ''
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
  /waf/rules/bypass:
    post:
      summary: Create a bypass WAF rule
      operationId: wafCreateBypassRule
      tags:
      - waf
      description: Create a bypass WAF rule. Conditions can match request attributes including `ip` (plain IPs or CIDR blocks like `10.0.0.0/8`), `method`, `path`, `host`, `country`, `continent`, `headers.`, `query.`, `queryKeys`, `userAgent`, `os`, `osVersion`, `browser`, and `browserVersion`. Conditions on `city` and `state` require the premium Geo DB addon.
      responses:
        '201':
          description: WafRuleBypass
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wafRuleBypass'
      deprecated: false
      x-appwrite:
        group: rules
        demo: waf/create-bypass-rule.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: wafRules.write
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleId:
                  description: Rule ID. Choose a custom ID or pass `ID.unique()` to generate a unique one.
                  type: string
                  example: <RULE_ID>
                  x-appwrite:
                    idGenerator: ID.unique
                resourceType:
                  description: Resource type the rule applies to.
                  type: string
                  example: api
                resourceId:
                  description: Resource identifier. Leave empty for the API resource type.
                  type:
                  - string
                  - 'null'
                  example: <RESOURCE_ID>
                name:
                  description: Rule name.
                  type: string
                  example: <NAME>
                description:
                  description: Optional description for the rule.
                  type: string
                  default: ''
                  example: <DESCRIPTION>
                priority:
                  description: Evaluation priority. Lower numbers run earlier.
                  type: integer
                  default: 0
                  example: -100000
                  format: int32
                enabled:
                  description: Set to false to create the rule in a disabled state.
                  type: boolean
                  default: true
                  example: false
                conditions:
                  description: Array of condition strings generated using the WAF Condition builder. Maximum of 100 conditions are allowed, each 4096 characters long.
                  type: string
                  default: []
              required:
              - ruleId
              - resourceType
              - name
  /waf/rules/bypass/{ruleId}:
