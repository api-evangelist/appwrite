          example: <RULE_ID>
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resourceType:
                  description: Resource type the rule applies to.
                  type:
                  - string
                  - 'null'
                  example: api
                resourceId:
                  description: Resource identifier. Required for functions and sites.
                  type:
                  - string
                  - 'null'
                  example: <RESOURCE_ID>
                name:
                  description: Rule name.
                  type:
                  - string
                  - 'null'
                  example: <NAME>
                description:
                  description: Optional description for the rule.
                  type:
                  - string
                  - 'null'
                  example: <DESCRIPTION>
                priority:
                  description: Evaluation priority. Lower numbers run earlier.
                  type:
                  - integer
                  - 'null'
                  example: -100000
                  format: int32
                enabled:
                  description: Set to false to disable the rule.
                  type:
                  - boolean
                  - 'null'
                  example: false
                conditions:
                  description: Array of condition strings generated using the WAF Condition builder. Maximum of 100 conditions are allowed, each 4096 characters long.
                  type:
                  - string
                  - 'null'
  /waf/rules/challenge:
    post:
      summary: Create a challenge WAF rule
      operationId: wafCreateChallengeRule
      tags:
      - waf
      description: Create a challenge WAF rule. Use `difficulty` (1 easiest to 5 hardest) to tune the client-side proof-of-work cost, and `ttl` to control how long, in seconds, a visitor stays cleared after passing the challenge before being challenged again. Conditions can match request attributes including `ip` (plain IPs or CIDR blocks like `10.0.0.0/8`), `method`, `path`, `host`, `country`, `continent`, `headers.`, `query.`, `queryKeys`, `userAgent`, `os`, `osVersion`, `browser`, and `browserVersion`. Conditions on `city` and `state` require the premium Geo DB addon.
      responses:
        '201':
          description: WafRuleChallenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wafRuleChallenge'
      deprecated: false
      x-appwrite:
        group: rules
        demo: waf/create-challenge-rule.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: wafRules.write
        platforms:
        - console
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          server:
            Project: []
            Key: []
      security:
      - Project: []
        Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleId:
                  description: Rule ID. Choose a custom ID or pass `ID.unique()` to generate a unique one.
                  type: string
                  example: <RULE_ID>
                  x-appwrite:
                    idGenerator: ID.unique
                resourceType:
                  description: Resource type the rule applies to.
                  type: string
                  example: api
                resourceId:
                  description: Resource identifier. Required for functions and sites.
                  type:
                  - string
                  - 'null'
                  example: <RESOURCE_ID>
                name:
                  description: Rule name.
                  type: string
                  example: <NAME>
                description:
                  description: Optional description for the rule.
                  type: string
                  default: ''
                  example: <DESCRIPTION>
                challengeType:
                  description: Challenge type enforced by the rule.
                  type: string
                  default: compute
                  example: compute
                priority:
                  description: Evaluation priority. Lower numbers run earlier.
                  type: integer
                  default: 0
                  example: -100000
                  format: int32
                enabled:
                  description: Set to false to create the rule in a disabled state.
                  type: boolean
                  default: true
                  example: false
                conditions:
                  description: Array of condition strings generated using the WAF Condition builder. Maximum of 100 conditions are allowed, each 4096 characters long.
                  type: string
                  default: []
                difficulty:
                  description: Challenge difficulty from 1 (easiest) to 5 (hardest). Higher values demand more client-side proof-of-work.
                  type: integer
                  default: 3
                  example: 1
                  format: int32
                ttl:
                  description: How long, in seconds, a visitor stays cleared after passing the challenge before being challenged again.
                  type: integer
                  default: 1800
                  example: 900
                  format: int32
              required:
              - ruleId
              - resourceType
              - name
