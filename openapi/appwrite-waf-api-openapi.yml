          type: integer
          description: Maximum number of matching requests allowed for the given interval.
          format: int32
          example: 1000
        interval:
          type: integer
          description: Interval in seconds for the rate limit window.
          format: int32
          example: 60
        key:
          type: string
          description: 'Rate limit key: `ip` limits per client IP, `userId` limits per authenticated user.'
          example: userId
        strategy:
          type: string
          description: 'Rate limit strategy: `fixedWindow`, `slidingWindow`, or `tokenBucket`.'
          example: slidingWindow
        maxBucketSize:
          type: integer
          description: Maximum burst capacity in tokens, applied by the `tokenBucket` strategy. The sustained refill rate is `limit / interval`. Defaults to `limit`.
          format: int32
          example: 200
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - description
      - teamId
      - projectId
      - resourceType
      - resourceId
      - action
      - priority
      - enabled
      - conditions
      - config
      - limit
      - interval
      - key
      - strategy
      - maxBucketSize
      example:
        $id: wafRule1
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: Block anonymous POST traffic
        description: Blocks anonymous POST calls to /v1/graphql
        teamId: 5e5ea5c16897e
        projectId: cloudConsole
        resourceType: functions
        resourceId: functionId
        action: deny
        priority: 100
        enabled: true
        conditions:
        - method: equal
          attribute: ip
          values:
          - 127.0.0.1
        config: []
        limit: 1000
        interval: 60
        key: userId
        strategy: slidingWindow
        maxBucketSize: 200
