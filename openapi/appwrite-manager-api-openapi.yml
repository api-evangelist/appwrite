        team: 5e5ea5c16897f
        deployment: 5e5ea5c168981
        domain: function.example.com
        resource: function
        function: 5e5ea5c168980
        site: 5e5ea5c168980
    managerWafRule:
      description: ManagerWafRule
      type: object
      properties:
        $id:
          type: string
          description: Rule ID.
          example: wafRule1
        $createdAt:
          type: string
          description: WAF rule creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: WAF rule last update time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Human friendly rule name.
          example: Block anonymous POST traffic
        description:
          type: string
          description: Optional description for the rule.
          example: Blocks anonymous POST calls to /v1/graphql
        teamId:
          type: string
          description: Team ID.
          example: 5e5ea5c16897e
        projectId:
          type: string
          description: Project ID.
          example: cloudConsole
        resourceType:
          type: string
          description: Resource type the rule is scoped to.
          example: functions
        resourceId:
          type: string
          description: Resource identifier. Empty for API-wide rules.
          example: functionId
        action:
          description: Action performed when the rule matches.
          example: deny
          title: WafRuleAction
          type: string
          oneOf:
          - type: string
            enum:
            - bypass
            title: bypass
          - type: string
            enum:
            - deny
            title: deny
          - type: string
            enum:
            - challenge
            title: challenge
          - type: string
            enum:
            - rateLimit
            title: rateLimit
          - type: string
            enum:
            - redirect
            title: redirect
        priority:
          type: integer
          description: Evaluation priority. Lower values execute earlier.
          format: int32
          example: 100
        enabled:
          type: boolean
          description: Whether the rule is active.
          example: true
        conditions:
          type: array
          description: List of conditions evaluated for this rule.
          items:
            type: object
          example:
          - method: equal
            attribute: ip
            values:
            - 127.0.0.1
        config:
          type: object
          additionalProperties: true
          description: Action specific configuration.
          example: {}
        resourceInternalId:
          type:
          - integer
          - 'null'
          description: Internal resource sequence ID used by Edge WAF usage.
          format: int32
          example: 1
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - description
      - teamId
      - projectId
      - resourceType
      - resourceId
      - action
      - priority
      - enabled
      - conditions
      - config
      example:
        $id: wafRule1
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: Block anonymous POST traffic
        description: Blocks anonymous POST calls to /v1/graphql
        teamId: 5e5ea5c16897e
        projectId: cloudConsole
        resourceType: functions
        resourceId: functionId
        action: deny
        priority: 100
        enabled: true
        conditions:
        - method: equal
          attribute: ip
          values:
          - 127.0.0.1
        config: []
        resourceInternalId: 1
