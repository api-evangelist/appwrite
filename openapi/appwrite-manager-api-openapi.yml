          format: int32
          example: 5
        rules:
          type: array
          description: List of rules.
          items:
            $ref: '#/components/schemas/managerWafRule'
          example: []
      required:
      - total
      - rules
      example:
        total: 5
        rules: ''
    algoPhpass:
      description: AlgoPHPass
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: phpass
      required:
      - type
      example:
        type: phpass
    algoMd5:
      description: AlgoMD5
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: md5
      required:
      - type
      example:
        type: md5
    algoSha:
      description: AlgoSHA
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: sha
      required:
      - type
      example:
        type: sha
    managerDatabase:
      description: ManagerDatabase
      type: object
      properties:
        $id:
          type: string
          description: Database ID.
          example: 5e5ea5c16897e
        projectId:
          type: string
          description: Project ID that owns this database.
          example: project-abc123
        projectInternalId:
          type: string
          description: Internal (sequence) ID of the owning project generation. The Edge namespace reaper compares this against the labelled namespace generation before tearing down an orphan, so it must always be a non-empty string for a live database.
          example: '42'
        databaseInternalId:
          type: string
          description: Internal (sequence) ID of this database generation. The Edge namespace reaper compares this against the labelled namespace generation before tearing down an orphan, so it must always be a non-empty string for a live database.
          example: '7'
        database:
          type: string
          description: Physical database/catalog name. Defaults to the database ID.
          example: mydb
        hostname:
          type: string
          description: Database hostname for connections.
          example: db-myproject-mydb.fra.appwrite.center
        port:
          type: integer
          description: Database port. Null until the backing reports one.
          format: int32
          example: 5432
        engine:
          type: string
          description: 'Database engine: postgresql, mysql, or mongodb.'
          example: postgresql
        status:
          type: string
          description: 'Database status: provisioning, ready, inactive, paused, failed, deleting, deleted, restoring, scaling, upgrading, migrating.'
          example: ready
        containerStatus:
          type: string
          description: 'Container status for lifecycle-managed database runtimes: active, inactive, or failed (a wake was declined because the backing namespace is gone).'
          example: active
        lastErrorCode:
          type: string
          description: 'Code of the last failure recorded against this database. The Edge proxy reads it to refuse immediately instead of spending its cold-start budget on a wake that cannot succeed: dedicated_database_abandoned means a wake was already declined because the backing namespace is gone. Empty when no error is recorded.'
          example: dedicated_database_abandoned
        lifecycleState:
          type: string
          description: 'Idle-lifecycle state at fetch time: active, warm, cold, or hibernated. The Edge proxy labels wake telemetry with it so warm-start, cold-start, and hibernate-resume durations chart separately.'
          example: warm
        suspended:
          type: boolean
          description: Whether access to this database is suspended because the owning project is blocked, the organization is read-only (e.g. payment issue), or the plan no longer permits it. When true, the Edge proxy refuses new connections and never cold-starts the database. Recovers automatically once the underlying condition clears.
          example: false
        suspendedReason:
          type: string
          description: 'Reason access is suspended: blocked, readonly, or plan. Empty when not suspended.'
          example: readonly
        type:
          type: string
          description: 'Database type: shared (scale-to-zero pod) or dedicated (StatefulSet).'
          example: dedicated
        region:
          type: string
          description: Region identifier (e.g., fra, nyc, syd).
          example: fra
        backend:
          type: string
          description: 'Database backend provider: edge.'
          example: edge
        sqlApiEnabled:
          type: boolean
          description: Whether the SQL API is enabled for this database.
          example: true
        sqlApiAllowedStatements:
          type: array
          description: 'Statement types accepted by the SQL API. Defaults to read/write DML only; DDL/DCL types (CREATE, ALTER, DROP, TRUNCATE, GRANT, REVOKE) are opt-in per database. Allowed values: SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, TRUNCATE, GRANT, REVOKE.'
          items:
            type: string
          example:
          - SELECT
        sqlApiMaxRows:
          type: integer
          description: Maximum rows returned per SQL API execution. Results larger than this are truncated.
          format: int32
          example: 10000
        sqlApiMaxBytes:
          type: integer
          description: Maximum serialised SQL API result payload in bytes. Results larger than this are truncated.
          format: int32
          example: 10485760
        sqlApiTimeoutSeconds:
          type: integer
          description: Maximum server-side SQL API execution time in seconds before the query is cancelled.
          format: int32
          example: 30
      required:
      - $id
      - projectId
      - projectInternalId
      - databaseInternalId
      - database
      - hostname
      - port
      - engine
      - status
      - containerStatus
      - lastErrorCode
      - lifecycleState
      - suspended
      - suspendedReason
      - type
      - region
      - backend
      - sqlApiEnabled
      - sqlApiAllowedStatements
      - sqlApiMaxRows
      - sqlApiMaxBytes
      - sqlApiTimeoutSeconds
      example:
        $id: 5e5ea5c16897e
        projectId: project-abc123
        projectInternalId: '42'
        databaseInternalId: '7'
        database: mydb
        hostname: db-myproject-mydb.fra.appwrite.center
        port: 5432
        engine: postgresql
        status: ready
        containerStatus: active
        lastErrorCode: dedicated_database_abandoned
        lifecycleState: warm
        suspended: false
        suspendedReason: readonly
        type: dedicated
        region: fra
        backend: edge
        sqlApiEnabled: true
        sqlApiAllowedStatements: SELECT
        sqlApiMaxRows: 10000
        sqlApiMaxBytes: 10485760
        sqlApiTimeoutSeconds: 30
    target:
      description: Target
      type: object
      properties:
        $id:
          type: string
          description: Target ID.
          example: '259125845563242502'
        $createdAt:
          type: string
          description: Target creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Target update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Target Name.
          example: Apple iPhone 12
        userId:
          type: string
          description: User ID.
          example: '259125845563242502'
        providerId:
          type:
          - string
          - 'null'
          description: Provider ID.
          example: '259125845563242502'
        providerType:
          type: string
          description: 'The target provider type. Can be one of the following: `email`, `sms` or `push`.'
          example: email
        identifier:
          type: string
          description: The target identifier.
          example: token
        expired:
          type: boolean
          description: Is the target expired.
          example: false
      required:
