          type: string
          description: DNS Record ID.
          example: 5f40a6e10c65e
        $createdAt:
          type: string
          description: DNS Record creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: DNS Record update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        type:
          type: string
          description: DNS record type (e.g. A, CNAME, MX).
          example: A
        name:
          type: string
          description: Record name or subdomain.
          example: mail
        value:
          type: string
          description: Value of the record (IP address, domain, etc.).
          example: 192.0.2.1
        ttl:
          type: integer
          description: Time to live (in seconds).
          format: int32
          example: 86400
        priority:
          type: integer
          description: Record priority (commonly used for MX).
          format: int32
          example: 10
        lock:
          type: boolean
          description: Whether this record is locked (read-only).
          example: false
        weight:
          type: integer
          description: Record weight (used for SRV records).
          format: int32
          example: 10
        port:
          type: integer
          description: Target port (used for SRV records).
          format: int32
          example: 443
        comment:
          type: string
          description: Comment for the DNS record.
          example: Mail server record
      required:
      - $id
      - $createdAt
      - $updatedAt
      - type
      - name
      - value
      - ttl
      - priority
      - lock
      - weight
      - port
      - comment
      example:
        $id: 5f40a6e10c65e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        type: A
        name: mail
        value: 192.0.2.1
        ttl: 86400
        priority: 10
        lock: false
        weight: 10
        port: 443
        comment: Mail server record
    managerWafRuleList:
      description: Manager WAF rule list
      type: object
      properties:
        total:
          type: integer
