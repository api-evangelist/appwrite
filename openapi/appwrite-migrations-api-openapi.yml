openapi: 3.2.0
info:
  version: 2.0.0
  title: Appwrite Migrations API
  description: Appwrite backend as a service cuts up to 70% of the time and costs required for building a modern application. We abstract and simplify common development tasks behind a REST APIs, to help you develop your app in a fast and secure way. For full API documentation and tutorials go to https://appwrite.io/docs
  termsOfService: https://appwrite.io/policy/terms
  contact:
    name: Appwrite Team
    url: https://appwrite.io/support
    email: team@appwrite.io
  license:
    name: BSD-3-Clause
    url: https://raw.githubusercontent.com/appwrite/appwrite/master/LICENSE
servers:
- url: https://cloud.appwrite.io/v1
  description: Appwrite Cloud endpoint.
- url: https://{region}.cloud.appwrite.io/v1
  description: Appwrite Cloud regional endpoint. Replace `{region}` with your project region.
  variables:
    region:
      default: fra
      description: Appwrite Cloud region.
tags:
- name: Migrations
  description: The Migrations service allows you to migrate third-party data to your Appwrite project.
paths:
  /migrations:
    get:
      summary: List migrations
      operationId: migrationsList
      tags:
      - Migrations
      description: List all migrations in the current project. This endpoint returns a list of all migrations including their status, progress, and any errors that occurred during the migration process.
      responses:
        '200':
          description: Migrations List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/migrationList'
      deprecated: false
      x-appwrite:
        group: null
        demo: migrations/list.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: migrations.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/databases#querying-documents). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: status, stage, source, destination, resources, resourceId, resourceInternalId, resourceType, parentResourceId, parentResourceInternalId, parentResourceType, destinationResourceId, destinationResourceInternalId, destinationResourceType, statusCounters, resourceData, errors'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: search
        description: 'Search term to filter your list results. Max length: 256 chars.'
        required: false
        schema:
          type: string
          example: <SEARCH>
          default: ''
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
  /migrations/appwrite:
    post:
      summary: Create Appwrite migration
      operationId: migrationsCreateAppwriteMigration
      tags:
      - Migrations
      description: Migrate data from another Appwrite project to your current project. This endpoint allows you to migrate resources like databases, collections, documents, users, and files from an existing Appwrite project.
      responses:
        '202':
          description: Migration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/migration'
      deprecated: false
      x-appwrite:
        group: null
        demo: migrations/create-appwrite-migration.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: migrations.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resources:
                  description: List of resources to migrate
                  type: array
                  items:
                    title: AppwriteMigrationResource
                    type: string
                    oneOf:
                    - type: string
                      enum:
                      - user
                      title: user
                    - type: string
                      enum:
                      - team
                      title: team
                    - type: string
                      enum:
                      - membership
                      title: membership
                    - type: string
                      enum:
                      - auth-methods
                      title: auth-methods
                    - type: string
                      enum:
                      - policies
                      title: policies
                    - type: string
                      enum:
                      - oauth2-provider
                      title: oauth2-provider
                    - type: string
                      enum:
                      - database
                      title: database
                    - type: string
                      enum:
                      - table
                      title: table
                    - type: string
                      enum:
                      - column
                      title: column
                    - type: string
                      enum:
                      - index
                      title: index
                    - type: string
                      enum:
                      - row
                      title: row
                    - type: string
                      enum:
                      - document
                      title: document
                    - type: string
                      enum:
                      - attribute
                      title: attribute
