components:
  schemas:
    migrationList:
      description: Migrations List
      type: object
      properties:
        total:
          type: integer
          description: Total number of migrations that matched your query.
          format: int32
          example: 5
        migrations:
          type: array
          description: List of migrations.
          items:
            $ref: '#/components/schemas/migration'
          example: []
      required:
      - total
      - migrations
      example:
        total: 5
        migrations: ''
    migration:
      description: Migration
      type: object
      properties:
        $id:
          type: string
          description: Migration ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Migration creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Variable creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        status:
          type: string
          description: 'Migration status ( pending, processing, failed, completed ) '
          example: pending
        stage:
          type: string
          description: Migration stage ( init, processing, source-check, destination-check, migrating, finished )
          example: init
        source:
          type: string
          description: A string containing the type of source of the migration.
          example: Appwrite
        destination:
          type: string
          description: A string containing the type of destination of the migration.
          example: Appwrite
        resources:
          type: array
          description: Resources to migrate.
          items:
            type: string
          example:
          - user
        resourceId:
          type: string
          description: ID of the resource being migrated.
          example: collectionId
        resourceInternalId:
          type: string
          description: Internal ID of the resource being migrated.
          example: '1'
        resourceType:
          type: string
          description: Type of the resource being migrated.
          example: collection
        parentResourceId:
          type: string
          description: ID of the parent resource that contains the migrated resource.
          example: databaseId
        parentResourceInternalId:
          type: string
          description: Internal ID of the parent resource that contains the migrated resource.
          example: '1'
        parentResourceType:
          type: string
          description: Type of the parent resource that contains the migrated resource.
          example: database
        destinationResourceId:
          type: string
          description: ID of the destination resource created or overwritten by the migration.
          example: databaseId
        destinationResourceInternalId:
          type: string
          description: Internal ID of the destination resource created or overwritten by the migration.
          example: '1'
        destinationResourceType:
          type: string
          description: Type of the destination resource created or overwritten by the migration.
          example: database
        statusCounters:
          type: object
          additionalProperties: true
          description: A group of counters that represent the total progress of the migration.
          example:
            Database:
              PENDING: 0
              SUCCESS: 1
              ERROR: 0
              SKIP: 0
              PROCESSING: 0
              WARNING: 0
        resourceData:
          type: array
          description: An array of objects containing the report data of the resources that were migrated.
          items:
            type: object
          example:
          - resource: Database
            id: public
            status: SUCCESS
            message: ''
        errors:
          type: array
          description: All errors that occurred during the migration process.
          items:
            type: string
          example: []
        options:
          type: object
          additionalProperties: true
          description: Migration options used during the migration process.
          example:
            bucketId: exports
            notify: false
      required:
      - $id
      - $createdAt
      - $updatedAt
      - status
      - stage
      - source
      - destination
      - resources
      - resourceId
      - resourceInternalId
      - resourceType
      - parentResourceId
      - parentResourceInternalId
      - parentResourceType
      - destinationResourceId
      - destinationResourceInternalId
      - destinationResourceType
      - statusCounters
      - resourceData
      - errors
      - options
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        status: pending
        stage: init
        source: Appwrite
        destination: Appwrite
        resources:
        - user
        resourceId: collectionId
        resourceInternalId: '1'
        resourceType: collection
        parentResourceId: databaseId
        parentResourceInternalId: '1'
        parentResourceType: database
        destinationResourceId: databaseId
        destinationResourceInternalId: '1'
        destinationResourceType: database
        statusCounters: '{"Database": {"PENDING": 0, "SUCCESS": 1, "ERROR": 0, "SKIP": 0, "PROCESSING": 0, "WARNING": 0}}'
        resourceData: '[{"resource":"Database","id":"public","status":"SUCCESS","message":""}]'
        errors: []
        options: '{"bucketId": "exports", "notify": false}'
    migrationReport:
      description: Migration Report
      type: object
      properties:
        user:
          type: integer
          description: Number of users to be migrated.
          format: int32
          example: 20
        team:
          type: integer
          description: Number of teams to be migrated.
          format: int32
          example: 20
        database:
          type: integer
          description: Number of databases to be migrated.
          format: int32
          example: 20
        row:
          type: integer
          description: Number of rows to be migrated.
          format: int32
          example: 20
        file:
          type: integer
          description: Number of files to be migrated.
          format: int32
          example: 20
        bucket:
          type: integer
          description: Number of buckets to be migrated.
          format: int32
          example: 20
        function:
          type: integer
          description: Number of functions to be migrated.
          format: int32
          example: 20
        platform:
          type: integer
          description: Number of platforms to be migrated.
          format: int32
          example: 5
        api-key:
          type: integer
          description: Number of API keys to be migrated.
          format: int32
          example: 5
        project-variable:
          type: integer
          description: Number of project variables to be migrated.
          format: int32
          example: 5
        webhook:
          type: integer
          description: Number of webhooks to be migrated.
          format: int32
          example: 5
        auth-methods:
          type: integer
          description: Number of auth-method configs to be migrated (always 0 or 1 — the project-level flag bundle).
          format: int32
          example: 1
        project-protocols:
          type: integer
          description: Number of protocol configs to be migrated (always 0 or 1 — the project-level REST/GraphQL/WebSocket flags).
          format: int32
          example: 1
        project-labels:
          type: integer
          description: Number of label sets to be migrated (always 0 or 1 — the project-level RBAC label array).
          format: int32
          example: 1
        project-services:
          type: integer
          description: Number of service configs to be migrated (always 0 or 1 — the project-level enable/disable flags for all 17 services).
          format: int32
          example: 1
        policies:
          type: integer
          description: Number of policy bundles to be migrated (always 0 or 1 — the project-level security policies covering password rules, session behavior, user limits, and membership privacy).
          format: int32
          example: 1
        smtp:
          type: integer
          description: Number of SMTP configurations to be migrated (always 0 or 1 — the project-level custom SMTP settings; password is not exposed by the source API).
          format: int32
          example: 1
        rule:
          type: integer
          description: Number of custom-domain proxy rules to be migrated. Auto-generated `.appwrite.network` rules are skipped — they are recreated by parent Function/Site migration.
          format: int32
          example: 5
        project-email-template:
          type: integer
          description: Number of custom email templates to be migrated (one per templateId × locale pair).
          format: int32
          example: 7
        site:
          type: integer
          description: Number of sites to be migrated.
          format: int32
          example: 5
        provider:
          type: integer
          description: Number of providers to be migrated.
          format: int32
          example: 5
        topic:
          type: integer
          description: Number of topics to be migrated.
          format: int32
          example: 10
        subscriber:
          type: integer
          description: Number of subscribers to be migrated.
          format: int32
          example: 100
        message:
          type: integer
          description: Number of messages to be migrated.
          format: int32
          example: 50
        size:
          type: integer
          description: Size of files to be migrated in mb.
          format: int32
          example: 30000
        version:
          type: string
          description: Version of the Appwrite instance to be migrated.
          example: 1.4.0
        oauth2-provider:
          type: integer
          description: Number of OAuth2 provider configurations to be migrated. Secrets (clientSecret, p8File) are never migrated — destination admin must re-enter them per provider.
          format: int32
          example: 5
        backup-policy:
          type: integer
          description: Number of backup policies to be migrated.
          format: int32
          example: 5
      required:
      - user
      - team
      - database
      - row
      - file
      - bucket
      - function
      - platform
      - api-key
      - project-variable
      - webhook
      - auth-methods
      - project-protocols
      - project-labels
      - project-services
      - policies
      - smtp
      - rule
      - project-email-template
      - site
      - provider
      - topic
      - subscriber
      - message
      - size
      - version
      - oauth2-provider
      - backup-policy
      example:
        user: 20
        team: 20
        database: 20
        row: 20
        file: 20
        bucket: 20
        function: 20
        platform: 5
        api-key: 5
        project-variable: 5
        webhook: 5
        auth-methods: 1
        project-protocols: 1
        project-labels: 1
        project-services: 1
        policies: 1
        smtp: 1
        rule: 5
        project-email-template: 7
        site: 5
        provider: 5
        topic: 10
        subscriber: 100
        message: 50
        size: 30000
        version: 1.4.0
        oauth2-provider: 5
        backup-policy: 5
