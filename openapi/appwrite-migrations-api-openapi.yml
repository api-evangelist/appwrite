            schema:
              type: object
              properties:
                bucketId:
                  description: Storage bucket unique ID. You can create a new storage bucket using the Storage service [server integration](https://appwrite.io/docs/server/storage#createBucket).
                  type: string
                  example: <BUCKET_ID>
                fileId:
                  description: File ID.
                  type: string
                  example: <FILE_ID>
                databaseId:
                  description: Database ID containing the target collection.
                  type: string
                  example: <DATABASE_ID>
                collectionId:
                  description: Collection ID to import documents into.
                  type: string
                  example: <COLLECTION_ID>
                internalFile:
                  description: Is the file stored in an internal bucket?
                  type: boolean
                  default: false
                  example: false
                onDuplicate:
                  description: 'Behavior when a row with an existing $id is encountered. "fail" (default): abort on first conflict. "skip": silently ignore. "overwrite": replace existing row.'
                  type: string
                  default: fail
                  example: fail
                  title: OnDuplicate
                  oneOf:
                  - type: string
                    enum:
                    - fail
                    title: fail
                  - type: string
                    enum:
                    - skip
                    title: skip
                  - type: string
                    enum:
                    - overwrite
                    title: overwrite
              required:
              - bucketId
              - fileId
              - databaseId
              - collectionId
