                      enum:
                      - collection
                      title: collection
                    - type: string
                      enum:
                      - documentsdb
                      title: documentsdb
                    - type: string
                      enum:
                      - vectorsdb
                      title: vectorsdb
                    - type: string
                      enum:
                      - bucket
                      title: bucket
                    - type: string
                      enum:
                      - file
                      title: file
                    - type: string
                      enum:
                      - function
                      title: function
                    - type: string
                      enum:
                      - deployment
                      title: deployment
                    - type: string
                      enum:
                      - environment-variable
                      title: environment-variable
                    - type: string
                      enum:
                      - provider
                      title: provider
                    - type: string
                      enum:
                      - topic
                      title: topic
                    - type: string
                      enum:
                      - subscriber
                      title: subscriber
                    - type: string
                      enum:
                      - message
                      title: message
                    - type: string
                      enum:
                      - site
                      title: site
                    - type: string
                      enum:
                      - site-deployment
                      title: site-deployment
                    - type: string
                      enum:
                      - site-variable
                      title: site-variable
                    - type: string
                      enum:
                      - platform
                      title: platform
                    - type: string
                      enum:
                      - api-key
                      title: api-key
                    - type: string
                      enum:
                      - webhook
                      title: webhook
                    - type: string
                      enum:
                      - smtp
                      title: smtp
                    - type: string
                      enum:
                      - backup-policy
                      title: backup-policy
                    - type: string
                      enum:
                      - project-variable
                      title: project-variable
                    - type: string
                      enum:
                      - project-protocols
                      title: project-protocols
                    - type: string
                      enum:
                      - project-labels
                      title: project-labels
                    - type: string
                      enum:
                      - project-services
                      title: project-services
                    - type: string
                      enum:
                      - project-email-template
                      title: project-email-template
                    - type: string
                      enum:
                      - rule
                      title: rule
                endpoint:
                  description: Source Appwrite endpoint
                  type: string
                  example: https://example.com
                  format: url
                projectId:
                  description: Source Project ID
                  type: string
                  example: <PROJECT_ID>
                apiKey:
                  description: Source API Key
                  type: string
                  example: <API_KEY>
                onDuplicate:
                  description: 'Behavior when a row with an existing $id is encountered. "fail" (default): abort on first conflict. "skip": silently ignore. "overwrite": replace existing row.'
                  type: string
                  default: fail
                  example: fail
                  title: OnDuplicate
                  oneOf:
                  - type: string
                    enum:
                    - fail
                    title: fail
                  - type: string
                    enum:
                    - skip
                    title: skip
                  - type: string
                    enum:
                    - overwrite
                    title: overwrite
              required:
              - resources
              - endpoint
              - projectId
              - apiKey
  /migrations/appwrite/report:
