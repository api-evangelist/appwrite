components:
  schemas:
    logList:
      description: Logs List
      type: object
      properties:
        total:
          type: integer
          description: Total number of logs that matched your query.
          format: int32
          example: 5
        logs:
          type: array
          description: List of logs.
          items:
            $ref: '#/components/schemas/log'
          example: []
      required:
      - total
      - logs
      example:
        total: 5
        logs: ''
    team:
      description: Team
      type: object
      properties:
        $id:
          type: string
          description: Team ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Team creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Team update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Team name.
          example: VIP
        total:
          type: integer
          description: Total number of team members.
          format: int32
          example: 7
        prefs:
          type: object
          description: Team preferences as a key-value object
          example:
            theme: pink
            timezone: UTC
          allOf:
          - $ref: '#/components/schemas/preferences'
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - total
      - prefs
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: VIP
        total: 7
        prefs:
          theme: pink
          timezone: UTC
    membership:
      description: Membership
      type: object
      properties:
        $id:
          type: string
          description: Membership ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Membership creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Membership update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        userId:
          type: string
          description: User ID.
          example: 5e5ea5c16897e
        userName:
          type: string
          description: User name. Hide this attribute by toggling membership privacy in the Console.
          example: John Doe
        userEmail:
          type: string
          description: User email address. Hide this attribute by toggling membership privacy in the Console.
          example: john@appwrite.io
        userPhone:
          type: string
          description: User phone number. Hide this attribute by toggling membership privacy in the Console.
          example: +1 555 555 5555
        teamId:
          type: string
          description: Team ID.
          example: 5e5ea5c16897e
        teamName:
          type: string
          description: Team name.
          example: VIP
        invited:
          type: string
          description: Date, the user has been invited to join the team in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        joined:
          type: string
          description: Date, the user has accepted the invitation to join the team in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        confirm:
          type: boolean
          description: User confirmation status, true if the user has joined the team or false otherwise.
          example: false
        mfa:
          type: boolean
          description: Multi factor authentication status, true if the user has MFA enabled or false otherwise. Hide this attribute by toggling membership privacy in the Console.
          example: false
        userAccessedAt:
          type: string
          description: Most recent access date in ISO 8601 format. Show this attribute by toggling membership privacy in the Console.
          example: '2020-10-15T06:38:00.000+00:00'
        roles:
          type: array
          description: User list of roles
          items:
            type: string
          example:
          - owner
      required:
      - $id
      - $createdAt
      - $updatedAt
      - userId
      - userName
      - userEmail
      - userPhone
      - teamId
      - teamName
      - invited
      - joined
      - confirm
      - mfa
      - userAccessedAt
      - roles
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        userId: 5e5ea5c16897e
        userName: John Doe
        userEmail: john@appwrite.io
        userPhone: +1 555 555 5555
        teamId: 5e5ea5c16897e
        teamName: VIP
        invited: '2020-10-15T06:38:00.000+00:00'
        joined: '2020-10-15T06:38:00.000+00:00'
        confirm: false
        mfa: false
        userAccessedAt: '2020-10-15T06:38:00.000+00:00'
        roles:
        - owner
    preferences:
      description: Preferences
      type: object
      additionalProperties: true
      example:
        language: en
        timezone: UTC
        darkTheme: true
    log:
      description: Log
      type: object
      properties:
        event:
          type: string
          description: Event name.
          example: account.sessions.create
        userId:
          type: string
          description: User ID of the actor recorded for this log. During impersonation, this is the original impersonator, not the impersonated target user.
          example: 610fc2f985ee0
        userEmail:
          type: string
          description: User email of the actor recorded for this log. During impersonation, this is the original impersonator.
          example: john@appwrite.io
        userName:
          type: string
          description: User name of the actor recorded for this log. During impersonation, this is the original impersonator.
          example: John Doe
        mode:
          type: string
          description: API mode when event triggered.
          example: admin
        userType:
          type: string
          description: 'User type who triggered the audit log. Possible values: user, admin, guest, hidden, keyProject, keyAccount, keyOrganization.'
          example: user
        ip:
          type: string
          description: IP session in use when the session was created.
          example: 127.0.0.1
        time:
          type: string
          description: Log creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        osCode:
          type: string
          description: Operating system code name. View list of [available options](https://github.com/appwrite/appwrite/blob/master/docs/lists/os.json).
          example: Mac
        osName:
          type: string
          description: Operating system name.
          example: Mac
        osVersion:
          type: string
          description: Operating system version.
          example: Mac
        clientType:
          type: string
          description: Client type.
          example: browser
        clientCode:
          type: string
          description: Client code name. View list of [available options](https://github.com/appwrite/appwrite/blob/master/docs/lists/clients.json).
          example: CM
        clientName:
          type: string
          description: Client name.
          example: Chrome Mobile iOS
        clientVersion:
          type: string
          description: Client version.
          example: '84.0'
        clientEngine:
          type: string
          description: Client engine name.
          example: WebKit
        clientEngineVersion:
          type: string
          description: Client engine name.
          example: 605.1.15
        deviceName:
          type: string
          description: Device name.
          example: smartphone
        deviceBrand:
          type: string
          description: Device brand name.
          example: Google
        deviceModel:
          type: string
          description: Device model name.
          example: Nexus 5
        countryCode:
          type: string
          description: Country two-character ISO 3166-1 alpha code.
          example: US
        countryName:
          type: string
          description: Country name.
          example: United States
      required:
      - event
      - userId
      - userEmail
      - userName
      - mode
      - userType
      - ip
      - time
      - osCode
      - osName
      - osVersion
      - clientType
      - clientCode
      - clientName
      - clientVersion
      - clientEngine
      - clientEngineVersion
      - deviceName
      - deviceBrand
      - deviceModel
      - countryCode
      - countryName
      example:
        event: account.sessions.create
        userId: 610fc2f985ee0
        userEmail: john@appwrite.io
        userName: John Doe
        mode: admin
        userType: user
        ip: 127.0.0.1
        time: '2020-10-15T06:38:00.000+00:00'
        osCode: Mac
        osName: Mac
        osVersion: Mac
        clientType: browser
        clientCode: CM
        clientName: Chrome Mobile iOS
        clientVersion: '84.0'
        clientEngine: WebKit
        clientEngineVersion: 605.1.15
        deviceName: smartphone
        deviceBrand: Google
        deviceModel: Nexus 5
        countryCode: US
        countryName: United States
    membershipList:
      description: Memberships List
      type: object
      properties:
        total:
          type: integer
          description: Total number of memberships that matched your query.
          format: int32
          example: 5
        memberships:
          type: array
          description: List of memberships.
          items:
            $ref: '#/components/schemas/membership'
          example: []
      required:
      - total
      - memberships
      example:
        total: 5
        memberships: ''
    appInstallation:
      description: AppInstallation
      type: object
      properties:
        $id:
          type: string
          description: Installation ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Installation creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Installation update time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        appId:
          type: string
          description: ID of the installed application.
          example: 5e5ea5c16897e
        teamId:
          type: string
          description: ID of the team the application is installed on.
          example: 5e5ea5c16897e
        scopes:
          type: array
          description: Scopes granted to the application. Snapshot of the application's installation scopes taken when the installation was created or last updated.
          items:
            type: string
          example:
          - organization:organization.read
        authorizationDetails:
          type: array
          description: Authorization details granted to the application. Rich authorization request (RFC 9396) style entries; the Appwrite Console stores authorized project IDs here.
          items:
            type: object
          example:
          - type: project
            identifiers:
            - '*'
        createdById:
          type: string
          description: ID of the user who created the installation.
          example: 5e5ea5c16897e
        createdByName:
          type: string
          description: Name of the user who created the installation.
          example: Walter White
        lastAccessedAt:
          type:
          - string
          - 'null'
          description: Time an access token was last issued for the installation in ISO 8601 format. Null if never used.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - $id
      - $createdAt
      - $updatedAt
      - appId
      - teamId
      - scopes
      - authorizationDetails
      - createdById
      - createdByName
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        appId: 5e5ea5c16897e
        teamId: 5e5ea5c16897e
        scopes:
        - organization:organization.read
        authorizationDetails:
        - type: project
          identifiers:
          - '*'
        createdById: 5e5ea5c16897e
        createdByName: Walter White
        lastAccessedAt: '2020-10-15T06:38:00.000+00:00'
    teamList:
      description: Teams List
      type: object
      properties:
        total:
          type: integer
          description: Total number of teams that matched your query.
          format: int32
          example: 5
        teams:
          type: array
          description: List of teams.
          items:
            $ref: '#/components/schemas/team'
          example: []
      required:
      - total
      - teams
      example:
        total: 5
        teams: ''
    appInstallationList:
      description: App installations list
      type: object
      properties:
        total:
          type: integer
          description: Total number of installations that matched your query.
          format: int32
          example: 5
        installations:
          type: array
          description: List of installations.
          items:
            $ref: '#/components/schemas/appInstallation'
          example: []
      required:
      - total
      - installations
      example:
        total: 5
        installations: ''
