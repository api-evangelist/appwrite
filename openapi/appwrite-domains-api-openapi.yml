components:
  schemas:
    domainPrice:
      description: DomainPrice
      type: object
      properties:
        domain:
          type: string
          description: Domain name.
          example: example.com
        tld:
          type: string
          description: Top-level domain for the requested domain.
          example: com
        available:
          type: boolean
          description: Whether the domain is currently available for registration.
          example: true
        price:
          type:
          - number
          - 'null'
          description: Domain registration price. Null when the price could not be resolved, for example for an unsupported TLD.
          format: double
          example: 25.99
        periodYears:
          type: integer
          description: Price period in years.
          format: int32
          example: 1
        premium:
          type: boolean
          description: Whether the domain is a premium domain.
          example: false
        renewalPrice:
          type:
          - number
          - 'null'
          description: Domain renewal price for the same period. Null when the domain was not priced or the registrar has no renewal price for it.
          format: double
          example: 27.99
        renewalPeriodYears:
          type: integer
          description: Renewal price period in years.
          format: int32
          example: 1
      required:
      - domain
      - tld
      - available
      - periodYears
      - premium
      - renewalPeriodYears
      example:
        domain: example.com
        tld: com
        available: true
        price: 25.99
        periodYears: 1
        premium: false
        renewalPrice: 27.99
        renewalPeriodYears: 1
    domainsList:
      description: Domains list
      type: object
      properties:
        total:
          type: integer
          description: Total number of domains that matched your query.
          format: int32
          example: 5
        domains:
          type: array
          description: List of domains.
          items:
            $ref: '#/components/schemas/domain'
          example: []
      required:
      - total
      - domains
      example:
        total: 5
        domains: ''
    domainPurchase:
      description: DomainPurchase
      type: object
      properties:
        $id:
          type: string
          description: Purchase/invoice ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Purchase creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Purchase update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        domainId:
          type: string
          description: Domain document ID.
          example: 5e5ea5c16897e
        domain:
          type: string
          description: Domain name.
          example: example.com
        organizationId:
          type: string
          description: Team ID that owns the domain.
          example: 5e5ea5c16897e
        status:
          description: Domain purchase status.
          example: pending
          title: DomainPurchaseStatus
          type: string
          oneOf:
          - type: string
            enum:
            - pending
            title: pending
          - type: string
            enum:
            - succeeded
            title: succeeded
          - type: string
            enum:
            - failed
            title: failed
          - type: string
            enum:
            - cancelled
            title: cancelled
        clientSecret:
          type: string
          description: Stripe client secret for 3DS; empty when not applicable.
          example: ''
        amount:
          type: number
          description: Purchase amount.
          format: double
          example: 25.99
        currency:
          type: string
          description: Currency code.
          example: USD
      required:
      - $id
      - $createdAt
      - $updatedAt
      - domainId
      - domain
      - organizationId
      - status
      - clientSecret
      - amount
      - currency
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        domainId: 5e5ea5c16897e
        domain: example.com
        organizationId: 5e5ea5c16897e
        status: pending
        clientSecret: ''
        amount: 25.99
        currency: USD
    domain:
      description: Domain
      type: object
      properties:
        $id:
          type: string
          description: Domain ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Domain creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Domain update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        domain:
          type: string
          description: Domain name.
          example: example.com
        registrar:
          type: string
          description: Domain registrar (e.g. "appwrite" or "third_party").
          example: appwrite
        nameservers:
          type: string
          description: Nameservers setting. "Appwrite" or empty string.
          example: Appwrite
        expire:
          type: string
          description: Domain expiry date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        renewal:
          type: string
          description: Domain renewal date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        autoRenewal:
          type: boolean
          description: If set to true, the domain will automatically renew.
          example: true
        renewalPrice:
          type: integer
          description: Renewal price (in cents).
          format: int32
          example: 2599
        transferStatus:
          description: Transfer status for domains being transferred in. Null when the domain is not being transferred.
          example: pending_registry
          title: DomainTransferStatusEnum
          type:
          - string
          - 'null'
          oneOf:
          - type: string
            enum:
            - transferrable
            title: transferrable
          - type: string
            enum:
            - not_transferrable
            title: not_transferrable
          - type: string
            enum:
            - pending_owner
            title: pending_owner
          - type: string
            enum:
            - pending_admin
            title: pending_admin
          - type: string
            enum:
            - pending_registry
            title: pending_registry
          - type: string
            enum:
            - completed
            title: completed
          - type: string
            enum:
            - cancelled
            title: cancelled
          - type: string
            enum:
            - service_unavailable
            title: service_unavailable
        teamId:
          type: string
          description: Team ID.
          example: 5e5ea5c16897e
        dnsRecords:
          type: array
          description: Dns records
          items:
            $ref: '#/components/schemas/dnsRecord'
          example: []
      required:
      - $id
      - $createdAt
      - $updatedAt
      - domain
      - registrar
      - nameservers
      - expire
      - renewal
      - autoRenewal
      - renewalPrice
      - teamId
      - dnsRecords
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        domain: example.com
        registrar: appwrite
        nameservers: Appwrite
        expire: '2020-10-15T06:38:00.000+00:00'
        renewal: '2020-10-15T06:38:00.000+00:00'
        autoRenewal: true
        renewalPrice: 2599
        transferStatus: pending_registry
        teamId: 5e5ea5c16897e
        dnsRecords: []
    domainTransferOut:
      description: domainTransferOut
      type: object
      properties:
        authCode:
          type: string
          description: Domain transfer authorization code.
          example: mock_1a2b3c4d
      required:
      - authCode
      example:
        authCode: mock_1a2b3c4d
    domainSuggestionsList:
      description: Domain suggestions list
      type: object
      properties:
        total:
          type: integer
          description: Total number of suggestions that matched your query.
          format: int32
          example: 5
        suggestions:
          type: array
          description: List of suggestions.
          items:
            $ref: '#/components/schemas/domainSuggestion'
          example: []
      required:
      - total
      - suggestions
      example:
        total: 5
        suggestions: ''
    dnsRecord:
      description: DNSRecord
      type: object
      properties:
        $id:
          type: string
          description: DNS Record ID.
          example: 5f40a6e10c65e
        $createdAt:
          type: string
          description: DNS Record creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: DNS Record update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        type:
          type: string
          description: DNS record type (e.g. A, CNAME, MX).
          example: A
        name:
          type: string
          description: Record name or subdomain.
          example: mail
        value:
          type: string
          description: Value of the record (IP address, domain, etc.).
          example: 192.0.2.1
        ttl:
          type: integer
          description: Time to live (in seconds).
          format: int32
          example: 86400
        priority:
          type: integer
          description: Record priority (commonly used for MX).
          format: int32
          example: 10
        lock:
          type: boolean
          description: Whether this record is locked (read-only).
          example: false
        weight:
          type: integer
          description: Record weight (used for SRV records).
          format: int32
          example: 10
        port:
          type: integer
          description: Target port (used for SRV records).
          format: int32
          example: 443
        comment:
          type: string
          description: Comment for the DNS record.
          example: Mail server record
      required:
      - $id
      - $createdAt
      - $updatedAt
      - type
      - name
      - value
      - ttl
      - priority
      - lock
      - weight
      - port
      - comment
      example:
        $id: 5f40a6e10c65e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        type: A
        name: mail
        value: 192.0.2.1
        ttl: 86400
        priority: 10
        lock: false
        weight: 10
        port: 443
        comment: Mail server record
