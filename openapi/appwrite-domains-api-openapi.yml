    domainTransferStatus:
      description: domainTransferStatus
      type: object
      properties:
        status:
          description: Transfer status.
          example: pending_registry
          title: DomainTransferStatusEnum
          type: string
          oneOf:
          - type: string
            enum:
            - transferrable
            title: transferrable
          - type: string
            enum:
            - not_transferrable
            title: not_transferrable
          - type: string
            enum:
            - pending_owner
            title: pending_owner
          - type: string
            enum:
            - pending_admin
            title: pending_admin
          - type: string
            enum:
            - pending_registry
            title: pending_registry
          - type: string
            enum:
            - completed
            title: completed
          - type: string
            enum:
            - cancelled
