                client_secret:
                  description: OAuth2 client secret. Required for confidential apps; omitted for public apps.
                  type: string
                  default: ''
                  example: <CLIENT_SECRET>
              required:
              - token
  /oauth2/{project_id}/token:
    post:
      summary: OAuth2 Token
      operationId: oauth2CreateToken
      tags:
      - OAuth2
      description: Exchange an OAuth2 authorization code, refresh token, or device code for access and refresh tokens.
      responses:
        '200':
          description: OAuth2 Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2Token'
      deprecated: false
      x-appwrite:
        group: tokens
        demo: oauth2/create-token.md
        rate-limit: 60
        rate-time: 60
        rate-key: url:{url},ip:{ip}
        scope: public
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            ProjectPath: []
          client:
            ProjectPath: []
          server:
            ProjectPath: []
            Session: []
      security:
      - ProjectPath: []
        Session: []
        JWT: []
        Key: []
      parameters:
      - name: project_id
        description: Project ID in which OAuth2 client exists.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  description: 'OAuth2 grant type. Can be one of: `authorization_code`, `refresh_token`, `urn:ietf:params:oauth:grant-type:device_code`.'
                  type: string
                  example: <GRANT_TYPE>
                code:
                  description: Authorization code to be exchanged for access and refresh tokens. Required for `authorization_code` grant type.
                  type: string
                  default: ''
                  example: <CODE>
                refresh_token:
                  description: Refresh token to be exchanged for a new access and refresh tokens. Required for `refresh_token` grant type.
                  type: string
                  default: ''
                  example: <REFRESH_TOKEN>
                device_code:
                  description: Device code obtained from the device authorization endpoint. Required for `urn:ietf:params:oauth:grant-type:device_code` grant type.
                  type: string
                  default: ''
                  example: <DEVICE_CODE>
                client_id:
                  description: OAuth2 client ID. Either a registered app ID or an HTTPS client ID metadata document URL.
                  type: string
                  default: ''
                  example: <CLIENT_ID>
                client_secret:
                  description: OAuth2 client secret. Required for confidential apps.
                  type: string
                  default: ''
                  example: <CLIENT_SECRET>
                code_verifier:
                  description: PKCE code verifier. Required for public apps.
                  type: string
                  default: ''
                  example: <CODE_VERIFIER>
                redirect_uri:
                  description: Redirect URI. Required for `authorization_code` grant type.
                  type: string
                  default: ''
                  example: https://example.com
                  format: url
                resource:
                  description: RFC 8707 resource indicator URI or URI list. Each value must be an absolute URI without a fragment.
                  type: string
                  default: []
                audience:
                  description: Compatibility alias for a single OAuth2 resource indicator URI.
                  type: string
                  default: ''
                  example: <AUDIENCE>
              required:
              - grant_type
components:
  schemas:
    oauth2DeviceAuthorization:
      description: OAuth2 Device Authorization
      type: object
      properties:
        device_code:
          type: string
          description: Device verification code used by the client to poll the token endpoint.
          example: 5f3c8d2a1b9e4f7a6c8b2d1e9f4a7b3c5d8e1f2a9b4c7d6e3f5a8b1c4d7e2f9a
        user_code:
          type: string
          description: Short code the end user enters on the verification page.
          example: ABCD-EFGH
        verification_uri:
          type: string
          description: URL where the end user enters the user code.
          example: https://cloud.appwrite.io/console/oauth2/device
        verification_uri_complete:
          type: string
          description: Verification URL with the user code prefilled as a query parameter.
          example: https://cloud.appwrite.io/console/oauth2/device?user_code=ABCD-EFGH
        expires_in:
          type: integer
          description: Lifetime of the device code and user code in seconds.
          format: int32
          example: 900
        interval:
          type: integer
          description: Minimum polling interval for the token endpoint in seconds.
          format: int32
          example: 5
      required:
      - device_code
      - user_code
      - verification_uri
      - verification_uri_complete
      - expires_in
      - interval
      example:
        device_code: 5f3c8d2a1b9e4f7a6c8b2d1e9f4a7b3c5d8e1f2a9b4c7d6e3f5a8b1c4d7e2f9a
        user_code: ABCD-EFGH
        verification_uri: https://cloud.appwrite.io/console/oauth2/device
        verification_uri_complete: https://cloud.appwrite.io/console/oauth2/device?user_code=ABCD-EFGH
        expires_in: 900
        interval: 5
    oauth2Grant:
      description: OAuth2 Grant
      type: object
      properties:
        $id:
          type: string
          description: Grant ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Grant creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Grant update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        userId:
          type: string
          description: ID of the user the grant belongs to.
          example: 5e5ea5c16897e
        appId:
          type: string
          description: ID of the OAuth2 client (app) the grant was requested for.
          example: 5e5ea5c16897e
        scopes:
          type: array
          description: Requested OAuth2 scopes the user is being asked to consent to.
          items:
            type: string
          example:
          - openid
          - email
          - profile
        resources:
          type: array
          description: Requested RFC 8707 resource indicators the user is being asked to consent to.
          items:
            type: string
          example:
          - https://api.example.com/
        authorizationDetails:
          type: string
          description: Requested authorization_details the user is being asked to consent to, as a JSON string. Each entry has a `type` plus project-defined fields.
          example: '[{"type":"calendar","identifier":"primary","actions":["read_events","create_event"]}]'
        prompt:
          type: string
          description: 'OIDC prompt directive the consent screen should honor. Space-separated list of: login, consent, select_account.'
          example: login
        redirectUri:
          type: string
          description: Redirect URI the user will be sent to after the flow completes.
          example: https://example.com/callback
        authTime:
          type: integer
          description: Unix timestamp of when the user last authenticated.
          format: int32
          example: 1592981250
        expire:
          type: string
          description: Grant expiration time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - $id
      - $createdAt
      - $updatedAt
      - userId
      - appId
      - scopes
      - resources
      - authorizationDetails
      - prompt
      - redirectUri
      - authTime
      - expire
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        userId: 5e5ea5c16897e
        appId: 5e5ea5c16897e
        scopes:
        - openid
        - email
        - profile
        resources:
        - https://api.example.com/
        authorizationDetails: '[{"type":"calendar","identifier":"primary","actions":["read_events","create_event"]}]'
        prompt: login
        redirectUri: https://example.com/callback
        authTime: 1592981250
        expire: '2020-10-15T06:38:00.000+00:00'
    oauth2Approve:
      description: OAuth2 Approve
      type: object
      properties:
        redirectUrl:
          type: string
          description: URL the end user should be redirected to after the grant is approved, carrying the authorization `code` and/or `id_token` along with the original `state`.
          example: https://example.com/callback?code=abcde&state=fghij
      required:
      - redirectUrl
      example:
        redirectUrl: https://example.com/callback?code=abcde&state=fghij
    oauth2Organization:
      description: OAuth2 Organization
      type: object
      properties:
        $id:
          type: string
          description: Organization ID.
          example: 5e5ea5c16897e
      required:
      - $id
      example:
        $id: 5e5ea5c16897e
    oauth2PAR:
      description: OAuth2 PAR
      type: object
      properties:
        request_uri:
          type: string
          description: Authorization request handle to pass to the authorize endpoint.
          example: urn:appwrite:oauth2:request:5e5ea5c16897e
        expires_in:
          type: integer
          description: Lifetime of the authorization request handle in seconds.
          format: int32
          example: 600
      required:
      - request_uri
      - expires_in
      example:
        request_uri: urn:appwrite:oauth2:request:5e5ea5c16897e
        expires_in: 600
    oauth2Token:
      description: OAuth2 Token
      type: object
      properties:
        access_token:
          type: string
          description: OAuth2 access token.
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
        token_type:
          type: string
          description: OAuth2 token type.
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          format: int32
          example: 3600
        refresh_token:
          type: string
          description: OAuth2 refresh token.
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        scope:
          type: string
          description: Space-separated scopes granted to the access token.
          example: openid email profile
        authorization_details:
          type:
          - string
          - 'null'
          description: Granted RFC 9396 authorization details as a JSON string.
          example: '[{"type":"calendar","identifier":"primary","actions":["read_events"]}]'
        id_token:
          type:
          - string
          - 'null'
          description: OpenID Connect ID token. Returned when the `openid` scope is granted.
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      - scope
      example:
        access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
        token_type: Bearer
        expires_in: 3600
        refresh_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        scope: openid email profile
        authorization_details: '[{"type":"calendar","identifier":"primary","actions":["read_events"]}]'
        id_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
    oauth2Authorize:
      description: OAuth2 Authorize
      type: object
      properties:
        grantId:
          type: string
          description: OAuth2 grant ID. Set when the user must give explicit consent; pass it to the approve or reject endpoint. Empty when a redirect URL is returned instead.
          example: 5e5ea5c16897e
        redirectUrl:
          type: string
          description: URL the end user should be redirected to when the flow can complete without consent. Empty when consent is still required.
          example: https://example.com/callback?code=abcde&state=fghij
      required:
      - grantId
      - redirectUrl
      example:
        grantId: 5e5ea5c16897e
        redirectUrl: https://example.com/callback?code=abcde&state=fghij
    oauth2OrganizationList:
      description: OAuth2 accessible organizations list
      type: object
      properties:
        total:
          type: integer
          description: Total number of organizations that matched your query.
          format: int32
          example: 5
        organizations:
          type: array
          description: List of organizations.
          items:
            $ref: '#/components/schemas/oauth2Organization'
          example: []
      required:
      - total
      - organizations
      example:
        total: 5
        organizations: ''
    oauth2ProjectList:
      description: OAuth2 accessible projects list
      type: object
      properties:
        total:
          type: integer
          description: Total number of projects that matched your query.
          format: int32
          example: 5
        projects:
          type: array
          description: List of projects.
          items:
            $ref: '#/components/schemas/oauth2Project'
          example: []
      required:
      - total
      - projects
      example:
        total: 5
        projects: ''
    oauth2Reject:
      description: OAuth2 Reject
      type: object
      properties:
        redirectUrl:
          type: string
          description: URL the end user should be redirected to after the grant is rejected, carrying an `access_denied` error.
          example: https://example.com/callback?error=access_denied&state=fghij
      required:
      - redirectUrl
      example:
        redirectUrl: https://example.com/callback?error=access_denied&state=fghij
    oauth2Project:
      description: OAuth2 Project
      type: object
      properties:
        $id:
          type: string
          description: Project ID.
          example: 5e5ea5c16897e
        region:
          type: string
          description: Region ID the project is deployed in.
          example: fra
        endpoint:
          type: string
          description: API endpoint of the region the project is deployed in. Empty when the region has no public hostname configured.
          example: https://fra.cloud.appwrite.io/v1
      required:
      - $id
      - region
      - endpoint
      example:
        $id: 5e5ea5c16897e
        region: fra
        endpoint: https://fra.cloud.appwrite.io/v1
  securitySchemes:
    Project:
      type: apiKey
      name: X-Appwrite-Project
      description: Your project ID
      in: header
