      responses:
        '200':
          description: OAuth2 accessible projects list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2ProjectList'
      deprecated: false
      x-appwrite:
        group: platform
        demo: oauth2/list-projects.md
        rate-limit: 120
        rate-time: 60
        rate-key: url:{url},ip:{ip}
        scope: oauth2.projects.read
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            ProjectPath: []
          client:
            ProjectPath: []
          server:
            ProjectPath: []
            Session: []
      security:
      - ProjectPath: []
        Session: []
        JWT: []
        Key: []
      parameters:
      - name: project_id
        description: Project ID of the console project the OAuth2 access token was issued for.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: limit
        description: Maximum number of projects to return. Between 1 and 5000.
        required: false
        schema:
          type: integer
          format: int32
          example: 1
          default: 25
        in: query
      - name: offset
        description: Number of projects to skip before returning results. Used for pagination.
        required: false
        schema:
          type: integer
          format: int32
          example: 0
          default: 0
        in: query
      - name: search
        description: 'Search term to filter your list results. Max length: 256 chars.'
        required: false
        schema:
          type: string
          example: <SEARCH>
          default: ''
        in: query
  /oauth2/{project_id}/reject:
    post:
      summary: Reject OAuth2
      operationId: oauth2Reject
      tags:
      - OAuth2
      description: Reject an OAuth2 grant when the user denies consent. Returns the `redirectUrl` the end user should be sent to with an `access_denied` error. You can pass Accept header of `application/json` to receive a JSON response instead of a redirect.
      responses:
        '200':
          description: OAuth2 Reject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2Reject'
      deprecated: false
      x-appwrite:
        group: authorization
        demo: oauth2/reject.md
        rate-limit: 10
        rate-time: 60
        rate-key: ip:{ip},userId:{userId}
        scope: oauth2.write
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            ProjectPath: []
          client:
            ProjectPath: []
          server:
            ProjectPath: []
            Session: []
      security:
      - ProjectPath: []
        Session: []
        JWT: []
      parameters:
