        type: scryptMod
        salt: UxLMreBr6tYyjQ==
        saltSeparator: Bw==
        signerKey: XyEKE9RcTDeLEsL/RjwPDBv/RqDl8fb3gpYEOQaPihbxf1ZAtSOHCjuAAa7Q3oHpCYhXSN9tizHgVOwn6krflQ==
    oauth2Consent:
      description: OAuth2 Consent
      type: object
      properties:
        $id:
          type: string
          description: Consent ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Consent creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Consent update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        userId:
          type: string
          description: ID of the user the consent belongs to.
          example: 5e5ea5c16897e
        appId:
          type: string
          description: ID of the registered app the consent was given to. Empty for URL-form (CIMD) clients.
          example: 5e5ea5c16897e
        cimdUrl:
          type: string
          description: Client ID metadata document URL of the client the consent was given to. Empty for registered apps.
          example: https://example.com/.well-known/client-metadata.json
        scopes:
          type: array
          description: OAuth2 scopes the user consented to.
          items:
            type: string
          example:
          - openid
          - email
          - profile
        resources:
          type: array
          description: RFC 8707 resource indicators the user consented to.
          items:
            type: string
          example:
          - https://api.example.com/
        authorizationDetails:
          type: string
          description: Authorization details the user consented to, as a JSON string. Each entry has a `type` plus project-defined fields.
          example: '[{"type":"calendar","identifier":"primary","actions":["read_events","create_event"]}]'
        expire:
          type: string
          description: Consent expiration time in ISO 8601 format. Empty when the consent has no token-bound expiry yet.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - $id
      - $createdAt
      - $updatedAt
      - userId
      - appId
      - cimdUrl
      - scopes
      - resources
      - authorizationDetails
      - expire
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        userId: 5e5ea5c16897e
        appId: 5e5ea5c16897e
        cimdUrl: https://example.com/.well-known/client-metadata.json
        scopes:
        - openid
        - email
        - profile
        resources:
        - https://api.example.com/
        authorizationDetails: '[{"type":"calendar","identifier":"primary","actions":["read_events","create_event"]}]'
        expire: '2020-10-15T06:38:00.000+00:00'
