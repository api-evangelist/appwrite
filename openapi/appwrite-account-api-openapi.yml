    oauth2ConsentToken:
      description: OAuth2 Consent Token
      type: object
      properties:
        $id:
          type: string
          description: Token family ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Token creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Token update date in ISO 8601 format. Refreshing the token family updates this.
          example: '2020-10-15T06:38:00.000+00:00'
        consentId:
          type: string
          description: ID of the consent the token family was issued under.
          example: 5e5ea5c16897e
        userId:
          type: string
          description: ID of the user the token family belongs to.
          example: 5e5ea5c16897e
        appId:
          type: string
          description: ID of the registered app the token family was issued to. Empty for URL-form (CIMD) clients.
          example: 5e5ea5c16897e
        cimdUrl:
          type: string
          description: Client ID metadata document URL of the client the token family was issued to. Empty for registered apps.
          example: https://example.com/.well-known/client-metadata.json
        scopes:
          type: array
          description: OAuth2 scopes granted on the token family.
          items:
            type: string
          example:
          - openid
          - email
          - profile
        resources:
          type: array
          description: RFC 8707 resource indicators granted on the token family.
          items:
            type: string
          example:
          - https://api.example.com/
        authorizationDetails:
          type: string
          description: Authorization details granted on the token family, as a JSON string. Each entry has a `type` plus project-defined fields.
          example: '[{"type":"calendar","identifier":"primary","actions":["read_events","create_event"]}]'
        expire:
          type: string
          description: Expiration time of the current access token of this family in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
      required:
      - $id
      - $createdAt
      - $updatedAt
      - consentId
      - userId
      - appId
      - cimdUrl
      - scopes
      - resources
      - authorizationDetails
      - expire
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        consentId: 5e5ea5c16897e
        userId: 5e5ea5c16897e
        appId: 5e5ea5c16897e
        cimdUrl: https://example.com/.well-known/client-metadata.json
        scopes:
        - openid
        - email
        - profile
        resources:
        - https://api.example.com/
        authorizationDetails: '[{"type":"calendar","identifier":"primary","actions":["read_events","create_event"]}]'
        expire: '2020-10-15T06:38:00.000+00:00'
    key:
      description: Key
      type: object
      properties:
        $id:
          type: string
          description: Key ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Key creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
