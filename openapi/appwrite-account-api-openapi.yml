components:
  schemas:
    algoScrypt:
      description: AlgoScrypt
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: scrypt
        costCpu:
          type: integer
          description: CPU complexity of computed hash.
          format: int32
          example: 8
        costMemory:
          type: integer
          description: Memory complexity of computed hash.
          format: int32
          example: 14
        costParallel:
          type: integer
          description: Parallelization of computed hash.
          format: int32
          example: 1
        length:
          type: integer
          description: Length used to compute hash.
          format: int32
          example: 64
      required:
      - type
      - costCpu
      - costMemory
      - costParallel
      - length
      example:
        type: scrypt
        costCpu: 8
        costMemory: 14
        costParallel: 1
        length: 64
    logList:
      description: Logs List
      type: object
      properties:
        total:
          type: integer
          description: Total number of logs that matched your query.
          format: int32
          example: 5
        logs:
          type: array
          description: List of logs.
          items:
            $ref: '#/components/schemas/log'
          example: []
      required:
      - total
      - logs
      example:
        total: 5
        logs: ''
    algoBcrypt:
      description: AlgoBcrypt
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: bcrypt
      required:
      - type
      example:
        type: bcrypt
    sessionList:
      description: Sessions List
      type: object
      properties:
        total:
          type: integer
          description: Total number of sessions that matched your query.
          format: int32
          example: 5
        sessions:
          type: array
          description: List of sessions.
          items:
            $ref: '#/components/schemas/session'
          example: []
      required:
      - total
      - sessions
      example:
        total: 5
        sessions: ''
    token:
      description: Token
      type: object
      properties:
        $id:
          type: string
          description: Token ID.
          example: bb8ea5c16897e
        $createdAt:
          type: string
          description: Token creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        userId:
          type: string
          description: User ID.
          example: 5e5ea5c168bb8
        secret:
          type: string
          description: Token secret key. This will return an empty string unless the response is returned using an API key or as part of a webhook payload.
          example: ''
        expire:
          type: string
          description: Token expiration date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        phrase:
          type: string
          description: Security phrase of a token. Empty if security phrase was not requested when creating a token. It includes randomly generated phrase which is also sent in the external resource such as email.
          example: Golden Fox
      required:
      - $id
      - $createdAt
      - userId
      - secret
      - expire
      - phrase
      example:
        $id: bb8ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        userId: 5e5ea5c168bb8
        secret: ''
        expire: '2020-10-15T06:38:00.000+00:00'
        phrase: Golden Fox
    invoice:
      description: Invoice
      type: object
      properties:
        $id:
          type: string
          description: Invoice ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Invoice creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Invoice update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $permissions:
          type: array
