openapi: 3.2.0
info:
  version: 2.0.0
  title: Appwrite Account API
  description: Appwrite backend as a service cuts up to 70% of the time and costs required for building a modern application. We abstract and simplify common development tasks behind a REST APIs, to help you develop your app in a fast and secure way. For full API documentation and tutorials go to https://appwrite.io/docs
  termsOfService: https://appwrite.io/policy/terms
  contact:
    name: Appwrite Team
    url: https://appwrite.io/support
    email: team@appwrite.io
  license:
    name: BSD-3-Clause
    url: https://raw.githubusercontent.com/appwrite/appwrite/master/LICENSE
servers:
- url: https://cloud.appwrite.io/v1
  description: Appwrite Cloud endpoint.
- url: https://{region}.cloud.appwrite.io/v1
  description: Appwrite Cloud regional endpoint. Replace `{region}` with your project region.
  variables:
    region:
      default: fra
      description: Appwrite Cloud region.
tags:
- name: Account
  description: The Account service allows you to authenticate and manage a user account.
paths:
  /account:
    get:
      summary: Get account
      operationId: accountGet
      tags:
      - Account
      description: Get the currently logged in user.
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
      deprecated: false
      x-appwrite:
        group: account
        demo: account/get.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
    post:
      summary: Create account
      operationId: accountCreate
      tags:
      - Account
      description: Use this endpoint to allow a new user to register a new account in your project. After the user registration completes successfully, you can use the /account/verfication route to start verifying the user email address. To allow the new user to login to their new account, you need to create a new account session.
      responses:
        '201':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
      deprecated: false
      x-appwrite:
        group: account
        demo: account/create.md
        rate-limit: 10
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: sessions.write
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  description: User ID. Choose a custom ID or generate a random ID with `ID.unique()`. Valid chars are a-z, A-Z, 0-9, period, hyphen, and underscore. Can't start with a special char. Max length is 36 chars.
                  type: string
                  example: <USER_ID>
                  x-appwrite:
                    idGenerator: ID.unique
                email:
                  description: User email.
                  type: string
                  example: email@example.com
                  format: email
                password:
                  description: New user password. Must be between 8 and 256 chars.
                  type: string
                  example: password
                  format: password
                name:
                  description: 'User name. Max length: 128 chars.'
                  type: string
                  default: ''
                  example: <NAME>
              required:
              - userId
              - email
              - password
    delete:
      summary: Delete account
      operationId: accountDelete
      tags:
      - Account
      description: Delete the currently logged in user.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: account
        demo: account/delete.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
  /account/billing-addresses:
    get:
      summary: List billing addresses
      operationId: accountListBillingAddresses
      tags:
      - Account
      description: List all billing addresses for a user.
      responses:
        '200':
          description: Billing address list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billingAddressList'
      deprecated: false
      x-appwrite:
        group: null
        demo: account/list-billing-addresses.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/databases#querying-documents). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: userId, expired, failed'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
    post:
      summary: Create billing address
      operationId: accountCreateBillingAddress
      tags:
      - Account
      description: Add a new billing address to a user's account.
      responses:
        '201':
          description: Address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billingAddress'
      deprecated: false
      x-appwrite:
        group: null
        demo: account/create-billing-address.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                country:
                  description: Country
                  type: string
                  example: <COUNTRY>
                city:
                  description: City
                  type: string
                  example: <CITY>
                streetAddress:
                  description: Street address
                  type: string
                  example: <STREET_ADDRESS>
                addressLine2:
                  description: Address line 2
                  type: string
                  default: ''
                  example: <ADDRESS_LINE2>
                state:
                  description: State or province
                  type: string
                  default: ''
                  example: <STATE>
                postalCode:
                  description: Postal code
                  type: string
                  default: ''
                  example: <POSTAL_CODE>
              required:
              - country
              - city
              - streetAddress
  /account/billing-addresses/{billingAddressId}:
    get:
      summary: Get billing address
      operationId: accountGetBillingAddress
      tags:
      - Account
      description: Get a specific billing address for a user using it's ID.
      responses:
        '200':
          description: Address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billingAddress'
      deprecated: false
      x-appwrite:
        group: null
        demo: account/get-billing-address.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: billingAddressId
        description: Unique ID of billing address
        required: true
        schema:
          type: string
          example: <BILLING_ADDRESS_ID>
        in: path
    put:
      summary: Update billing address
      operationId: accountUpdateBillingAddress
      tags:
      - Account
      description: Update a specific billing address using it's ID.
      responses:
        '200':
          description: Address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billingAddress'
      deprecated: false
      x-appwrite:
        group: null
        demo: account/update-billing-address.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: billingAddressId
        description: Unique ID of billing address
        required: true
        schema:
          type: string
          example: <BILLING_ADDRESS_ID>
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                country:
                  description: Country
                  type: string
                  example: <COUNTRY>
                city:
                  description: City
                  type: string
                  example: <CITY>
                streetAddress:
                  description: Street address
                  type: string
                  example: <STREET_ADDRESS>
                addressLine2:
                  description: Address line 2
                  type: string
                  default: ''
                  example: <ADDRESS_LINE2>
                state:
                  description: State or province
                  type: string
                  default: ''
                  example: <STATE>
                postalCode:
                  description: Postal code
                  type: string
                  default: ''
                  example: <POSTAL_CODE>
              required:
              - country
              - city
              - streetAddress
    delete:
      summary: Delete billing address
      operationId: accountDeleteBillingAddress
      tags:
      - Account
      description: Delete a specific billing address using it's ID.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: null
        demo: account/delete-billing-address.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: billingAddressId
        description: Billing address unique ID
        required: true
        schema:
          type: string
          example: <BILLING_ADDRESS_ID>
        in: path
  /account/consents:
    get:
      summary: List consents
      operationId: accountListConsents
      tags:
      - Account
      description: Get a list of the OAuth2 consents the current user has given to third-party apps.
      responses:
        '200':
          description: OAuth2 consents list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2ConsentList'
      deprecated: false
      x-appwrite:
        group: consents
        demo: account/list-consents.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      parameters:
      - name: queries
        description: Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long.
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
  /account/consents/{consentId}:
    get:
      summary: Get consent
      operationId: accountGetConsent
      tags:
      - Account
      description: Get an OAuth2 consent the current user has given to a third-party app by its unique ID.
      responses:
        '200':
          description: OAuth2 Consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2Consent'
      deprecated: false
      x-appwrite:
        group: consents
        demo: account/get-consent.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      parameters:
      - name: consentId
        description: Consent unique ID.
        required: true
        schema:
          type: string
          example: <CONSENT_ID>
        in: path
    delete:
      summary: Delete consent
      operationId: accountDeleteConsent
      tags:
      - Account
      description: Delete an OAuth2 consent by its unique ID. All token families issued under the consent are revoked, and the app must ask for consent again to regain access.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: consents
        demo: account/delete-consent.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      parameters:
      - name: consentId
        description: Consent unique ID.
        required: true
        schema:
          type: string
          example: <CONSENT_ID>
        in: path
  /account/consents/{consentId}/tokens:
    get:
      summary: List consent tokens
      operationId: accountListConsentTokens
      tags:
      - Account
      description: Get a list of the token families issued under an OAuth2 consent. Each entry represents one authorized device or session; the token secrets themselves are never returned.
      responses:
        '200':
          description: OAuth2 consent tokens list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2ConsentTokenList'
      deprecated: false
      x-appwrite:
        group: consents
        demo: account/list-consent-tokens.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      parameters:
      - name: consentId
        description: Consent unique ID.
        required: true
        schema:
          type: string
          example: <CONSENT_ID>
        in: path
      - name: queries
        description: Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long.
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
  /account/consents/{consentId}/tokens/{tokenId}:
    get:
      summary: Get consent token
      operationId: accountGetConsentToken
      tags:
      - Account
      description: Get a token family issued under an OAuth2 consent by its unique ID. The token secrets themselves are never returned.
      responses:
        '200':
          description: OAuth2 Consent Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2ConsentToken'
      deprecated: false
      x-appwrite:
        group: consents
        demo: account/get-consent-token.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      parameters:
      - name: consentId
        description: Consent unique ID.
        required: true
        schema:
          type: string
          example: <CONSENT_ID>
        in: path
      - name: tokenId
        description: Token unique ID.
        required: true
        schema:
          type: string
          example: <TOKEN_ID>
        in: path
    delete:
      summary: Delete consent token
      operationId: accountDeleteConsentToken
      tags:
      - Account
      description: Delete a token family issued under an OAuth2 consent by its unique ID. The access and refresh tokens of the family stop working immediately; other token families and the consent itself are unaffected.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: consents
        demo: account/delete-consent-token.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      parameters:
      - name: consentId
        description: Consent unique ID.
        required: true
        schema:
          type: string
          example: <CONSENT_ID>
        in: path
      - name: tokenId
        description: Token unique ID.
        required: true
        schema:
          type: string
          example: <TOKEN_ID>
        in: path
  /account/coupons/{couponId}:
    get:
      summary: Get coupon details
      operationId: accountGetCoupon
      tags:
      - Account
      description: Get coupon details for an account.
      responses:
        '200':
          description: Coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coupon'
      deprecated: false
      x-appwrite:
        group: null
        demo: account/get-coupon.md
        rate-limit: 50
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
