      - name: couponId
        description: ID of the coupon
        required: true
        schema:
          type: string
          example: <COUPON_ID>
        in: path
  /account/email:
    patch:
      summary: Update email
      operationId: accountUpdateEmail
      tags:
      - Account
      description: 'Update currently logged in user account email address. After changing user address, the user confirmation status will get reset. A new confirmation email is not sent automatically however you can use the send confirmation email endpoint again to send the confirmation email. For security measures, user password is required to complete this request.

        This endpoint can also be used to convert an anonymous account to a normal one, by passing an email address and a new password.'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
      deprecated: false
      x-appwrite:
        group: account
        demo: account/update-email.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: User email.
                  type: string
                  example: email@example.com
                  format: email
                password:
                  description: User password. Must be at least 8 chars.
                  type: string
                  example: password
                  format: password
              required:
              - email
              - password
  /account/identities:
    get:
      summary: List identities
      operationId: accountListIdentities
      tags:
      - Account
      description: Get the list of identities for the currently logged in user.
      responses:
        '200':
          description: Identities List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/identityList'
      deprecated: false
      x-appwrite:
        group: identities
        demo: account/list-identities.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      parameters:
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: userId, provider, providerUid, providerEmail, providerAccessTokenExpiry'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
  /account/identities/{identityId}:
    delete:
      summary: Delete identity
      operationId: accountDeleteIdentity
      tags:
      - Account
      description: Delete an identity by its unique ID.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: identities
        demo: account/delete-identity.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: account
        platforms:
        - console
        - client
        - server
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
          server:
            Project: []
            Session: []
      security:
      - Project: []
        Session: []
        JWT: []
      parameters:
      - name: identityId
        description: Identity ID.
        required: true
        schema:
          type: string
          example: <IDENTITY_ID>
        in: path
  /account/invoices:
    get:
      summary: List invoices
      operationId: accountListInvoices
      tags:
      - Account
      description: List all invoices tied to an account.
      responses:
        '200':
          description: Billing invoices list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoiceList'
      deprecated: false
      x-appwrite:
        group: null
        demo: account/list-invoices.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: teams.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/databases#querying-documents). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: teamId, aggregationId, type, amount, currency, from, to, dueAt, attempts, status, grossAmount'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
  /account/jwts:
    post:
      summary: Create JWT
      operationId: accountCreateJWT
      tags:
      - Account
      description: Use this endpoint to create a JSON Web Token. You can use the resulting JWT to authenticate on behalf of the current user when working with the Appwrite server-side API and SDKs. The JWT secret is valid for 15 minutes from its creation and will be invalid if the user will logout in that time frame.
      responses:
        '201':
          description: JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jwt'
      deprecated: false
      x-appwrite:
        group: tokens
        demo: account/create-jwt.md
        rate-limit: 120
        rate-time: 60
        rate-key: url:{url},userId:{userId}
        scope: account
        platforms:
        - console
        - client
        packaging: false
        public: true
        auth:
          console:
            Project: []
          client:
            Project: []
      security:
      - Project: []
        Session: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration:
                  description: Time in seconds before JWT expires. Default duration is 900 seconds, and maximum is 3600 seconds.
                  type: integer
                  default: 900
                  example: 0
                  format: int32
  /account/keys:
    get:
