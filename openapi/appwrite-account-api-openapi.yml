        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: Apple iPhone 12
        userId: '259125845563242502'
        providerId: '259125845563242502'
        providerType: email
        identifier: token
        expired: false
    algoScryptModified:
      description: AlgoScryptModified
      type: object
      properties:
        type:
          type: string
          description: Algo type.
          example: scryptMod
        salt:
          type: string
          description: Salt used to compute hash.
          example: UxLMreBr6tYyjQ==
        saltSeparator:
          type: string
          description: Separator used to compute hash.
          example: Bw==
        signerKey:
          type: string
          description: Key used to compute hash.
          example: XyEKE9RcTDeLEsL/RjwPDBv/RqDl8fb3gpYEOQaPihbxf1ZAtSOHCjuAAa7Q3oHpCYhXSN9tizHgVOwn6krflQ==
      required:
      - type
      - salt
      - saltSeparator
      - signerKey
