    consoleVariables:
      description: Console Variables
      type: object
      properties:
        _APP_DOMAIN_TARGET_CNAME:
          type: string
          description: CNAME target for your Appwrite custom domains.
          example: appwrite.io
        _APP_DOMAIN_TARGET_A:
          type: string
          description: A target for your Appwrite custom domains.
          example: 127.0.0.1
        _APP_COMPUTE_BUILD_TIMEOUT:
          type: integer
          description: Maximum build timeout in seconds.
          format: int32
          example: 900
        _APP_DOMAIN_TARGET_AAAA:
          type: string
          description: AAAA target for your Appwrite custom domains.
          example: ::1
        _APP_DOMAIN_TARGET_CAA:
          type: string
          description: CAA target for your Appwrite custom domains.
          example: digicert.com
        _APP_STORAGE_LIMIT:
          type: integer
          description: Maximum file size allowed for file upload in bytes.
          format: int32
          example: 30000000
        _APP_COMPUTE_SIZE_LIMIT:
          type: integer
          description: Maximum file size allowed for deployment in bytes.
          format: int32
          example: 30000000
        _APP_USAGE_STATS:
          type: string
          description: Defines if usage stats are enabled. This value is set to 'enabled' by default, to disable the usage stats set the value to 'disabled'.
          example: enabled
        _APP_VCS_ENABLED:
          type: boolean
          description: Defines if VCS (Version Control System) is enabled.
          example: true
        _APP_VCS_PROVIDERS:
          type: array
          description: List of configured VCS providers.
          items:
            type: string
          example:
          - github
        _APP_VCS_PROVIDERS_WITH_REPOSITORY_CREATION:
          type: array
          description: List of configured VCS providers that support repository creation.
          items:
            type: string
          example:
          - github
        _APP_VCS_PROVIDERS_WITH_PUBLIC_REPOSITORIES:
          type: array
          description: List of configured VCS providers that can host public repositories.
          items:
            type: string
          example:
          - github
        _APP_DOMAIN_ENABLED:
          type: boolean
          description: Defines if main domain is configured. If so, custom domains can be created.
          example: true
        _APP_ASSISTANT_ENABLED:
          type: boolean
          description: Defines if AI assistant is enabled.
          example: true
        _APP_DOMAIN_SITES:
          type: string
          description: A comma separated list of domains to use for site URLs.
          example: sites.localhost,sites.example.com
        _APP_DOMAIN_FUNCTIONS:
          type: string
          description: A domain to use for function URLs.
          example: functions.localhost
        _APP_OPTIONS_FORCE_HTTPS:
          type: string
          description: Defines if HTTPS is enforced for all requests.
          example: enabled
        _APP_DOMAINS_NAMESERVERS:
          type: string
          description: Comma-separated list of nameservers.
          example: ns1.example.com,ns2.example.com
        _APP_DB_ADAPTER:
          type: string
          description: Database adapter in use.
          example: mysql
        supportForRelationships:
          type: boolean
          description: Whether the database adapter supports relationships.
          example: true
        supportForOperators:
          type: boolean
          description: Whether the database adapter supports operators.
          example: true
        supportForSpatials:
          type: boolean
          description: Whether the database adapter supports spatial attributes.
          example: true
        supportForSpatialIndexNull:
          type: boolean
          description: Whether the database adapter supports spatial indexes on nullable columns.
          example: false
        supportForFulltextWildcard:
          type: boolean
          description: Whether the database adapter supports fulltext wildcard search.
          example: true
        supportForMultipleFulltextIndexes:
          type: boolean
          description: Whether the database adapter supports multiple fulltext indexes per collection.
          example: true
        supportForAttributeResizing:
          type: boolean
          description: Whether the database adapter supports resizing attributes.
          example: true
        supportForSchemas:
          type: boolean
          description: Whether the database adapter supports fixed schemas with row width limits.
          example: true
        maxIndexLength:
          type: integer
          description: Maximum index length supported by the database adapter.
          format: int32
          example: 768
        supportForIntegerIds:
          type: boolean
          description: Whether the database adapter uses integer sequence IDs.
          example: true
        _APP_CONSOLE_EMAIL_VERIFICATION:
          type: string
          description: Whether email verification for console users is required. Can be "true" or "false".
          example: 'true'
      required:
      - _APP_DOMAIN_TARGET_CNAME
      - _APP_DOMAIN_TARGET_A
      - _APP_COMPUTE_BUILD_TIMEOUT
      - _APP_DOMAIN_TARGET_AAAA
      - _APP_DOMAIN_TARGET_CAA
      - _APP_STORAGE_LIMIT
      - _APP_COMPUTE_SIZE_LIMIT
      - _APP_USAGE_STATS
      - _APP_VCS_ENABLED
      - _APP_VCS_PROVIDERS
      - _APP_VCS_PROVIDERS_WITH_REPOSITORY_CREATION
      - _APP_VCS_PROVIDERS_WITH_PUBLIC_REPOSITORIES
      - _APP_DOMAIN_ENABLED
      - _APP_ASSISTANT_ENABLED
      - _APP_DOMAIN_SITES
      - _APP_DOMAIN_FUNCTIONS
      - _APP_OPTIONS_FORCE_HTTPS
      - _APP_DOMAINS_NAMESERVERS
      - _APP_DB_ADAPTER
      - supportForRelationships
      - supportForOperators
      - supportForSpatials
      - supportForSpatialIndexNull
      - supportForFulltextWildcard
      - supportForMultipleFulltextIndexes
      - supportForAttributeResizing
      - supportForSchemas
      - maxIndexLength
      - supportForIntegerIds
      - _APP_CONSOLE_EMAIL_VERIFICATION
      example:
        _APP_DOMAIN_TARGET_CNAME: appwrite.io
        _APP_DOMAIN_TARGET_A: 127.0.0.1
        _APP_COMPUTE_BUILD_TIMEOUT: 900
        _APP_DOMAIN_TARGET_AAAA: ::1
        _APP_DOMAIN_TARGET_CAA: digicert.com
        _APP_STORAGE_LIMIT: '30000000'
        _APP_COMPUTE_SIZE_LIMIT: '30000000'
        _APP_USAGE_STATS: enabled
        _APP_VCS_ENABLED: true
        _APP_VCS_PROVIDERS:
        - github
        _APP_VCS_PROVIDERS_WITH_REPOSITORY_CREATION:
        - github
        _APP_VCS_PROVIDERS_WITH_PUBLIC_REPOSITORIES:
        - github
        _APP_DOMAIN_ENABLED: true
        _APP_ASSISTANT_ENABLED: true
        _APP_DOMAIN_SITES: sites.localhost,sites.example.com
        _APP_DOMAIN_FUNCTIONS: functions.localhost
        _APP_OPTIONS_FORCE_HTTPS: enabled
        _APP_DOMAINS_NAMESERVERS: ns1.example.com,ns2.example.com
        _APP_DB_ADAPTER: mysql
        supportForRelationships: true
        supportForOperators: true
        supportForSpatials: true
        supportForSpatialIndexNull: false
        supportForFulltextWildcard: true
        supportForMultipleFulltextIndexes: true
        supportForAttributeResizing: true
        supportForSchemas: true
        maxIndexLength: 768
        supportForIntegerIds: true
        _APP_CONSOLE_EMAIL_VERIFICATION: 'true'
