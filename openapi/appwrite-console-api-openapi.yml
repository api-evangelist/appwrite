      deprecated: false
      x-appwrite:
        group: null
        demo: console/list-regions.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
  /console/resources:
    get:
      summary: Check resource ID availability
      operationId: consoleGetResource
      tags:
      - Console
      description: Check if a resource ID is available.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: null
        demo: console/get-resource.md
        rate-limit: 120
        rate-time: 60
        rate-key: userId:{userId}, url:{url}
        scope: rules.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: value
        description: Resource value.
        required: true
        schema:
          type: string
          example: <VALUE>
        in: query
      - name: type
        description: Resource type.
        required: true
        schema:
          type: string
          example: rules
          title: ConsoleResourceType
          oneOf:
          - type: string
            enum:
            - rules
            title: rules
        in: query
  /console/scopes/organization:
    get:
      summary: List organization scopes
      operationId: consoleListOrganizationScopes
      tags:
      - Console
      description: List all scopes available for organization API keys, along with a description for each scope.
