openapi: 3.2.0
info:
  version: 2.0.0
  title: Appwrite Console API
  description: Appwrite backend as a service cuts up to 70% of the time and costs required for building a modern application. We abstract and simplify common development tasks behind a REST APIs, to help you develop your app in a fast and secure way. For full API documentation and tutorials go to https://appwrite.io/docs
  termsOfService: https://appwrite.io/policy/terms
  contact:
    name: Appwrite Team
    url: https://appwrite.io/support
    email: team@appwrite.io
  license:
    name: BSD-3-Clause
    url: https://raw.githubusercontent.com/appwrite/appwrite/master/LICENSE
servers:
- url: https://cloud.appwrite.io/v1
  description: Appwrite Cloud endpoint.
- url: https://{region}.cloud.appwrite.io/v1
  description: Appwrite Cloud regional endpoint. Replace `{region}` with your project region.
  variables:
    region:
      default: fra
      description: Appwrite Cloud region.
tags:
- name: Console
  description: The Console service allows you to interact with console relevant information.
paths:
  /console/campaigns/{campaignId}:
    get:
      summary: Get campaign details
      operationId: consoleGetCampaign
      tags:
      - Console
      description: Receive the details of a campaign using its ID.
      responses:
        '201':
          description: Campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/campaign'
      deprecated: false
      x-appwrite:
        group: null
        demo: console/get-campaign.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: public
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: campaignId
        description: ID of the campaign
        required: true
        schema:
          type: string
          example: <CAMPAIGN_ID>
        in: path
  /console/coupons/{couponId}:
    get:
      summary: Get coupon details
      operationId: consoleGetCoupon
      tags:
      - Console
      description: Get the details of a coupon using it's coupon ID.
      responses:
        '201':
          description: Coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coupon'
      deprecated: false
      x-appwrite:
        group: null
        demo: console/get-coupon.md
        rate-limit: 50
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: public
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: couponId
        description: ID of the coupon
        required: true
        schema:
          type: string
          example: <COUPON_ID>
        in: path
  /console/databases:
    get:
      summary: List databases
      operationId: consoleListDatabases
      tags:
      - Console
      description: Get a list of all the project's databases. You can use the query params to filter your results. This returns every database across all types and product APIs in a single call.
      responses:
        '200':
          description: Databases List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/databaseList'
      deprecated: false
      x-appwrite:
        group: null
        demo: console/list-databases.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: databases.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: name'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: search
        description: 'Search term to filter your list results. Max length: 256 chars.'
        required: false
        schema:
          type: string
          example: <SEARCH>
          default: ''
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
  /console/oauth2-providers:
    get:
      summary: List OAuth2 providers
      operationId: consoleListOAuth2Providers
      tags:
      - Console
      description: List all OAuth2 providers supported by the Appwrite server, along with the parameters required to configure each provider. The response excludes mock providers but includes sandbox providers.
      responses:
        '200':
          description: Console OAuth2 Providers List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/consoleOAuth2ProviderList'
      deprecated: false
      x-appwrite:
        group: console
        demo: console/list-o-auth-2-providers.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: public
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
  /console/plans:
    get:
      summary: Get plans
      operationId: consoleGetPlans
      tags:
      - Console
      description: Return a list of all available plans.
      responses:
        '200':
          description: Billing plan list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billingPlanList'
      deprecated: false
      x-appwrite:
        group: null
        demo: console/get-plans.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: platform
        description: Platform type
        required: false
        schema:
          type: string
          example: appwrite
          title: Platform
          oneOf:
          - type: string
            enum:
            - appwrite
            title: appwrite
          - type: string
            enum:
            - imagine
            title: imagine
          default: appwrite
        in: query
  /console/plans/{planId}:
    get:
      summary: Get plan
      operationId: consoleGetPlan
      tags:
      - Console
      description: Get the details of a plan using its plan ID.
      responses:
        '200':
          description: billingPlan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billingPlan'
      deprecated: false
      x-appwrite:
        group: null
        demo: console/get-plan.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: planId
        description: Plan id
        required: true
        schema:
          type: string
          example: <PLAN_ID>
        in: path
  /console/postgres-extensions:
    get:
      summary: List Postgres extensions
      operationId: consoleListPostgresExtensions
      tags:
      - Console
      description: Get the catalog of Postgres extensions that can be installed on a dedicated Postgres database.
      responses:
        '200':
          description: Postgres extensions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postgresExtensionList'
      deprecated: false
      x-appwrite:
        group: null
        demo: console/list-postgres-extensions.md
        rate-limit: 100
        rate-time: 3600
        rate-key: ip:{ip}
        scope: public
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
  /console/programs/{programId}:
    get:
      summary: Get program details
      operationId: consoleGetProgram
      tags:
      - Console
      description: Receive the details of a program using its ID.
      responses:
        '201':
          description: Program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/program'
      deprecated: false
      x-appwrite:
        group: null
        demo: console/get-program.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: teams.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: programId
        description: ID of the program
        required: true
        schema:
          type: string
          example: <PROGRAM_ID>
        in: path
  /console/programs/{programId}/memberships:
    post:
      summary: Create program membership
      operationId: consoleCreateProgramMembership
      tags:
      - Console
      description: Create a new membership for an account to a program.
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization'
      deprecated: false
      x-appwrite:
        group: null
        demo: console/create-program-membership.md
        rate-limit: 10
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: teams.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: programId
        description: ID of the program
        required: true
        schema:
          type: string
          example: <PROGRAM_ID>
        in: path
  /console/regions:
    get:
      summary: List Regions
      operationId: consoleListRegions
      tags:
      - Console
      description: Get all available regions for the console.
      responses:
