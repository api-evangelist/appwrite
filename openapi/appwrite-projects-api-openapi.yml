openapi: 3.2.0
info:
  version: 2.0.0
  title: Appwrite Projects API
  description: Appwrite backend as a service cuts up to 70% of the time and costs required for building a modern application. We abstract and simplify common development tasks behind a REST APIs, to help you develop your app in a fast and secure way. For full API documentation and tutorials go to https://appwrite.io/docs
  termsOfService: https://appwrite.io/policy/terms
  contact:
    name: Appwrite Team
    url: https://appwrite.io/support
    email: team@appwrite.io
  license:
    name: BSD-3-Clause
    url: https://raw.githubusercontent.com/appwrite/appwrite/master/LICENSE
servers:
- url: https://cloud.appwrite.io/v1
  description: Appwrite Cloud endpoint.
- url: https://{region}.cloud.appwrite.io/v1
  description: Appwrite Cloud regional endpoint. Replace `{region}` with your project region.
  variables:
    region:
      default: fra
      description: Appwrite Cloud region.
tags:
- name: Projects
  description: The Project service allows you to manage all the projects in your Appwrite server.
paths:
  /projects/{projectId}/addons:
    get:
      summary: List project addons
      operationId: projectsListAddons
      tags:
      - Projects
      description: List all billing addons for a project.
      responses:
        '200':
          description: Addons list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addonList'
      deprecated: false
      x-appwrite:
        group: null
        demo: projects/list-addons.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project ID
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
  /projects/{projectId}/addons/premium-geo-db:
    post:
      summary: Create Premium Geo DB addon for project
      operationId: projectsCreatePremiumGeoDBAddon
      tags:
      - Projects
      description: Create a Premium Geo DB addon for a project.
      responses:
        '201':
          description: Addon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addon'
      deprecated: false
      x-appwrite:
        group: null
        demo: projects/create-premium-geo-db-addon.md
        rate-limit: 10
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project ID
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
  /projects/{projectId}/addons/{addonId}:
    get:
      summary: Get project addon
      operationId: projectsGetAddon
      tags:
      - Projects
      description: Get the details of a billing addon for a project.
      responses:
        '200':
          description: Addon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addon'
      deprecated: false
      x-appwrite:
        group: null
        demo: projects/get-addon.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project ID
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: addonId
        description: Addon ID
        required: true
        schema:
          type: string
          example: <ADDON_ID>
        in: path
    delete:
      summary: Delete project addon
      operationId: projectsDeleteAddon
      tags:
      - Projects
      description: Delete a billing addon for a project.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: null
        demo: projects/delete-addon.md
        rate-limit: 10
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project ID
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: addonId
        description: Addon ID
        required: true
        schema:
          type: string
          example: <ADDON_ID>
        in: path
  /projects/{projectId}/addons/{addonId}/confirmations:
    post:
      summary: Confirm project addon payment after 3DS authentication
      operationId: projectsConfirmAddonPayment
      tags:
      - Projects
      description: Confirm payment for a billing addon for a project.
      responses:
        '200':
          description: Addon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addon'
      deprecated: false
      x-appwrite:
        group: null
        demo: projects/confirm-addon-payment.md
        rate-limit: 10
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project ID
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: addonId
        description: Addon ID
        required: true
        schema:
          type: string
          example: <ADDON_ID>
        in: path
  /projects/{projectId}/addons/{addon}/price:
    get:
      summary: Get project addon price
      operationId: projectsGetAddonPrice
      tags:
      - Projects
      description: Get the price details for a billing addon for a project, including the prorated amount for the remaining days in the current billing cycle.
      responses:
        '200':
          description: AddonPrice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addonPrice'
      deprecated: false
      x-appwrite:
        group: null
        demo: projects/get-addon-price.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project ID
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: addon
        description: Addon key identifier (e.g. premiumGeoDB).
        required: true
        schema:
          type: string
          example: baa
        in: path
  /projects/{projectId}/console-access:
    patch:
      summary: Record console access to a project
      operationId: projectsUpdateConsoleAccess
      tags:
      - Projects
      description: Record console access to a project. This endpoint updates the last accessed timestamp for the project to track console activity.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: null
        demo: projects/update-console-access.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project ID
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
  /projects/{projectId}/dev-keys:
    get:
      summary: List dev keys
      operationId: projectsListDevKeys
      tags:
      - Projects
      description: List all the project\'s dev keys. Dev keys are project specific and allow you to bypass rate limits and get better error logging during development.'
      responses:
        '200':
          description: Dev Keys List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devKeyList'
      deprecated: false
      x-appwrite:
        group: devKeys
        demo: projects/list-dev-keys.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: devKeys.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: accessedAt, expire'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
  /projects/{projectId}/dev-keys/{keyId}:
    get:
      summary: Get dev key
      operationId: projectsGetDevKey
      tags:
      - Projects
      description: Get a project\'s dev key by its unique ID. Dev keys are project specific and allow you to bypass rate limits and get better error logging during development.
      responses:
        '200':
          description: DevKey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devKey'
      deprecated: false
      x-appwrite:
        group: devKeys
        demo: projects/get-dev-key.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: devKeys.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: keyId
        description: Key unique ID.
        required: true
        schema:
          type: string
          example: <KEY_ID>
        in: path
    put:
      summary: Update dev key
      operationId: projectsUpdateDevKey
      tags:
      - Projects
      description: Update a project\'s dev key by its unique ID. Use this endpoint to update a project\'s dev key name or expiration time.'
      responses:
        '200':
          description: DevKey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devKey'
      deprecated: false
      x-appwrite:
        group: devKeys
        demo: projects/update-dev-key.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: devKeys.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: keyId
        description: Key unique ID.
        required: true
        schema:
          type: string
          example: <KEY_ID>
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: 'Key name. Max length: 128 chars.'
                  type: string
                  example: <NAME>
                expire:
                  description: Expiration time in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
                  type: string
                  example: '2020-10-15T06:38:00.000+00:00'
                  format: datetime
              required:
              - name
              - expire
    delete:
      summary: Delete dev key
      operationId: projectsDeleteDevKey
      tags:
      - Projects
      description: Delete a project\'s dev key by its unique ID. Once deleted, the key will no longer allow bypassing of rate limits and better logging of errors.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: devKeys
        demo: projects/delete-dev-key.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: devKeys.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: keyId
        description: Key unique ID.
        required: true
        schema:
          type: string
          example: <KEY_ID>
        in: path
  /projects/{projectId}/schedules:
    get:
      summary: List schedules
      operationId: projectsListSchedules
      tags:
      - Projects
      description: Get a list of all the project's schedules. You can use the query params to filter your results.
      responses:
        '200':
          description: Schedules List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scheduleList'
      deprecated: false
      x-appwrite:
        group: schedules
        demo: projects/list-schedules.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: schedules.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: queries
        description: 'Array of query strings generated using the Query class provided by the SDK. [Learn more about queries](https://appwrite.io/docs/queries). Maximum of 100 queries are allowed, each 4096 characters long. You may filter on the following attributes: resourceType, resourceId, projectId, schedule, active, region'
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
        in: query
      - name: total
        description: When set to false, the total count returned will be 0 and will not be calculated.
        required: false
        schema:
          type: boolean
          example: false
          default: true
        in: query
    post:
      summary: Create schedule
      operationId: projectsCreateSchedule
      tags:
      - Projects
      description: Create a new schedule for a resource.
      responses:
        '201':
          description: Schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schedule'
      deprecated: false
      x-appwrite:
        group: schedules
        demo: projects/create-schedule.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: schedules.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resourceType:
                  description: 'The resource type for the schedule. Possible values: function, execution, message, backup.'
                  type: string
                  example: function
                  title: ScheduleResourceType
                  oneOf:
                  - type: string
                    enum:
                    - function
                    title: function
                  - type: string
                    enum:
                    - execution
                    title: execution
                  - type: string
                    enum:
                    - message
                    title: message
                  - type: string
                    enum:
                    - backup
                    title: backup
                resourceId:
                  description: The resource ID to associate with this schedule.
                  type: string
                  example: <RESOURCE_ID>
                schedule:
                  description: Schedule CRON expression.
                  type: string
                  example: 0 0 * * *
                active:
                  description: Whether the schedule is active.
                  type: boolean
                  default: false
                  example: false
                data:
                  description: Schedule data as a JSON string. Used to store resource-specific context needed for execution.
                  type: object
                  default: {}
                  example: {}
              required:
              - resourceType
              - resourceId
              - schedule
  /projects/{projectId}/schedules/{scheduleId}:
    get:
      summary: Get schedule
      operationId: projectsGetSchedule
      tags:
      - Projects
      description: Get a schedule by its unique ID.
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schedule'
      deprecated: false
      x-appwrite:
        group: schedules
        demo: projects/get-schedule.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: schedules.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: scheduleId
        description: Schedule ID.
        required: true
        schema:
          type: string
          example: <SCHEDULE_ID>
        in: path
  /projects/{projectId}/stages:
    get:
      summary: List stages
      operationId: projectsListStages
      tags:
      - Projects
      description: Get the onboarding stages for the current project, including each stage’s SDK method key and status (for example pending, completed, or skipped).
      responses:
        '200':
          description: Stages List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stageList'
      deprecated: false
      x-appwrite:
        group: stages
        demo: projects/list-stages.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: stages.read
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
  /projects/{projectId}/stages/{stageId}:
    patch:
      summary: Update stage
      operationId: projectsUpdateStage
      tags:
      - Projects
      description: Update an onboarding stage for the current project. Use this endpoint to skip a stage or leave it unchanged without performing the related API action.
      responses:
        '200':
          description: Stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stage'
      deprecated: false
      x-appwrite:
        group: stages
        demo: projects/update-stage.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: stages.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      - name: stageId
        description: SDK method key (namespace.method).
        required: true
        schema:
          type: string
          example: <STAGE_ID>
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skip:
                  description: Mark the stage as skipped.
                  type: boolean
                  default: true
                  example: false
  /projects/{projectId}/status:
    patch:
      summary: Update the status of a project
      operationId: projectsUpdateStatus
      tags:
      - Projects
      description: Update the status of a project. Can be used to archive/restore projects, and to restore paused projects. When restoring a paused project, the console fingerprint header must be provided and the project must not be blocked for any reason other than inactivity.
      responses:
        '204':
          description: No content
      deprecated: false
      x-appwrite:
        group: null
        demo: projects/update-status.md
        rate-limit: 10
        rate-time: 3600
        rate-key: ip:{ip},userId:{userId}
        scope: projects.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project ID
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  description: New status for the project
                  type: string
                  example: active
                  title: Status
                  oneOf:
                  - type: string
                    enum:
                    - active
                    title: active
              required:
              - status
  /projects/{projectId}/team:
    patch:
      summary: Update project team
      operationId: projectsUpdateTeam
      tags:
      - Projects
      description: Update the team ID of a project allowing for it to be transferred to another team.
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project'
      deprecated: false
      x-appwrite:
        group: projects
        demo: projects/update-team.md
        rate-limit: 0
        rate-time: 3600
        rate-key: url:{url},ip:{ip}
        scope: projects.write
        platforms:
        - console
        packaging: false
        public: true
        auth:
          console:
            Project: []
      security:
      - Project: []
      parameters:
      - name: projectId
        description: Project unique ID.
        required: true
        schema:
          type: string
          example: <PROJECT_ID>
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  description: Team ID of the team to transfer project to.
                  type: string
                  example: <TEAM_ID>
              required:
              - teamId
components:
  schemas:
    projectProtocol:
      description: ProjectProtocol
      type: object
      properties:
        $id:
          description: Protocol ID.
          example: graphql
          title: ProjectProtocolId
          type: string
          oneOf:
          - type: string
            enum:
            - rest
            title: rest
          - type: string
            enum:
            - graphql
            title: graphql
          - type: string
            enum:
            - websocket
            title: websocket
        enabled:
          type: boolean
          description: Protocol status.
          example: false
      required:
      - $id
      - enabled
      example:
        $id: graphql
        enabled: false
    project:
      description: Project
      type: object
      properties:
        $id:
          type: string
          description: Project ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Project creation date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Project update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Project name.
          example: New Project
        teamId:
          type: string
          description: Project team ID.
          example: '1592981250'
        region:
          type: string
          description: Project region
          example: fra
        devKeys:
          type: array
          description: 'Deprecated since 1.9.5: List of dev keys.'
          items:
            $ref: '#/components/schemas/devKey'
          example: []
        smtpEnabled:
          type: boolean
          description: Status for custom SMTP
          example: false
        smtpSenderName:
          type: string
          description: SMTP sender name
          example: John Appwrite
        smtpSenderEmail:
          type: string
          description: SMTP sender email
          example: john@appwrite.io
        smtpReplyToName:
          type: string
          description: SMTP reply to name
          example: Support Team
        smtpReplyToEmail:
          type: string
          description: SMTP reply to email
          example: support@appwrite.io
        smtpHost:
          type: string
          description: SMTP server host name
          example: mail.appwrite.io
        smtpPort:
          type: integer
          description: SMTP server port
          format: int32
          example: 25
        smtpUsername:
          type: string
          description: SMTP server username
          example: emailuser
        smtpPassword:
          type: string
          description: SMTP server password. This property is write-only and always returned empty.
          format: password
          example: smtp-password
        smtpSecure:
          type: string
          description: SMTP server secure protocol
          example: tls
        pingCount:
          type: integer
          description: Number of times the ping was received for this project.
          format: int32
          example: 1
        pingedAt:
          type: string
          description: Last ping datetime in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        labels:
          type: array
          description: Labels for the project.
