components:
  schemas:
    targetList:
      description: Target list
      type: object
      properties:
        total:
          type: integer
          description: Total number of targets that matched your query.
          format: int32
          example: 5
        targets:
          type: array
          description: List of targets.
          items:
            $ref: '#/components/schemas/target'
          example: []
      required:
      - total
      - targets
      example:
        total: 5
        targets: ''
    message:
      description: Message
      type: object
      properties:
        $id:
          type: string
          description: Message ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Message creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Message update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        providerType:
          type: string
          description: Message provider type.
          example: email
        topics:
          type: array
          description: Topic IDs set as recipients.
          items:
            type: string
          example:
          - 5e5ea5c16897e
        users:
          type: array
          description: User IDs set as recipients.
          items:
            type: string
          example:
          - 5e5ea5c16897e
        targets:
          type: array
          description: Target IDs set as recipients.
          items:
            type: string
          example:
          - 5e5ea5c16897e
        scheduledAt:
          type:
          - string
          - 'null'
          description: The scheduled time for message.
          example: '2020-10-15T06:38:00.000+00:00'
        deliveredAt:
          type:
          - string
          - 'null'
          description: The time when the message was delivered.
          example: '2020-10-15T06:38:00.000+00:00'
        deliveryErrors:
          type:
          - array
          - 'null'
          description: Delivery errors if any.
          items:
            type: string
          example:
          - 'Failed to send message to target 5e5ea5c16897e: Credentials not valid.'
        deliveredTotal:
          type: integer
          description: Number of recipients the message was delivered to.
          format: int32
          example: 1
        data:
          type: object
          additionalProperties: true
          description: Data of the message.
          example:
            subject: Welcome to Appwrite
            content: Hi there, welcome to Appwrite family.
        status:
          description: Status of delivery.
          example: processing
          type: string
          oneOf:
          - type: string
            enum:
            - draft
            title: draft
          - type: string
            enum:
            - processing
            title: processing
          - type: string
            enum:
            - scheduled
            title: scheduled
          - type: string
            enum:
            - sent
            title: sent
          - type: string
            enum:
            - failed
            title: failed
      required:
      - $id
      - $createdAt
      - $updatedAt
      - providerType
      - topics
      - users
      - targets
      - deliveredTotal
      - data
      - status
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        providerType: email
        topics:
        - 5e5ea5c16897e
        users:
        - 5e5ea5c16897e
        targets:
        - 5e5ea5c16897e
        scheduledAt: '2020-10-15T06:38:00.000+00:00'
        deliveredAt: '2020-10-15T06:38:00.000+00:00'
        deliveryErrors:
        - 'Failed to send message to target 5e5ea5c16897e: Credentials not valid.'
        deliveredTotal: 1
        data:
          subject: Welcome to Appwrite
          content: Hi there, welcome to Appwrite family.
        status: processing
    target:
      description: Target
      type: object
      properties:
        $id:
          type: string
          description: Target ID.
          example: '259125845563242502'
        $createdAt:
          type: string
          description: Target creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Target update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: Target Name.
          example: Apple iPhone 12
        userId:
          type: string
          description: User ID.
          example: '259125845563242502'
        providerId:
          type:
          - string
          - 'null'
          description: Provider ID.
          example: '259125845563242502'
        providerType:
          type: string
          description: 'The target provider type. Can be one of the following: `email`, `sms` or `push`.'
          example: email
        identifier:
          type: string
          description: The target identifier.
          example: token
        expired:
          type: boolean
          description: Is the target expired.
          example: false
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - userId
      - providerType
      - identifier
      - expired
      example:
        $id: '259125845563242502'
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: Apple iPhone 12
        userId: '259125845563242502'
        providerId: '259125845563242502'
        providerType: email
        identifier: token
        expired: false
    messageList:
      description: Message list
      type: object
      properties:
        total:
          type: integer
          description: Total number of messages that matched your query.
          format: int32
          example: 5
        messages:
          type: array
          description: List of messages.
          items:
            $ref: '#/components/schemas/message'
          example: []
      required:
      - total
      - messages
      example:
        total: 5
        messages: ''
    topic:
      description: Topic
      type: object
      properties:
        $id:
          type: string
          description: Topic ID.
          example: '259125845563242502'
        $createdAt:
          type: string
          description: Topic creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Topic update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: The name of the topic.
          example: events
        emailTotal:
          type: integer
          description: Total count of email subscribers subscribed to the topic.
          format: int32
          example: 100
        smsTotal:
          type: integer
          description: Total count of SMS subscribers subscribed to the topic.
          format: int32
          example: 100
        pushTotal:
          type: integer
          description: Total count of push subscribers subscribed to the topic.
          format: int32
          example: 100
        subscribe:
          type: array
          description: Subscribe permissions.
          items:
            type: string
          example:
          - users
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - emailTotal
      - smsTotal
      - pushTotal
      - subscribe
      example:
        $id: '259125845563242502'
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: events
        emailTotal: 100
        smsTotal: 100
        pushTotal: 100
        subscribe: users
    topicList:
      description: Topic list
      type: object
      properties:
        total:
          type: integer
          description: Total number of topics that matched your query.
          format: int32
          example: 5
        topics:
          type: array
          description: List of topics.
          items:
            $ref: '#/components/schemas/topic'
          example: []
      required:
      - total
      - topics
      example:
        total: 5
        topics: ''
    providerList:
      description: Provider list
      type: object
      properties:
        total:
          type: integer
          description: Total number of providers that matched your query.
          format: int32
          example: 5
        providers:
          type: array
          description: List of providers.
          items:
            $ref: '#/components/schemas/provider'
          example: []
      required:
      - total
      - providers
      example:
        total: 5
        providers: ''
    provider:
      description: Provider
      type: object
      properties:
        $id:
          type: string
          description: Provider ID.
          example: 5e5ea5c16897e
        $createdAt:
          type: string
          description: Provider creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Provider update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        name:
          type: string
          description: The name for the provider instance.
          example: Mailgun
        provider:
          type: string
          description: The name of the provider service.
          example: mailgun
        enabled:
          type: boolean
          description: Is provider enabled?
          example: true
        type:
          type: string
          description: Type of provider.
          example: sms
        credentials:
          type: object
          additionalProperties: true
          description: Provider credentials.
          example:
            key: '123456789'
        options:
          type: object
          additionalProperties: true
          description: Provider options.
          example:
            from: sender-email@mydomain
      required:
      - $id
      - $createdAt
      - $updatedAt
      - name
      - provider
      - enabled
      - type
      - credentials
      example:
        $id: 5e5ea5c16897e
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        name: Mailgun
        provider: mailgun
        enabled: true
        type: sms
        credentials:
          key: '123456789'
        options:
          from: sender-email@mydomain
    subscriber:
      description: Subscriber
      type: object
      properties:
        $id:
          type: string
          description: Subscriber ID.
          example: '259125845563242502'
        $createdAt:
          type: string
          description: Subscriber creation time in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        $updatedAt:
          type: string
          description: Subscriber update date in ISO 8601 format.
          example: '2020-10-15T06:38:00.000+00:00'
        targetId:
          type: string
          description: Target ID.
          example: '259125845563242502'
        target:
          type: object
          description: Target.
          example:
            $id: '259125845563242502'
            $createdAt: '2020-10-15T06:38:00.000+00:00'
            $updatedAt: '2020-10-15T06:38:00.000+00:00'
            providerType: email
            providerId: '259125845563242502'
            name: ageon-app-email
            identifier: random-mail@email.org
            userId: 5e5ea5c16897e
          allOf:
          - $ref: '#/components/schemas/target'
        userId:
          type: string
          description: Topic ID.
          example: 5e5ea5c16897e
        userName:
          type: string
          description: User Name.
          example: Aegon Targaryen
        topicId:
          type: string
          description: Topic ID.
          example: '259125845563242502'
        providerType:
          type: string
          description: 'The target provider type. Can be one of the following: `email`, `sms` or `push`.'
          example: email
      required:
      - $id
      - $createdAt
      - $updatedAt
      - targetId
      - target
      - userId
      - userName
      - topicId
      - providerType
      example:
        $id: '259125845563242502'
        $createdAt: '2020-10-15T06:38:00.000+00:00'
        $updatedAt: '2020-10-15T06:38:00.000+00:00'
        targetId: '259125845563242502'
        target:
          $id: '259125845563242502'
          $createdAt: '2020-10-15T06:38:00.000+00:00'
          $updatedAt: '2020-10-15T06:38:00.000+00:00'
          providerType: email
          providerId: '259125845563242502'
          name: ageon-app-email
          identifier: random-mail@email.org
          userId: 5e5ea5c16897e
        userId: 5e5ea5c16897e
        userName: Aegon Targaryen
        topicId: '259125845563242502'
        providerType: email
    subscriberList:
      description: Subscriber list
      type: object
      properties:
        total:
          type: integer
          description: Total number of subscribers that matched your query.
          format: int32
          example: 5
        subscribers:
          type: array
          description: List of subscribers.
          items:
            $ref: '#/components/schemas/subscriber'
          example: []
      required:
      - total
      - subscribers
      example:
        total: 5
        subscribers: ''
  securitySchemes:
    Project:
      type: apiKey
      name: X-Appwrite-Project
      description: Your project ID
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
        demo: <YOUR_PROJECT_ID>
    ProjectPath:
      type: apiKey
      name: project
      description: Your project ID
      in: query
      x-appwrite:
        location: path
        param: project_id
        platforms:
        - client
        - server
        - console
        demo: <YOUR_PROJECT_ID>
    JWT:
      type: apiKey
      name: X-Appwrite-JWT
      description: Your secret JSON Web Token
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
        demo: <YOUR_JWT>
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The OAuth access token to authenticate with
      x-appwrite:
        platforms:
        - client
        - server
        - console
    Locale:
      type: apiKey
      name: X-Appwrite-Locale
      description: ''
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
        demo: en
    Session:
      type: apiKey
      name: X-Appwrite-Session
      description: The user session to authenticate with
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    DevKey:
      type: apiKey
      name: X-Appwrite-Dev-Key
      description: Your secret dev API key
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    Cookie:
      type: apiKey
      name: Cookie
      description: The user cookie to authenticate with. Used by SDKs that forward an incoming Cookie header in server-side runtimes.
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    ImpersonateUserId:
      type: apiKey
      name: X-Appwrite-Impersonate-User-Id
      description: Impersonate a user by ID
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    ImpersonateUserEmail:
      type: apiKey
      name: X-Appwrite-Impersonate-User-Email
      description: Impersonate a user by email
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    ImpersonateUserPhone:
      type: apiKey
      name: X-Appwrite-Impersonate-User-Phone
      description: Impersonate a user by phone
      in: header
      x-appwrite:
        platforms:
        - client
        - server
        - console
    Key:
      type: apiKey
      name: X-Appwrite-Key
      description: Your secret API key
      in: header
      x-appwrite:
        platforms:
        - server
        - console
        - manager
        demo: <YOUR_API_KEY>
    Organization:
      type: apiKey
      name: X-Appwrite-Organization
      description: Your organization ID
      in: header
      x-appwrite:
        platforms:
        - server
        - console
        demo: <YOUR_ORGANIZATION_ID>
    ForwardedUserAgent:
      type: apiKey
      name: X-Forwarded-User-Agent
      description: The user agent string of the client that made the request
      in: header
      x-appwrite:
        platforms:
        - server
    Mode:
      type: apiKey
      name: X-Appwrite-Mode
      description: ''
      in: header
      x-appwrite:
        platforms:
        - console
        demo: ''
    Platform:
      type: apiKey
      name: X-Appwrite-Platform
      description: The platform type (Appwrite or Imagine)
      in: header
      x-appwrite:
        platforms:
        - console
