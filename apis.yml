aid: appwrite
name: Appwrite
description: 'Appwrite is an open-source backend platform for web, mobile and AI applications, shipped both as a
  self-hostable BSD-3-Clause server and as the managed Appwrite Cloud. One REST API — 1,022 operations across 44
  services in the published Appwrite 2.0 OpenAPI, mirrored field-for-field in GraphQL — covers authentication and
  user management, four database engines (TablesDB, DocumentsDB, VectorsDB and managed PostgreSQL, MySQL and MongoDB),
  file storage with an S3-compatible surface, serverless Functions, static and SSR Sites hosting, messaging, realtime
  presence over WebSocket, domains and DNS, backups and a WAF. Appwrite is unusually far forward on the agent layer:
  it serves an SEP-1649 MCP Server Card and a Domain AI Catalog from its own domain, runs a hosted OAuth-protected
  MCP endpoint at mcp.appwrite.io alongside a stdio server for self-hosted instances, publishes eleven Agent Skills
  through a machine-readable discovery index, and gives every documentation, blog and changelog page a Markdown
  twin.'
type: Index
position: Producing
